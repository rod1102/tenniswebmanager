<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classements — Tennis Web Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260829">
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-inner">
            <div class="dashboard-header">
                <a href="index.html" class="auth-logo">TENNIS WEB MANAGER</a>
                <div class="nav-menu">
                    <button class="nav-menu-toggle" id="nav-toggle">Menu <span class="nav-menu-caret">▾</span></button>
                    <div class="nav-menu-dropdown" id="nav-dropdown">
                        <a href="accueil.html">Accueil</a>
                        <a href="joueur.html">Mes joueurs</a>
                        <a href="tournois.html">Tournois</a>
                        <a href="matchs.html">Matchs</a>
                        <a href="classements.html">Classements</a>
                        <a href="pronostics.html">Pronostics</a>
                        <a href="presse.html">Presse</a>
                        <a href="annuaire.html">Annuaire</a>
                        <a href="capitanat.html">Capitanat</a>
                        <a href="statistiques.html">Statistiques</a>
                        <a href="regles.html">Règles</a>
                        <a href="https://discord.gg/9RwtWEyjF" target="_blank" rel="noopener">Discord</a>
                        <a href="admin.html" id="admin-link" style="display:none;">Administration</a>
                        <a href="#" id="logout-btn">Déconnexion</a>
                    </div>
                </div>
            </div>

            <h1 class="dashboard-title">Classements</h1>
            <div style="text-align:center;">
                <span class="week-badge" id="semaine-badge">Semaine actuelle : ...</span>
            </div>

            <div class="tabs-nav" id="tabs-nav-circuit">
                <button class="tab-btn active" data-circuit="atp">ATP</button>
                <button class="tab-btn" data-circuit="wta">WTA</button>
                <button class="tab-btn" data-circuit="coach">Coach</button>
            </div>
            <div class="tabs-nav" id="tabs-nav-type"></div>

            <div class="tab-panel">
                <table class="classement-table">
                    <thead id="classement-thead">
                        <tr><th>Rang</th><th id="classement-entete-nom">Joueur</th><th>Points</th></tr>
                    </thead>
                    <tbody id="classement-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('currentUserId');

        if (!userId) {
            window.location.href = 'connexion.html';
        }

        let classementData = null;
        let pronosData = null;
        let nationData = { atp: null, wta: null, coach: null };
        let circuitCourant = 'atp';
        let typeCourant = 'live';

        // Options de 2e niveau : les memes 4 partout (Live/Race/Nation/Pronos), que ce
        // soit pour un circuit (ATP/WTA) ou pour la vue Coach (somme des 2 personnages).
        const OPTIONS_TYPE = {
            atp: [{ cle: 'live', libelle: 'Live' }, { cle: 'race', libelle: 'Race' }, { cle: 'nation', libelle: 'Nation' }, { cle: 'pronos', libelle: 'Pronos' }],
            wta: [{ cle: 'live', libelle: 'Live' }, { cle: 'race', libelle: 'Race' }, { cle: 'nation', libelle: 'Nation' }, { cle: 'pronos', libelle: 'Pronos' }],
            coach: [{ cle: 'live', libelle: 'Live' }, { cle: 'race', libelle: 'Race' }, { cle: 'nation', libelle: 'Nation' }, { cle: 'pronos', libelle: 'Pronos' }]
        };

        function construireOngletsType() {
            const nav = document.getElementById('tabs-nav-type');
            const options = OPTIONS_TYPE[circuitCourant];
            typeCourant = options[0].cle;
            nav.innerHTML = options.map(function (o, i) {
                return `<button class="tab-btn${i === 0 ? ' active' : ''}" data-type="${o.cle}">${o.libelle}</button>`;
            }).join('');
            nav.querySelectorAll('.tab-btn').forEach(function (bouton) {
                bouton.addEventListener('click', function () {
                    nav.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
                    bouton.classList.add('active');
                    typeCourant = bouton.dataset.type;
                    afficherClassement();
                });
            });
        }

        function flagImg(code) {
            if (!code) return '';
            return `<img class="flag-icon" src="https://flagcdn.com/24x18/${code}.png" alt="">`;
        }

        function formaterNomComplet(nomComplet) {
            if (!nomComplet) return nomComplet;
            // Cas coach avec 2 personnages : "Prenom Nom / Prenom Nom" (classement Pronos
            // combine) - formate chaque moitie separement plutot que de ne traiter que le
            // dernier mot du tout.
            if (nomComplet.indexOf(' / ') !== -1) {
                return nomComplet.split(' / ').map(formaterNomComplet).join(' / ');
            }
            const i = nomComplet.lastIndexOf(' ');
            if (i === -1) return nomComplet;
            const prenom = nomComplet.slice(0, i).toLowerCase().replace(/(^|[\s'-])\p{L}/gu, function (c) { return c.toUpperCase(); });
            return prenom + ' ' + nomComplet.slice(i + 1).toUpperCase();
        }

        function libellePhase(phase) {
            if (phase.type === 'presaison') return 'Pré-saison (Saison ' + phase.numeroSaison + ')';
            if (phase.type === 's0') return 'Semaine 0 (Saison ' + phase.numeroSaison + ')';
            return 'Semaine ' + phase.positionSemaine + ' (Saison ' + phase.numeroSaison + ')';
        }

        async function chargerSemaine() {
            const response = await fetch('/api/semaine');
            const data = await response.json();
            if (response.ok) {
                document.getElementById('semaine-badge').textContent = 'Semaine actuelle : ' + libellePhase(data.phase);
            }
        }

        async function verifierAdmin() {
            const response = await fetch('/api/utilisateur/' + userId);
            const data = await response.json();
            if (response.ok && data.user.role === 'admin') {
                document.getElementById('admin-link').style.display = 'inline-block';
            }
        }

        // Une ligne represente un coach (pas un joueur/rival precis) des qu'on est sur
        // Pronos (n'importe quel onglet) ou sur l'onglet Coach en Live/Race - dans ces
        // cas l'identite pointe vers coach.html via userId plutot que vers la fiche
        // adversaire d'un joueur/rival precis (`cle`).
        function estIdentiteCoach() {
            return typeCourant === 'pronos' || circuitCourant === 'coach';
        }

        function ligneHtml(j, rang) {
            // Coach en Live/Race : pas de drapeau propre au coach, on montre plutot ses
            // deux personnages (joueur ATP + joueuse WTA) chacun avec son drapeau.
            const estCoachLiveRace = circuitCourant === 'coach' && (typeCourant === 'live' || typeCourant === 'race');
            let nomAffiche;
            if (estCoachLiveRace) {
                const partieJoueur = j.joueurAtp ? `${flagImg(j.joueurAtp.drapeau)} ${formaterNomComplet(j.joueurAtp.nom)}` : '—';
                const partieJoueuse = j.joueurWta ? `${flagImg(j.joueurWta.drapeau)} ${formaterNomComplet(j.joueurWta.nom)}` : '—';
                nomAffiche = `${formaterNomComplet(j.nom)} (${partieJoueur} - ${partieJoueuse})`;
            } else {
                nomAffiche = `${flagImg(j.drapeau)} ${formaterNomComplet(j.nom)}`;
            }
            let nomHtml = nomAffiche;

            // Ma propre ligne pointe vers la meme fiche adversaire.html que les autres
            // joueurs reels (Infos/Palmares/Badges/...), pas vers joueur.html (page de
            // gestion) - demande explicite de l'utilisateur.
            if (estIdentiteCoach()) {
                if (j.userId) {
                    nomHtml = `<a class="lien-adversaire" href="coach.html?id=${j.userId}">${nomAffiche}</a>`;
                }
            } else if (j.cle) {
                if (j.cle.indexOf('rival:') === 0) {
                    nomHtml = `<a class="lien-adversaire classement-bot" href="adversaire.html?type=rival&id=${j.cle.slice(6)}">${nomAffiche}</a>`;
                } else if (j.cle.indexOf('joueur:') === 0) {
                    nomHtml = `<a class="lien-adversaire" href="adversaire.html?type=reel&id=${j.cle.slice(7)}">${nomAffiche}</a>`;
                }
            }

            const peutDetailler = typeCourant === 'live' || typeCourant === 'race';
            const boutonDetail = peutDetailler
                ? `<button class="pts-detail-btn" data-cle="${j.cle || ''}" data-user-id="${j.userId || ''}" data-type="${typeCourant}" title="Détail des points">?</button>`
                : '';

            return `
                <tr class="${j.estMoi ? 'classement-moi' : ''}">
                    <td class="rang">${rang}</td>
                    <td>${nomHtml}</td>
                    <td class="pts">${j.points} ${boutonDetail}</td>
                </tr>
            `;
        }

        function ligneNationHtml(n, rang) {
            const boutonDetail = `<button class="pts-detail-btn" data-nation="${encodeURIComponent(n.nation)}" data-circuit="${PARAM_NATIONS[circuitCourant]}" title="Détail des points">?</button>`;
            return `
                <tr>
                    <td class="rang">${rang}</td>
                    <td>${flagImg(n.drapeau)} <a class="lien-adversaire" href="pays.html?nation=${encodeURIComponent(n.nation)}">${n.nation}</a></td>
                    <td class="pts">${n.points} ${boutonDetail}</td>
                </tr>
            `;
        }

        function afficherClassementNation() {
            const thead = document.getElementById('classement-thead');
            const corps = document.getElementById('classement-body');
            thead.innerHTML = '<tr><th>Rang</th><th>Nation</th><th>Points</th></tr>';

            const liste = nationData[circuitCourant];
            if (!liste || liste.length === 0) {
                corps.innerHTML = '<tr><td colspan="3" class="match-hint">Aucun classement disponible pour le moment.</td></tr>';
                return;
            }

            corps.innerHTML = liste.map(function (n, i) { return ligneNationHtml(n, i + 1); }).join('');
        }

        function afficherClassement() {
            const thead = document.getElementById('classement-thead');
            const corps = document.getElementById('classement-body');

            if (typeCourant === 'nation') {
                afficherClassementNation();
                return;
            }
            thead.innerHTML = '<tr><th>Rang</th><th id="classement-entete-nom">Joueur</th><th>Points</th></tr>';
            document.getElementById('classement-entete-nom').textContent = estIdentiteCoach() ? 'Coach' : 'Joueur';

            let liste;
            if (typeCourant === 'pronos') {
                const cle = circuitCourant === 'coach' ? 'combine' : circuitCourant;
                liste = pronosData ? pronosData[cle] : [];
            } else {
                liste = classementData ? classementData[circuitCourant][typeCourant] : [];
            }

            if (!liste || liste.length === 0) {
                corps.innerHTML = '<tr><td colspan="3" class="match-hint">Aucun classement disponible pour le moment.</td></tr>';
                return;
            }

            corps.innerHTML = liste.map(function (j, i) { return ligneHtml(j, i + 1); }).join('');
        }

        async function chargerClassement() {
            const response = await fetch('/api/classement/' + userId);
            const data = await response.json();

            if (!response.ok) {
                alert(data.error || 'Impossible de charger les classements.');
                return;
            }

            classementData = data;
            afficherClassement();
        }

        async function chargerPronos() {
            const response = await fetch('/api/pronostics/classement/' + userId);
            const data = await response.json();

            if (!response.ok) {
                return;
            }

            pronosData = data;
            afficherClassement();
        }

        const PARAM_NATIONS = { atp: 'ATP', wta: 'WTA', coach: 'COMBINE' };

        async function chargerNations(circuit) {
            const response = await fetch('/api/classement/nations/' + PARAM_NATIONS[circuit]);
            const data = await response.json();

            if (!response.ok) {
                return;
            }

            nationData[circuit] = data.classement;
            afficherClassement();
        }

        async function ouvrirDetailPoints(cle, userIdCible, type) {
            const overlay = document.createElement('div');
            overlay.className = 'dispo-blocage-overlay';
            overlay.innerHTML = `
                <div class="dispo-blocage-box" style="max-width:480px;">
                    <div class="stats-header" style="margin-top:0;">Détail des points (${type === 'race' ? 'Race' : 'Live'})</div>
                    <div id="detail-points-corps"><div class="match-hint">Chargement...</div></div>
                    <button class="cta cta-secondary" id="detail-points-fermer" style="margin-top:16px; padding:8px 16px; font-size:0.8rem;">Fermer</button>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
            document.getElementById('detail-points-fermer').addEventListener('click', function () { overlay.remove(); });

            const params = new URLSearchParams();
            if (cle) params.set('cle', cle);
            else if (userIdCible) params.set('userId', userIdCible);
            params.set('type', type);

            try {
                const response = await fetch('/api/classement/detail?' + params.toString());
                const data = await response.json();
                if (!overlay.isConnected) return;
                const corps = document.getElementById('detail-points-corps');

                if (!response.ok) {
                    corps.innerHTML = '<div class="match-hint">' + (data.error || 'Impossible de charger le détail.') + '</div>';
                    return;
                }
                if (!data.detail || data.detail.length === 0) {
                    corps.innerHTML = '<div class="match-hint">Aucun point compté pour le moment sur cette fenêtre.</div>';
                    return;
                }

                const auMoinsUnNonCompte = data.detail.some(function (d) { return d.compte === false; });
                const lignesHtml = data.detail.map(function (d) {
                    const semaineTxt = d.positionSemaine !== null ? 'S' + d.positionSemaine : '—';
                    const nonCompte = d.compte === false;
                    const rouge = nonCompte ? ' style="color:#E24B4A;"' : '';
                    return `
                        <div class="stat-row">
                            <span class="stat-label"${rouge}>${d.nom} (${semaineTxt} · ${d.tour_elimine || '-'})${nonCompte ? ' — non compté' : ''}</span>
                            <span class="stat-value"${rouge}>${d.points_gagnes || 0}</span>
                        </div>
                    `;
                }).join('');
                corps.innerHTML = lignesHtml + `
                    <div class="stat-row" style="margin-top:8px; border-top:1px solid rgba(255,255,255,0.15); padding-top:8px;">
                        <span class="stat-label" style="font-weight:700;">Total</span>
                        <span class="stat-value" style="font-weight:700;">${data.total}</span>
                    </div>
                ` + (auMoinsUnNonCompte
                    ? '<p class="regle-table-note" style="margin-top:12px;"><span style="color:#E24B4A;">En rouge</span> : résultats hors des 18 (ATP) / 16 (WTA) meilleurs retenus au classement — leurs points ne sont pas comptés.</p>'
                    : '');
            } catch (err) {
                if (overlay.isConnected) {
                    document.getElementById('detail-points-corps').innerHTML = '<div class="match-hint">Impossible de charger le détail.</div>';
                }
            }
        }

        async function ouvrirDetailNation(nation, circuit) {
            const overlay = document.createElement('div');
            overlay.className = 'dispo-blocage-overlay';
            overlay.innerHTML = `
                <div class="dispo-blocage-box" style="max-width:480px;">
                    <div class="stats-header" style="margin-top:0;">Points de la nation — ${decodeURIComponent(nation)}</div>
                    <div id="detail-points-corps"><div class="match-hint">Chargement...</div></div>
                    <button class="cta cta-secondary" id="detail-points-fermer" style="margin-top:16px; padding:8px 16px; font-size:0.8rem;">Fermer</button>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
            document.getElementById('detail-points-fermer').addEventListener('click', function () { overlay.remove(); });

            try {
                const response = await fetch('/api/classement/nations/detail/' + nation + '?circuit=' + circuit);
                const data = await response.json();
                if (!overlay.isConnected) return;
                const corps = document.getElementById('detail-points-corps');
                if (!response.ok) {
                    corps.innerHTML = '<div class="match-hint">' + (data.error || 'Impossible de charger le détail.') + '</div>';
                    return;
                }

                let html = '';
                data.groupes.forEach(function (g) {
                    if (data.plusieurs) html += `<div class="stats-header" style="font-size:0.9rem; margin-top:12px;">${g.circuit}</div>`;
                    if (!g.joueurs.length) {
                        html += '<div class="match-hint">Aucun joueur classé.</div>';
                        return;
                    }
                    g.joueurs.forEach(function (j) {
                        const lien = j.estReel
                            ? `adversaire.html?type=reel&id=${j.playerId}`
                            : `adversaire.html?type=rival&id=${j.rivalId}`;
                        html += `
                            <div class="stat-row">
                                <span class="stat-label"><a class="lien-adversaire${j.estReel ? '' : ' classement-bot'}" href="${lien}">${formaterNomComplet(j.nom)}</a> <span class="match-hint">(${j.rangLive ? '#' + j.rangLive : '—'})</span></span>
                                <span class="stat-value">${j.points}</span>
                            </div>
                        `;
                    });
                });
                html += `
                    <div class="stat-row" style="margin-top:8px; border-top:1px solid rgba(255,255,255,0.15); padding-top:8px;">
                        <span class="stat-label" style="font-weight:700;">Total</span>
                        <span class="stat-value" style="font-weight:700;">${data.total}</span>
                    </div>
                `;
                corps.innerHTML = html;
            } catch (err) {
                if (overlay.isConnected) {
                    document.getElementById('detail-points-corps').innerHTML = '<div class="match-hint">Impossible de charger le détail.</div>';
                }
            }
        }

        document.addEventListener('click', function (e) {
            const bouton = e.target.closest('.pts-detail-btn');
            if (!bouton) return;
            if (bouton.dataset.nation) {
                ouvrirDetailNation(bouton.dataset.nation, bouton.dataset.circuit);
            } else {
                ouvrirDetailPoints(bouton.dataset.cle || null, bouton.dataset.userId || null, bouton.dataset.type);
            }
        });

        document.querySelectorAll('#tabs-nav-circuit .tab-btn').forEach(function (bouton) {
            bouton.addEventListener('click', function () {
                document.querySelectorAll('#tabs-nav-circuit .tab-btn').forEach(function (b) { b.classList.remove('active'); });
                bouton.classList.add('active');
                circuitCourant = bouton.dataset.circuit;
                construireOngletsType();
                afficherClassement();
            });
        });

        document.getElementById('logout-btn').addEventListener('click', function (e) {
            e.preventDefault();
            fetch('/api/deconnexion', { method: 'POST' }).catch(function () {});
            localStorage.removeItem('currentUserId');
            window.location.href = 'index.html';
        });

        document.getElementById('nav-toggle').addEventListener('click', function (e) {
            e.stopPropagation();
            this.classList.toggle('open');
            document.getElementById('nav-dropdown').classList.toggle('open');
        });
        document.addEventListener('click', function () {
            document.getElementById('nav-toggle').classList.remove('open');
            document.getElementById('nav-dropdown').classList.remove('open');
        });

        construireOngletsType();
        chargerSemaine();
        verifierAdmin();
        chargerClassement();
        chargerPronos();
        chargerNations('atp');
        chargerNations('wta');
        chargerNations('coach');
    </script>
    <script src="retour.js?v=20260829"></script>
</body>
</html>
