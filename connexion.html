<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Tennis Web Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">TENNIS WEB MANAGER</a>
            <h1 class="auth-title">Connexion</h1>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" placeholder="toi@exemple.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Ton mot de passe" required>
                </div>
                <button type="submit" class="cta cta-primary auth-submit">Se connecter</button>
            </form>

            <p class="auth-switch"><a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a></p>
            <p class="auth-switch">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/api/connexion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.error);
                return;
            }

            sessionStorage.setItem('currentUserId', data.userId);
            window.location.href = 'accueil.html';
        });
    </script>
</body>
</html>
