    <script>
        const userId = localStorage.getItem('currentUserId');

        if (!userId) {
            window.location.href = 'connexion.html';
        }

        const params = new URLSearchParams(window.location.search);
        const matchIdCible = params.get('id');

        const detailsCache = {};
        const liveEnCours = {};

        const LABELS_SURFACE = { dur: 'Dur', terre: 'Terre battue', herbe: 'Herbe' };
        const LABELS_DIFFICULTE = { faible: 'Adversaire faible', equilibre: 'Adversaire équilibré', fort: 'Adversaire fort' };

        // Ordre chronologique des tours (du plus tot au plus tard) - sert a trier les
        // matchs d'un meme tournoi avec le tour le plus recemment joue en haut.
        const ORDRE_TOURS_MATCHS = ['Poules', '64e de finale', '32e de finale', '16e de finale', '8e de finale', '1/4 finale', 'Demi-finale', '1/2 finale', 'Finale'];
        function rangTour(label) {
            const i = ORDRE_TOURS_MATCHS.indexOf(label);
            return i === -1 ? -1 : i;
        }

        function flagImg(code) {
            if (!code) return '';
            return `<img class="flag-icon" src="https://flagcdn.com/24x18/${code}.png" alt="">`;
        }

        // Lien cliquable vers la fiche d'un vrai joueur/rival (jamais pour un lambda,
        // qui n'a pas de fiche) - demande utilisateur 2026-08-22.
        function lienVersAdversaireMatch(nomHtml, playerId, rivalId) {
            if (playerId) return `<a class="lien-adversaire" href="adversaire.html?type=reel&id=${playerId}">${nomHtml}</a>`;
            if (rivalId) return `<a class="lien-adversaire" href="adversaire.html?type=rival&id=${rivalId}">${nomHtml}</a>`;
            return nomHtml;
        }

        function formaterNom(prenom, nom) {
            const p = (prenom || '').toLowerCase().replace(/(^|[\s'-])\p{L}/gu, function (c) { return c.toUpperCase(); });
            return p + ' ' + (nom || '').toUpperCase();
        }

        function formaterNomComplet(nomComplet) {
            if (!nomComplet) return nomComplet;
            const i = nomComplet.lastIndexOf(' ');
            if (i === -1) return nomComplet;
            const prenom = nomComplet.slice(0, i).toLowerCase().replace(/(^|[\s'-])\p{L}/gu, function (c) { return c.toUpperCase(); });
            return prenom + ' ' + nomComplet.slice(i + 1).toUpperCase();
        }

        function libellePhase(phase) {
            if (phase.type === 'presaison') return 'Pré-saison (Saison ' + phase.numeroSaison + ')';
            if (phase.type === 's0') return 'Semaine 0 (Saison ' + phase.numeroSaison + ')';
            return 'Semaine ' + phase.positionSemaine + ' (Saison ' + phase.numeroSaison + ')';
        }

        async function chargerSemaine() {
            const response = await fetch('/api/semaine');
            const data = await response.json();
            if (response.ok) {
                document.getElementById('semaine-badge').textContent = 'Semaine actuelle : ' + libellePhase(data.phase);
            }
        }

        async function verifierAdmin() {
            const response = await fetch('/api/utilisateur/' + userId);
            const data = await response.json();
            if (response.ok && data.user.role === 'admin') {
                document.getElementById('admin-link').style.display = 'inline-block';
            }
        }

        // Le journal d'un match stocke "Toi"/"Adversaire" (perspective figee du
        // proprietaire) - on remplace ici par les vrais noms pour l'affichage Live/
        // Teletexte, plus agreable a lire (demande utilisateur, 2026-08-20).
        function remplacerNomsEvenements(match) {
            const nomMoi = formaterNom(match.prenom, match.nom);
            const nomAdversaire = match.adversaire_nom ? formaterNomComplet(match.adversaire_nom) : 'Adversaire';
            match.evenements.forEach(function (evt) {
                evt.texte = evt.texte.replace(/\bToi\b/g, nomMoi).replace(/\bAdversaire\b/g, nomAdversaire);
            });
        }

        async function obtenirDetail(matchId) {
            if (detailsCache[matchId]) {
                return detailsCache[matchId];
            }
            const response = await fetch('/api/matchs/detail/' + matchId + '?userId=' + userId);
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Impossible de charger ce match.');
            }
            remplacerNomsEvenements(data.match);
            detailsCache[matchId] = data.match;
            return data.match;
        }

        function arreterLive(matchId) {
            if (liveEnCours[matchId]) {
                clearInterval(liveEnCours[matchId]);
                delete liveEnCours[matchId];
            }
        }

        function libelleScore(evt) {
            if (evt.type === 'tie_break_point' || evt.type === 'tie_break_debut') {
                return 'Set ' + evt.numeroSet + ' : Tie-break ' + (evt.ptsA || 0) + '-' + (evt.ptsB || 0) + '  ·  Sets ' + evt.setsA + '-' + evt.setsB;
            }
            if (evt.jeuxA !== undefined && evt.jeuxB !== undefined) {
                return 'Set ' + evt.numeroSet + ' : ' + evt.jeuxA + '-' + evt.jeuxB + '  ·  Sets ' + evt.setsA + '-' + evt.setsB;
            }
            return null;
        }

        function afficherResultat(viewer, match) {
            const vainqueur = match.vainqueur === 'joueur';
            viewer.innerHTML = `
                <div class="match-result ${vainqueur ? 'victoire' : 'defaite'}" style="display:block;">
                    ${vainqueur ? 'Victoire' : 'Défaite'} ${match.score}
                </div>
            `;
        }

        function afficherTeletexte(viewer, match) {
            const lignes = match.evenements.map(function (evt) {
                return `<div class="teletexte-ligne teletexte-${evt.type}">${evt.texte}</div>`;
            }).join('');
            viewer.innerHTML = `<div class="match-journal" style="display:block;">${lignes}</div>`;
        }

        function afficherLive(viewer, match, matchId) {
            if (!match.estSemaineActuelle) {
                viewer.innerHTML = `<div class="match-hint">Le direct n'est plus disponible pour ce match (semaine passée). Utilise Résultat direct ou Téletexte.</div>`;
                return;
            }

            arreterLive(matchId);

            // Pas d'id sur ces elements : la vue Multiplex peut afficher le meme match
            // (donc le meme matchId) qu'une carte de la vue liste, ce qui dupliquerait
            // des id HTML et ferait retomber un getElementById global sur la mauvaise
            // instance - on reste scope au conteneur "viewer" propre a la carte cliquee.
            viewer.innerHTML = `
                <div class="live-score">C'est parti...</div>
                <div class="live-log"></div>
                <button class="cta cta-secondary live-skip-btn" style="margin-top:10px; padding:8px 16px; font-size:0.75rem;">Passer au résultat final</button>
            `;

            const scoreDiv = viewer.querySelector('.live-score');
            const logDiv = viewer.querySelector('.live-log');
            const skipBtn = viewer.querySelector('.live-skip-btn');

            let index = 0;

            function jouerEvenement(evt) {
                const ligne = document.createElement('div');
                ligne.className = 'live-log-ligne live-log-' + evt.type;
                ligne.textContent = evt.texte;
                logDiv.appendChild(ligne);
                logDiv.scrollTop = logDiv.scrollHeight;

                const score = libelleScore(evt);
                if (score) {
                    scoreDiv.textContent = score;
                }
                if (evt.type === 'match_fin') {
                    scoreDiv.textContent = evt.texte;
                    arreterLive(matchId);
                    skipBtn.style.display = 'none';
                }
            }

            function avancer() {
                if (index >= match.evenements.length) {
                    arreterLive(matchId);
                    return;
                }
                jouerEvenement(match.evenements[index]);
                index++;
            }

            avancer();
            liveEnCours[matchId] = setInterval(avancer, 1500);

            skipBtn.addEventListener('click', function () {
                arreterLive(matchId);
                while (index < match.evenements.length) {
                    jouerEvenement(match.evenements[index]);
                    index++;
                }
            });
        }

        async function activerMode(matchId, mode, boutonClique) {
            // Cible la carte du bouton clique (closest), pas une recherche globale par
            // id - la vue Multiplex affiche desormais les memes matchs que la vue liste
            // dans une 2e carte independante portant le meme data-match-id, un
            // querySelector global tomberait sur la mauvaise instance (bug trouve via
            // test, 2026-09-05).
            const carte = boutonClique.closest('.match-card');
            const viewer = carte.querySelector('.match-viewer');

            carte.querySelectorAll('.match-mode-btn').forEach(function (b) { b.classList.remove('active'); });
            boutonClique.classList.add('active');

            arreterLive(matchId);
            viewer.style.display = 'block';
            viewer.innerHTML = '<div class="match-viewer-loading">Chargement...</div>';

            try {
                const match = await obtenirDetail(matchId);
                if (mode === 'resultat') afficherResultat(viewer, match);
                else if (mode === 'teletexte') afficherTeletexte(viewer, match);
                else if (mode === 'live') afficherLive(viewer, match, matchId);
            } catch (err) {
                viewer.innerHTML = '<div class="match-hint">' + err.message + '</div>';
            }
        }

        // Matchs 100% bots ("Autres matchs de la semaine", aucun joueur du coach
        // implique) : meme systeme Live/Resultat/Teletexte que ci-dessus, mais source
        // des donnees a part (/api/tournois/match-bot/:id, pas de ligne matchs) - cle
        // de cache/minuteur prefixee "bot-" pour ne jamais entrer en collision avec un
        // vrai matchId.
        async function obtenirDetailBot(tournoiMatchId) {
            const cle = 'bot-' + tournoiMatchId;
            if (detailsCache[cle]) return detailsCache[cle];
            const response = await fetch('/api/tournois/match-bot/' + tournoiMatchId);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Impossible de charger ce match.');
            detailsCache[cle] = data.match;
            return data.match;
        }

        function afficherResultatBot(viewer, match) {
            viewer.innerHTML = `
                <div class="match-result" style="display:block;">
                    Victoire de ${formaterNomComplet(match.vainqueur_nom)} ${match.score}
                </div>
            `;
        }

        function afficherTeletexteBot(viewer, match) {
            const lignes = match.evenements.map(function (evt) {
                return `<div class="teletexte-ligne teletexte-${evt.type}">${evt.texte}</div>`;
            }).join('');
            viewer.innerHTML = `<div class="match-journal" style="display:block;">${lignes}</div>`;
        }

        function afficherLiveBot(viewer, match, tournoiMatchId) {
            if (!match.estSemaineActuelle) {
                viewer.innerHTML = `<div class="match-hint">Le direct n'est plus disponible pour ce match (semaine passée). Utilise Résultat direct ou Téletexte.</div>`;
                return;
            }

            const cle = 'bot-' + tournoiMatchId;
            arreterLive(cle);

            // Meme raison que dans afficherLive : pas d'id, on reste scope au viewer.
            viewer.innerHTML = `
                <div class="live-score">C'est parti...</div>
                <div class="live-log"></div>
                <button class="cta cta-secondary live-skip-btn" style="margin-top:10px; padding:8px 16px; font-size:0.75rem;">Passer au résultat final</button>
            `;

            const scoreDiv = viewer.querySelector('.live-score');
            const logDiv = viewer.querySelector('.live-log');
            const skipBtn = viewer.querySelector('.live-skip-btn');

            let index = 0;

            function jouerEvenement(evt) {
                const ligne = document.createElement('div');
                ligne.className = 'live-log-ligne live-log-' + evt.type;
                ligne.textContent = evt.texte;
                logDiv.appendChild(ligne);
                logDiv.scrollTop = logDiv.scrollHeight;

                const score = libelleScore(evt);
                if (score) scoreDiv.textContent = score;
                if (evt.type === 'match_fin') {
                    scoreDiv.textContent = evt.texte;
                    arreterLive(cle);
                    skipBtn.style.display = 'none';
                }
            }

            function avancer() {
                if (index >= match.evenements.length) {
                    arreterLive(cle);
                    return;
                }
                jouerEvenement(match.evenements[index]);
                index++;
            }

            avancer();
            liveEnCours[cle] = setInterval(avancer, 1500);

            skipBtn.addEventListener('click', function () {
                arreterLive(cle);
                while (index < match.evenements.length) {
                    jouerEvenement(match.evenements[index]);
                    index++;
                }
            });
        }

        async function activerModeBot(tournoiMatchId, mode, boutonClique) {
            // Meme raison qu'activerMode ci-dessus : cibler la carte du bouton clique,
            // pas une recherche globale par id (desormais ambigue entre vue liste et
            // vue Multiplex).
            const carte = boutonClique.closest('.match-card');
            const viewer = carte.querySelector('.match-viewer');

            carte.querySelectorAll('.match-mode-btn').forEach(function (b) { b.classList.remove('active'); });
            boutonClique.classList.add('active');

            arreterLive('bot-' + tournoiMatchId);
            viewer.style.display = 'block';
            viewer.innerHTML = '<div class="match-viewer-loading">Chargement...</div>';

            try {
                const match = await obtenirDetailBot(tournoiMatchId);
                if (mode === 'resultat') afficherResultatBot(viewer, match);
                else if (mode === 'teletexte') afficherTeletexteBot(viewer, match);
                else if (mode === 'live') afficherLiveBot(viewer, match, tournoiMatchId);
            } catch (err) {
                viewer.innerHTML = '<div class="match-hint">' + err.message + '</div>';
            }
        }

        // Regroupe par tournoi/rencontre de coupe QUELLE QUE SOIT la position des
        // matchs dans la liste source (une cle Map, pas "fusionner seulement si le
        // groupe precedent correspond") - avec 2 personnages engages dans 2 tournois
        // differents la meme semaine, leurs matchs s'entrelacent par ordre d'id
        // (ATP tour 1, WTA tour 1, ATP tour 2, ...) et l'ancienne logique coupait
        // alors un meme tournoi en plusieurs blocs disjoints des qu'un match de
        // l'AUTRE tournoi s'intercalait (bug signale par l'utilisateur, 2026-08-22).
        function grouperMatchs(matchs) {
            const groupesParCle = new Map();
            const ordre = [];
            matchs.forEach(function (m) {
                const cle = m.tournoi_id ? 'tournoi-' + m.tournoi_id
                    : (m.coupe_equipe_id ? 'coupe-' + m.coupe_equipe_id : 'seul-' + m.id);
                let groupe = groupesParCle.get(cle);
                if (!groupe) {
                    groupe = {
                        tournoi_id: m.tournoi_id,
                        tournoi_nom: m.tournoi_nom,
                        tournoi_calendrier_id: m.tournoi_calendrier_id,
                        coupe_equipe_id: m.coupe_equipe_id,
                        coupe_manche: m.coupe_manche,
                        coupe_division: m.coupe_division,
                        coupe_nation_domicile: m.coupe_nation_domicile,
                        coupe_nation_exterieur: m.coupe_nation_exterieur,
                        semaine: m.semaine,
                        positionSemaine: m.positionSemaine,
                        surface: m.surface,
                        circuit: m.type === 'joueur' ? 'ATP' : 'WTA',
                        matchs: [],
                        dernierId: m.id
                    };
                    groupesParCle.set(cle, groupe);
                    ordre.push(groupe);
                }
                groupe.matchs.push(m);
                if (m.id > groupe.dernierId) groupe.dernierId = m.id;
            });
            ordre.forEach(function (g) {
                if (g.tournoi_id || g.coupe_equipe_id) {
                    // Ordre chronologique (1er tour en haut) - le tour le plus avance en
                    // premier spoilait le resultat d'un tour precedent des qu'un tour
                    // suivant apparaissait au-dessus (demande utilisateur, 2026-08-20).
                    g.matchs.sort(function (a, b) { return rangTour(a.numero_tour) - rangTour(b.numero_tour); });
                }
            });
            // Le groupe contenant le match le plus RECENT (id le plus eleve) passe en
            // dernier, tout en bas de la page - jamais le resultat le plus frais
            // affiche en haut (demande utilisateur, 2026-08-22).
            ordre.sort(function (a, b) { return a.dernierId - b.dernierId; });
            return ordre;
        }

        function creerCarteMatch(match) {
            const carte = document.createElement('div');
            carte.className = 'match-card';
            carte.dataset.matchId = match.id;

            const liveDisabled = match.estSemaineActuelle ? '' : 'disabled title="Disponible uniquement pour les matchs de la semaine en cours"';

            const estGroupe = match.tournoi_id || match.difficulte === 'coupe';
            const lienMoi = `<a class="lien-adversaire" href="joueur.html?type=${match.type}">${formaterNom(match.prenom, match.nom)}</a>`;
            const lienAdversaire = lienVersAdversaireMatch(
                formaterNomComplet(match.adversaire_nom || 'Adversaire'),
                match.adversaire_player_id, match.adversaire_rival_id
            );
            const nomAffiche = estGroupe
                ? `${flagImg(match.joueur_drapeau)} ${lienMoi} - ${lienAdversaire} ${flagImg(match.adversaire_drapeau)}`
                : lienMoi;
            const metaAffiche = estGroupe
                ? match.numero_tour
                : match.semaineLabel + ' · ' + LABELS_SURFACE[match.surface] + ' · ' + LABELS_DIFFICULTE[match.difficulte];

            carte.innerHTML = `
                <div class="match-card-head">
                    <div class="player-avatar match-card-avatar">
                        <img src="${match.type === 'joueur' ? 'icone-joueur.png' : 'icone-joueuse.png'}" alt="">
                    </div>
                    <div class="match-card-info">
                        <div class="match-card-name">${nomAffiche}</div>
                        <div class="match-card-meta">${metaAffiche}</div>
                    </div>
                </div>
                <div class="match-card-actions">
                    <button class="match-mode-btn" data-mode="live" ${liveDisabled}>Live</button>
                    <button class="match-mode-btn" data-mode="resultat">Résultat direct</button>
                    <button class="match-mode-btn" data-mode="teletexte">Téletexte</button>
                </div>
                <div class="match-viewer"></div>
            `;

            carte.querySelectorAll('.match-mode-btn').forEach(function (bouton) {
                if (bouton.disabled) return;
                bouton.addEventListener('click', function () {
                    activerMode(match.id, bouton.dataset.mode, bouton);
                });
            });

            return carte;
        }

        function creerCarteBot(m, tournoi) {
            const nomJ1 = flagImg(m.joueur1_drapeau) + ' ' + formaterNomComplet(m.joueur1_nom);
            const nomJ2 = flagImg(m.joueur2_drapeau) + ' ' + formaterNomComplet(m.joueur2_nom);
            const carte = document.createElement('div');
            if (m.aReplayBot) {
                carte.className = 'match-card';
                carte.dataset.tournoiMatchId = m.id;
                carte.innerHTML = `
                    <div class="match-card-head">
                        <div class="match-card-info">
                            <div class="match-card-name">${nomJ1} vs ${nomJ2}</div>
                            <div class="match-card-meta">${m.numero_tour}</div>
                        </div>
                    </div>
                    <div class="match-card-actions">
                        <button class="match-mode-btn" data-mode="live">Live</button>
                        <button class="match-mode-btn" data-mode="resultat">Résultat direct</button>
                        <button class="match-mode-btn" data-mode="teletexte">Téletexte</button>
                    </div>
                    <div class="match-viewer"></div>
                `;
                carte.querySelectorAll('.match-mode-btn').forEach(function (bouton) {
                    bouton.addEventListener('click', function () {
                        activerModeBot(m.id, bouton.dataset.mode, bouton);
                    });
                });
                return carte;
            }
            carte.className = 'tournoi-card';
            carte.innerHTML = `
                <div class="tournoi-card-name">${nomJ1} vs ${nomJ2}</div>
                <div class="match-card-meta">${m.numero_tour}${m.score ? ' · ' + m.score : ''}</div>
            `;
            return carte;
        }

        let matchsMiensCache = [];
        let tournoisAutresCache = [];

        // Moteur commun du Multiplex : fait progresser UNIQUEMENT le score (pas de
        // texte, pas de journal) selon la demande explicite de l'utilisateur
        // (2026-09-05) - "le but c'est vraiment de suivre les scores très simplement".
        // rolePremier/roleSecond sont les 2 lignes .sb-row fixes de la tuile ;
        // coteAEstPremier indique si jeuxA/setsA (evenements) correspond a la ligne
        // "premier" ou "second" (peut varier selon qui est cote A dans le moteur -
        // voir server.js, /api/tournois/match-bot/:id, champ cote1EstA).
        function demarrerScoreEnDirect(tuile, cleUnique, evenements, coteAEstPremier, gagnantRole) {
            const rowPremier = tuile.querySelector('.sb-row[data-role="premier"]');
            const rowSecond = tuile.querySelector('.sb-row[data-role="second"]');
            const rowPourA = coteAEstPremier ? rowPremier : rowSecond;
            const rowPourB = coteAEstPremier ? rowSecond : rowPremier;
            const statutLive = tuile.querySelector('.mx-status-live');
            const skipBtn = tuile.querySelector('.mx-skip-btn');

            statutLive.hidden = false;
            if (skipBtn) skipBtn.hidden = false;

            const colonnes = [];
            let serveurCourant = null;

            function redessiner() {
                rowPourA.querySelector('.sb-sets').innerHTML = colonnes.map(function (c) { return '<span>' + c.a + '</span>'; }).join('');
                rowPourB.querySelector('.sb-sets').innerHTML = colonnes.map(function (c) { return '<span>' + c.b + '</span>'; }).join('');
                [rowPremier, rowSecond].forEach(function (row) {
                    const estAuService = serveurCourant !== null && row === (serveurCourant === 'A' ? rowPourA : rowPourB);
                    row.querySelector('.sb-serve').classList.toggle('actif', estAuService);
                });
            }

            function terminer() {
                arreterLive(cleUnique);
                statutLive.hidden = true;
                if (skipBtn) skipBtn.remove();
                if (gagnantRole) {
                    (gagnantRole === 'premier' ? rowPremier : rowSecond).classList.add('gagnant');
                }
            }

            // Un jeu (evt.type === 'jeu') n'est PAS pousse pour le jeu decisif d'un
            // tie-break (resolu directement dans la boucle du moteur, cf. server.js) -
            // seul set_fin porte alors le score final du set (7-6 par ex.), d'ou la mise
            // a jour systematique sur set_fin en plus de jeu (jamais juste l'un ou l'autre).
            function traiter(evt) {
                if (evt.type === 'set_debut') {
                    colonnes.push({ a: 0, b: 0 });
                    serveurCourant = evt.serveur;
                } else if (evt.type === 'jeu') {
                    colonnes[colonnes.length - 1].a = evt.jeuxA;
                    colonnes[colonnes.length - 1].b = evt.jeuxB;
                    serveurCourant = serveurCourant === 'A' ? 'B' : 'A';
                } else if (evt.type === 'set_fin') {
                    colonnes[colonnes.length - 1].a = evt.jeuxA;
                    colonnes[colonnes.length - 1].b = evt.jeuxB;
                } else if (evt.type === 'match_fin') {
                    serveurCourant = null;
                }
                redessiner();
                if (evt.type === 'match_fin') terminer();
            }

            let index = 0;
            function avancer() {
                if (index >= evenements.length) { terminer(); return; }
                traiter(evenements[index]);
                index++;
            }

            avancer();
            // Rythme du Multiplex delibirement plus rapide que le Live de la vue liste
            // (1500ms, texte a lire) - ici seul le score bouge, rien a lire pendant le
            // delai : demande explicite de l'utilisateur, 2026-09-05 (400ms d'abord,
            // juge trop rapide, remonte a 900ms le meme jour).
            liveEnCours[cleUnique] = setInterval(avancer, 900);

            if (skipBtn) {
                skipBtn.addEventListener('click', function () {
                    arreterLive(cleUnique);
                    while (index < evenements.length) {
                        traiter(evenements[index]);
                        index++;
                    }
                });
            }
        }

        function rangHtml(classement) {
            return classement ? '<span class="sb-rank">#' + classement + '</span>' : '';
        }

        function squeletteTuileScore(nomPremier, drapeauPremier, classementPremier, nomSecond, drapeauSecond, classementSecond) {
            return `
                <div class="mx-scoreboard">
                    <div class="sb-row" data-role="premier">
                        <span class="sb-serve">🎾</span>
                        ${flagImg(drapeauPremier)}
                        <span class="sb-name">${nomPremier}${rangHtml(classementPremier)}</span>
                        <span class="sb-sets"></span>
                    </div>
                    <div class="sb-row" data-role="second">
                        <span class="sb-serve">🎾</span>
                        ${flagImg(drapeauSecond)}
                        <span class="sb-name">${nomSecond}${rangHtml(classementSecond)}</span>
                        <span class="sb-sets"></span>
                    </div>
                </div>
            `;
        }

        function creerTuileScore(match) {
            const tuile = document.createElement('div');
            tuile.className = 'mx-tile mx-tile-' + match.surface;
            tuile.dataset.filtreGroupe = 'mien';

            const circuit = match.type === 'joueur' ? 'ATP' : 'WTA';
            const nomContexte = match.tournoi_nom
                || (match.coupe_nation_domicile ? (match.coupe_nation_domicile + ' - ' + match.coupe_nation_exterieur) : '');

            tuile.innerHTML = `
                <div class="mx-tile-tags">
                    <span class="tag-circuit">${circuit}</span>
                    <span class="tag-you">Toi</span>
                    <span class="mx-status-live" hidden><span class="status-dot"></span>En direct</span>
                </div>
                ${squeletteTuileScore(formaterNom(match.prenom, match.nom), match.joueur_drapeau, match.classement, formaterNomComplet(match.adversaire_nom || 'Adversaire'), match.adversaire_drapeau, match.adversaire_classement)}
                <div class="mx-tile-meta">${nomContexte ? nomContexte + ' · ' : ''}${match.numero_tour || ''}</div>
                <button type="button" class="cta cta-primary mx-launch-btn" style="width:100%; padding:10px 16px; font-size:0.8rem;">Lancer le match</button>
                <button type="button" class="mx-skip-btn" hidden>Passer au score final</button>
            `;

            const btnLancer = tuile.querySelector('.mx-launch-btn');
            btnLancer.addEventListener('click', async function () {
                btnLancer.disabled = true;
                btnLancer.textContent = 'Chargement...';
                try {
                    const detail = await obtenirDetail(match.id);
                    const gagnantRole = match.vainqueur === 'joueur' ? 'premier' : 'second';
                    btnLancer.remove();
                    demarrerScoreEnDirect(tuile, match.id, detail.evenements, true, gagnantRole);
                } catch (err) {
                    btnLancer.disabled = false;
                    btnLancer.textContent = 'Lancer le match';
                    alert(err.message);
                }
            });

            return tuile;
        }

        function creerTuileScoreBot(m, tournoi) {
            if (!m.aReplayBot) {
                const carte = document.createElement('div');
                carte.className = 'tournoi-card tournoi-card-' + tournoi.surface;
                carte.dataset.filtreGroupe = 'autre';
                carte.innerHTML = `
                    <div class="tournoi-card-name">${flagImg(m.joueur1_drapeau)} ${formaterNomComplet(m.joueur1_nom)}${rangHtml(m.joueur1_classement)} vs ${flagImg(m.joueur2_drapeau)} ${formaterNomComplet(m.joueur2_nom)}${rangHtml(m.joueur2_classement)}</div>
                    <div class="match-card-meta">${tournoi.nom} · ${m.numero_tour}${m.score ? ' · ' + m.score : ''}</div>
                `;
                return carte;
            }

            const tuile = document.createElement('div');
            tuile.className = 'mx-tile mx-tile-' + tournoi.surface;
            tuile.dataset.filtreGroupe = 'autre';
            tuile.innerHTML = `
                <div class="mx-tile-tags">
                    <span class="tag-circuit">${tournoi.circuit}</span>
                    <span class="mx-status-live" hidden><span class="status-dot"></span>En direct</span>
                </div>
                ${squeletteTuileScore(formaterNomComplet(m.joueur1_nom), m.joueur1_drapeau, m.joueur1_classement, formaterNomComplet(m.joueur2_nom), m.joueur2_drapeau, m.joueur2_classement)}
                <div class="mx-tile-meta">${tournoi.nom} · ${m.numero_tour}</div>
                <button type="button" class="cta cta-primary mx-launch-btn" style="width:100%; padding:10px 16px; font-size:0.8rem;">Lancer le match</button>
                <button type="button" class="mx-skip-btn" hidden>Passer au score final</button>
            `;

            const btnLancer = tuile.querySelector('.mx-launch-btn');
            btnLancer.addEventListener('click', async function () {
                btnLancer.disabled = true;
                btnLancer.textContent = 'Chargement...';
                try {
                    const detail = await obtenirDetailBot(m.id);
                    const gagnantRole = detail.vainqueur_nom === m.joueur1_nom ? 'premier' : 'second';
                    const coteAEstPremier = detail.cote1EstA !== false;
                    btnLancer.remove();
                    demarrerScoreEnDirect(tuile, 'bot-' + m.id, detail.evenements, coteAEstPremier, gagnantRole);
                } catch (err) {
                    btnLancer.disabled = false;
                    btnLancer.textContent = 'Lancer le match';
                    alert(err.message);
                }
            });

            return tuile;
        }

        function construireMultiplex() {
            const grille = document.getElementById('multiplex-grid');
            grille.innerHTML = '';
            const tuiles = [];

            matchsMiensCache.forEach(function (match) {
                tuiles.push({ id: match.id, tour: match.numero_tour, node: creerTuileScore(match) });
            });
            tournoisAutresCache.forEach(function (tournoi) {
                tournoi.matchs.forEach(function (m) {
                    tuiles.push({ id: m.id, tour: m.numero_tour, node: creerTuileScoreBot(m, tournoi) });
                });
            });

            if (tuiles.length === 0) {
                grille.innerHTML = '<div class="match-hint">Aucun match joué pour le moment.</div>';
                return;
            }

            // Le tour le plus avance en premier (demi-finale avant 8e de finale) - "id"
            // n'est pas comparable entre "mes matchs" (table matchs) et "autres matchs"
            // (table tournoi_matchs), 2 sequences d'identifiants distinctes, donc
            // inutilisable seul comme critere de tri entre les deux sources. Le score
            // etant deja visible sur chaque tuile sans clic, l'ordre "anti-spoiler"
            // chronologique de la vue liste n'a plus lieu d'etre ici.
            tuiles.sort(function (a, b) {
                const ecart = rangTour(b.tour) - rangTour(a.tour);
                return ecart !== 0 ? ecart : b.id - a.id;
            });
            tuiles.forEach(function (t) { grille.appendChild(t.node); });
            appliquerFiltreMultiplex();
        }

        function appliquerFiltreMultiplex() {
            const actif = document.querySelector('.mx-filter.active');
            const filtre = actif ? actif.dataset.filter : 'tous';
            document.querySelectorAll('#multiplex-grid [data-filtre-groupe]').forEach(function (carte) {
                carte.style.display = (filtre === 'tous' || carte.dataset.filtreGroupe === filtre) ? '' : 'none';
            });
        }

        async function chargerMatchs() {
            const response = await fetch('/api/matchs/' + userId);
            const data = await response.json();

            if (!response.ok) {
                alert(data.error || 'Impossible de charger les matchs.');
                return;
            }

            matchsMiensCache = data.matchs;

            const liste = document.getElementById('match-list');
            liste.innerHTML = '';

            if (data.matchs.length === 0) {
                liste.innerHTML = '<div class="match-hint">Aucun match joué pour le moment.</div>';
                return;
            }

            grouperMatchs(data.matchs).forEach(function (groupe) {
                if (!groupe.tournoi_id && !groupe.coupe_equipe_id) {
                    liste.appendChild(creerCarteMatch(groupe.matchs[0]));
                    return;
                }

                const bloc = document.createElement('div');
                bloc.className = 'match-tournoi-group match-tournoi-group-' + groupe.surface;
                const enTete = groupe.tournoi_id
                    ? `<a href="tournoi-detail.html?calendrierId=${groupe.tournoi_calendrier_id}&semaine=${groupe.semaine}&playerId=${groupe.matchs[0].player_id}">${groupe.tournoi_nom}</a>
                       <span class="match-tournoi-header-meta">${groupe.circuit} · Semaine ${groupe.positionSemaine} · ${LABELS_SURFACE[groupe.surface]}</span>`
                    : `<a href="coupe.html?playerId=${groupe.matchs[0].player_id}&tieId=${groupe.coupe_equipe_id}">${groupe.coupe_nation_domicile} vs ${groupe.coupe_nation_exterieur}</a>
                       <span class="match-tournoi-header-meta">${groupe.coupe_manche}${groupe.coupe_division ? ' · Division ' + groupe.coupe_division : ''} · ${LABELS_SURFACE[groupe.surface]}</span>`;
                bloc.innerHTML = `
                    <div class="match-tournoi-header">${enTete}</div>
                    <div class="match-tournoi-matchs"></div>
                `;
                const conteneurMatchs = bloc.querySelector('.match-tournoi-matchs');
                groupe.matchs.forEach(function (match) {
                    conteneurMatchs.appendChild(creerCarteMatch(match));
                });
                liste.appendChild(bloc);
            });

            if (matchIdCible) {
                const carteCible = document.querySelector('.match-card[data-match-id="' + matchIdCible + '"]');
                if (carteCible) {
                    carteCible.classList.add('match-card-highlight');
                    carteCible.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    const boutonResultat = carteCible.querySelector('.match-mode-btn[data-mode="resultat"]');
                    boutonResultat.click();
                }
            }
        }

        async function chargerAutresMatchs() {
            const response = await fetch('/api/matchs/semaine/' + userId);
            const data = await response.json();

            const liste = document.getElementById('autres-matchs-list');
            liste.innerHTML = '';

            if (!response.ok || data.tournois.length === 0) {
                tournoisAutresCache = [];
                liste.innerHTML = '<div class="match-hint">Aucun autre tournoi joué cette semaine.</div>';
                return;
            }

            tournoisAutresCache = data.tournois;

            data.tournois.forEach(function (tournoi) {
                tournoi.matchs.sort(function (a, b) { return rangTour(a.numero_tour) - rangTour(b.numero_tour); });
                const bloc = document.createElement('div');
                bloc.className = 'match-tournoi-group match-tournoi-group-' + tournoi.surface;
                bloc.innerHTML = `
                    <div class="match-tournoi-header">
                        <a href="tournoi-detail.html?calendrierId=${tournoi.calendrierId}&semaine=${tournoi.semaine}&playerId=${tournoi.playerId}">${tournoi.nom}</a>
                        <span class="match-tournoi-header-meta">${tournoi.circuit} · Semaine ${tournoi.positionSemaine} · ${LABELS_SURFACE[tournoi.surface]}</span>
                    </div>
                    <div class="tournoi-list"></div>
                `;
                const conteneur = bloc.querySelector('.tournoi-list');
                tournoi.matchs.forEach(function (m) {
                    conteneur.appendChild(creerCarteBot(m, tournoi));
                });
                liste.appendChild(bloc);
            });
        }

        document.getElementById('logout-btn').addEventListener('click', function (e) {
            e.preventDefault();
            fetch('/api/deconnexion', { method: 'POST' }).catch(function () {});
            localStorage.removeItem('currentUserId');
            window.location.href = 'index.html';
        });

        document.getElementById('nav-toggle').addEventListener('click', function (e) {
            e.stopPropagation();
            this.classList.toggle('open');
            document.getElementById('nav-dropdown').classList.toggle('open');
        });
        document.addEventListener('click', function () {
            document.getElementById('nav-toggle').classList.remove('open');
            document.getElementById('nav-dropdown').classList.remove('open');
        });

        document.querySelectorAll('#matchs-tabs-nav .tab-btn').forEach(function (bouton) {
            bouton.addEventListener('click', function () {
                document.querySelectorAll('#matchs-tabs-nav .tab-btn').forEach(function (b) { b.classList.remove('active'); });
                bouton.classList.add('active');
                const vue = bouton.dataset.vue;
                document.getElementById('vue-liste').style.display = vue === 'liste' ? '' : 'none';
                document.getElementById('vue-multiplex').style.display = vue === 'multiplex' ? '' : 'none';
            });
        });

        document.querySelectorAll('.mx-filter').forEach(function (bouton) {
            bouton.addEventListener('click', function () {
                document.querySelectorAll('.mx-filter').forEach(function (b) { b.classList.remove('active'); });
                bouton.classList.add('active');
                appliquerFiltreMultiplex();
            });
        });

        chargerSemaine();
        verifierAdmin();
        Promise.all([chargerMatchs(), chargerAutresMatchs()]).then(construireMultiplex);
    </script>
