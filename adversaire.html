<!DOCTYPE html>
<html lang="fr">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div class="dashboard-page">
        <div class="dashboard-inner">
            <div class="dashboard-header">
                <a href="index.html" class="auth-logo">TENNIS WEB MANAGER</a>
                <div class="nav-menu">
                    <button class="nav-menu-toggle" id="nav-toggle">Menu <span class="nav-menu-caret">▾</span></button>
                    <div class="nav-menu-dropdown" id="nav-dropdown">
                        <a href="accueil.html">Accueil</a>
                        <a href="joueur.html">Mes joueurs</a>
                        <a href="tournois.html">Calendrier</a>
                        <a href="matchs.html">Matchs</a>
                        <a href="classements.html">Classements</a>
                        <a href="pronostics.html">Pronostics</a>
                        <a href="presse.html">Presse</a>
                        <a href="annuaire.html">Annuaire</a>
                        <a href="capitanat.html">Capitanat</a>
                        <a href="statistiques.html">Statistiques</a>
                        <a href="regles.html">Règles</a>
                        <a href="https://discord.gg/G4NrCJQaxC" target="_blank" rel="noopener">Discord</a>
                        <a href="admin.html" id="admin-link" style="display:none;">Administration</a>
                        <a href="#" id="logout-btn">Déconnexion</a>
                    </div>
                </div>
            </div>

            <div id="adversaire-photo-zone" style="text-align:center;"></div>
            <h1 class="dashboard-title" id="adversaire-titre">Adversaire</h1>
            <div style="text-align:center;">
                <span class="week-badge" id="semaine-badge">Semaine ...</span>
            </div>

            <div class="tabs-nav" id="tabs-nav">
                <button class="tab-btn" data-tab="infos">Infos</button>
                <button class="tab-btn" data-tab="palmares">Palmarès</button>
                <button class="tab-btn active" data-tab="matchs">Derniers matchs</button>
                <button class="tab-btn" data-tab="stats">Statistiques</button>
                <button class="tab-btn" data-tab="faceaface">Face-à-face</button>
                <button class="tab-btn" data-tab="badges">Badges</button>
            </div>

            <div class="tab-panel" id="tab-infos" style="display:none;"></div>
            <div class="tab-panel" id="tab-palmares" style="display:none;"></div>
            <div class="tab-panel" id="tab-matchs"></div>
            <div class="tab-panel" id="tab-stats" style="display:none;"></div>
            <div class="tab-panel" id="tab-faceaface" style="display:none;"></div>
            <div class="tab-panel" id="tab-badges" style="display:none;"></div>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('currentUserId');

        if (!userId) {
            window.location.href = 'connexion.html';
        }

        const params = new URLSearchParams(window.location.search);
        const typeAdversaire = params.get('type');
        const adversaireId = params.get('id');
        const ongletInitial = params.get('onglet');

        if (typeAdversaire !== 'reel' && typeAdversaire !== 'rival') {
            window.location.href = 'index.html';
        }
        if (!adversaireId) {
            window.location.href = 'index.html';
        }

        const LABELS_SURFACE = { dur: 'Dur', terre: 'Terre battue', herbe: 'Herbe' };
        let saisonSelectionnee = null;

        function flagImg(code) {
            if (!code) return '';
            return `<img class="flag-icon" src="https://flagcdn.com/24x18/${code}.png" alt="">`;
        }

        // Le pseudo d'un coach est une saisie libre (jamais nettoyee a l'inscription) :
        // a echapper avant de l'inserer dans du HTML.
        function echapperHtml(texte) {
            return String(texte).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // Icone generique (dessin original, pas d'image de vrai trophee - question de
        // droits) : une seule silhouette de coupe, seule la couleur change selon le
        // Grand Chelem concerne (categorie 'slam') pour donner "leur" identite visuelle
        // sans reproduire un trophee reel.
        const TROPHY_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 3h12v2h2.5A1.5 1.5 0 0122 6.5V8c0 2.35-1.8 4.28-4.1 4.48A5.5 5.5 0 0113.5 16v2H16a1 1 0 011 1v1H7v-1a1 1 0 011-1h2.5v-2a5.5 5.5 0 01-4.4-3.52C3.8 12.28 2 10.35 2 8V6.5A1.5 1.5 0 013.5 5H6V3zm0 4H4v1c0 1.24.8 2.3 2 2.7V7zm12 0v3.7c1.2-.4 2-1.46 2-2.7V7h-2z"/></svg>';
        const COULEURS_SLAM = { 'Open d\'Australie': 'trophee-ao', 'Roland-Garros': 'trophee-rg', 'Wimbledon': 'trophee-wimbledon', 'US Open': 'trophee-usopen' };

        function iconeTrophee(nomTournoi, categorie) {
            const classe = categorie === 'slam' ? (COULEURS_SLAM[nomTournoi] || 'trophee-slam') : 'trophee-generique';
            return `<span class="trophee ${classe}" title="${nomTournoi}">${TROPHY_SVG}</span>`;
        }

        function traduireMain(main) {
            return main === 'droitier' ? 'Droitier' : 'Gaucher';
        }

        function formaterNom(prenom, nom) {
            const p = (prenom || '').toLowerCase().replace(/(^|[\s'-])\p{L}/gu, function (c) { return c.toUpperCase(); });
            return p + ' ' + (nom || '').toUpperCase();
        }

        function formaterNomComplet(nomComplet) {
            if (!nomComplet) return nomComplet;
            // Normalise tout caractere d'espacement inhabituel (espace insecable,
            // espaces multiples...) en un espace simple avant de decouper prenom/nom -
            // sans ca, un nom contenant un tel caractere ne matchait jamais
            // lastIndexOf(' ') et repartait inchange (signale par l'utilisateur,
            // 2026-09-18 : certains joueurs n'affichaient pas NOM en majuscules).
            nomComplet = nomComplet.replace(/\s+/g, ' ').trim();
            const i = nomComplet.lastIndexOf(' ');
            if (i === -1) return nomComplet;
            const prenom = nomComplet.slice(0, i).toLowerCase().replace(/(^|[\s'-])\p{L}/gu, function (c) { return c.toUpperCase(); });
            return prenom + ' ' + nomComplet.slice(i + 1).toUpperCase();
        }

        function labelVD(o) {
            return (o.victoires || 0) + 'V - ' + (o.defaites || 0) + 'D';
        }

        function libellePhase(phase) {
            if (phase.type === 'presaison') return 'Pré-saison (Saison ' + phase.numeroSaison + ')';
            if (phase.type === 's0') return 'Semaine 0 (Saison ' + phase.numeroSaison + ')';
            return 'Semaine ' + phase.positionSemaine + ' (Saison ' + phase.numeroSaison + ')';
        }

        async function chargerSemaine() {
            const response = await fetch('/api/semaine');
            const data = await response.json();
            if (response.ok) {
                document.getElementById('semaine-badge').textContent = 'Semaine actuelle : ' + libellePhase(data.phase);
            }
        }

        let peutGererAvatars = false;

        async function verifierAdmin() {
            const response = await fetch('/api/utilisateur/' + userId);
            const data = await response.json();
            // Avatars : admin OU coach redacteur (demande explicite de l'utilisateur,
            // 2026-09-27) - le lien "Administration" reste reserve a l'admin.
            if (response.ok && (data.user.role === 'admin' || data.user.est_redacteur)) peutGererAvatars = true;
            if (response.ok && data.user.role === 'admin') {
                document.getElementById('admin-link').style.display = 'inline-block';
            }
        }

        function activerOnglet(cle) {
            const bouton = document.querySelector('.tab-btn[data-tab="' + cle + '"]');
            if (!bouton) return;
            document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-panel').forEach(function (p) { p.style.display = 'none'; });
            bouton.classList.add('active');
            document.getElementById('tab-' + cle).style.display = 'block';
        }

        document.querySelectorAll('.tab-btn').forEach(function (bouton) {
            bouton.addEventListener('click', function () { activerOnglet(bouton.dataset.tab); });
        });

        // Permet a un lien externe (ex. "Historique de mes matchs" sur joueur.html)
        // d'arriver directement sur un onglet precis plutot que toujours "Infos" par
        // defaut (demande utilisateur, 2026-08-21). Sans parametre, la fiche s'ouvre
        // desormais sur "Derniers matchs" (demande utilisateur, 2026-09-30).
        activerOnglet(ongletInitial || 'matchs');

        function ligneClassement(info) {
            const classementTxt = info.classement ? info.classement : 'Non classé';
            const meilleurTxt = info.meilleurClassement
                ? info.meilleurClassement.rang + ' (' + info.meilleurClassement.semaines + (info.meilleurClassement.semaines > 1 ? ' semaines' : ' semaine') + ')'
                : 'Pas encore de données';
            return `
                <div class="stat-row"><span class="stat-label">Classement</span><span class="stat-value">${classementTxt}</span></div>
                <div class="stat-row"><span class="stat-label">Meilleur classement</span><span class="stat-value">${meilleurTxt}</span></div>
            `;
        }

        function blocProchainsTournois(prochainsTournois) {
            if (!prochainsTournois || prochainsTournois.length === 0) {
                return `
                    <h2 class="dashboard-title" style="font-size:1.3rem; margin-top:28px;">Prochains tournois</h2>
                    <div class="match-hint">Aucune inscription validée dans les 5 prochaines semaines.</div>
                `;
            }
            return `
                <h2 class="dashboard-title" style="font-size:1.3rem; margin-top:28px;">Prochains tournois</h2>
                <div class="tournoi-list">
                    ${prochainsTournois.map(function (t) {
                        const classeSurface = t.surface + (t.surface === 'dur' && t.indoor ? '-indoor' : '');
                        return `<div class="tournoi-card tournoi-card-${classeSurface}"><div class="tournoi-card-name">${t.nom}</div>
                            <div class="tournoi-card-meta">Semaine ${t.positionSemaine} · ${t.categorie} · ${LABELS_SURFACE[t.surface] || t.surface}</div></div>`;
                    }).join('')}
                </div>
            `;
        }

        // Presentation libre du joueur, ecrite par son coach. Visible par tous ; le
        // coach du joueur (et lui seul - le serveur le verifie aussi) voit en plus un
        // bouton pour la modifier. Texte toujours echappe (jamais de HTML interprete).
        const BIO_LONGUEUR_MAX = 1500;
        function blocBio(info) {
            const estMonJoueur = String(info.coachUserId) === String(userId);
            const texte = info.bio
                ? `<div class="bio-texte">${echapperHtml(info.bio)}</div>`
                : `<div class="match-hint">${estMonJoueur ? "Aucune présentation pour l'instant. Présente ton joueur aux autres coachs !" : "Son coach n'a pas encore écrit de présentation."}</div>`;
            if (!estMonJoueur) {
                return `<div class="bio-bloc"><div class="stats-header">Présentation</div>${texte}</div>`;
            }
            return `
                <div class="bio-bloc" id="bio-bloc">
                    <div class="stats-header">Présentation</div>
                    <div id="bio-lecture">${texte}<button type="button" class="bio-btn" id="bio-modifier-btn">${info.bio ? 'Modifier la présentation' : 'Écrire une présentation'}</button></div>
                    <div id="bio-edition" style="display:none;">
                        <textarea id="bio-textarea" class="bio-textarea" maxlength="${BIO_LONGUEUR_MAX}" rows="6" placeholder="Son histoire, son caractère, ses objectifs...">${echapperHtml(info.bio || '')}</textarea>
                        <div class="bio-compteur" id="bio-compteur"></div>
                        <div class="bio-actions">
                            <button type="button" class="bio-btn" id="bio-enregistrer-btn">Enregistrer</button>
                            <button type="button" class="bio-btn bio-btn-secondaire" id="bio-annuler-btn">Annuler</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function brancherBio() {
            const btnModifier = document.getElementById('bio-modifier-btn');
            if (!btnModifier) return;
            const zone = document.getElementById('bio-textarea');
            const compteur = document.getElementById('bio-compteur');
            const majCompteur = function () { compteur.textContent = zone.value.length + ' / ' + BIO_LONGUEUR_MAX; };
            btnModifier.addEventListener('click', function () {
                document.getElementById('bio-lecture').style.display = 'none';
                document.getElementById('bio-edition').style.display = 'block';
                majCompteur();
                zone.focus();
            });
            zone.addEventListener('input', majCompteur);
            document.getElementById('bio-annuler-btn').addEventListener('click', function () { chargerFiche(); });
            document.getElementById('bio-enregistrer-btn').addEventListener('click', async function () {
                const bouton = this;
                bouton.disabled = true;
                const rep = await fetch('/api/joueur/bio/' + adversaireId, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bio: zone.value })
                });
                const d = await rep.json();
                if (!rep.ok) { alert(d.error || "Impossible d'enregistrer la présentation."); bouton.disabled = false; return; }
                chargerFiche();
            });
        }

        function afficherInfos(data) {
            const panneau = document.getElementById('tab-infos');
            const info = data.infos;

            if (typeAdversaire === 'reel') {
                panneau.innerHTML = `
                    ${blocBio(info)}
                    <div class="stat-row"><span class="stat-label">Prénom</span><span class="stat-value">${info.prenom}</span></div>
                    <div class="stat-row"><span class="stat-label">Nom</span><span class="stat-value">${(info.nom || '').toUpperCase()}</span></div>
                    <div class="stat-row"><span class="stat-label">Âge</span><span class="stat-value">${info.age} ans</span></div>
                    <div class="stat-row"><span class="stat-label">Taille</span><span class="stat-value">${info.taille} cm</span></div>
                    <div class="stat-row"><span class="stat-label">Nationalité</span><span class="stat-value"><a class="lien-adversaire" href="pays.html?nation=${encodeURIComponent(info.nationalite)}">${flagImg(info.drapeau)} ${info.nationalite}</a></span></div>
                    <div class="stat-row"><span class="stat-label">Main forte</span><span class="stat-value">${traduireMain(info.main_forte)}</span></div>
                    <div class="stat-row"><span class="stat-label">Circuit</span><span class="stat-value">${info.circuit}</span></div>
                    <div class="stat-row"><span class="stat-label">Coach</span><span class="stat-value"><a class="lien-adversaire" href="coach.html?id=${info.coachUserId}">${info.coachNom}</a></span></div>
                    ${ligneClassement(info)}
                    ${blocProchainsTournois(data.prochainsTournois)}
                `;
            } else {
                panneau.innerHTML = `
                    <div class="stat-row"><span class="stat-label">Nom</span><span class="stat-value">${formaterNomComplet(info.nom)}</span></div>
                    <div class="stat-row"><span class="stat-label">Nationalité</span><span class="stat-value"><a class="lien-adversaire" href="pays.html?nation=${encodeURIComponent(info.nationalite)}">${flagImg(info.drapeau)} ${info.nationalite}</a></span></div>
                    <div class="stat-row"><span class="stat-label">Circuit</span><span class="stat-value">${info.circuit}</span></div>
                    ${ligneClassement(info)}
                    <div class="match-hint">Rival persistant du circuit — infos personnelles (taille, main) non disponibles.</div>
                `;
            }
        }

        function afficherPalmares(data) {
            const panneau = document.getElementById('tab-palmares');
            if (data.palmares.length === 0) {
                panneau.innerHTML = '<div class="match-hint">Aucun titre remporté pour l\'instant.</div>';
                return;
            }
            panneau.innerHTML = `
                <div class="tournoi-list">
                    ${data.palmares.map(function (p) {
                        return `<div class="tournoi-card"><div class="tournoi-card-name">${iconeTrophee(p.nom, p.categorie)} ${p.nom}</div>
                            <div class="tournoi-card-meta">Semaine ${p.positionSemaine} · ${p.categorie} · ${LABELS_SURFACE[p.surface] || p.surface}</div></div>`;
                    }).join('')}
                </div>
            `;
        }

        // ---------- Derniers matchs ----------
        // Le resultat (Victoire/Defaite + score) est deja affiche directement dans le
        // titre de chaque carte : seul le Teletexte (journal complet du match) apporte
        // une info supplementaire, d'ou un unique bouton (pas de mode Live/Resultat
        // comme sur matchs.html/tournoi-detail.html).

        const detailsCache = {};

        // Le journal d'un match stocke "Toi"/"Adversaire" du point de vue de son
        // proprietaire - ici le spectateur n'est jamais ce proprietaire (on consulte
        // toujours la fiche d'un AUTRE joueur), donc "Toi" serait trompeur sans
        // substitution par le vrai nom (demande utilisateur, 2026-08-20).
        function remplacerNomsEvenements(match) {
            const nomMoi = formaterNom(match.prenom, match.nom);
            const nomAdversaire = match.adversaire_nom ? formaterNomComplet(match.adversaire_nom) : 'Adversaire';
            match.evenements.forEach(function (evt) {
                evt.texte = evt.texte.replace(/\bToi\b/g, nomMoi).replace(/\bAdversaire\b/g, nomAdversaire);
            });
        }

        async function obtenirDetail(matchId) {
            if (detailsCache[matchId]) return detailsCache[matchId];
            const response = await fetch('/api/matchs/detail/' + matchId + '?userId=' + userId);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Impossible de charger ce match.');
            remplacerNomsEvenements(data.match);
            detailsCache[matchId] = data.match;
            return data.match;
        }

        // Affiche tout le deroule d'un coup, comme une vraie page de teletexte qu'on
        // feuillette a son propre rythme (pas d'animation ligne par ligne ici, contrairement
        // au Live de matchs.html/tournoi-detail.html) - demande explicite de l'utilisateur,
        // 2026-09-22.
        // ---------- Stats d'un match (bouton "Stats", a cote du Teletexte) ----------
        // Stats d'un match recalculees a partir de son deroule enregistre (evenements) -
        // valables pour tous les matchs deja joues. Code IDENTIQUE dans server.js (stats de
        // carriere/saison de la fiche joueur, records) et dans matchs.html,
        // tournoi-detail.html et adversaire.html (bouton "Stats") : a modifier partout a la
        // fois. Cotes A/B = cotes du moteur (jeuxA/jeuxB/serveur), noms lus dans le texte
        // ("Service : NOM", "Set N remporte par NOM (a-b)"). Balles de break/set/match :
        // annonce "<Libelle> pour NOM" suivie de son issue ("... sauve par ..." = sauvee,
        // sinon convertie) ; un point decisif de tie-break compte comme balle de match s'il
        // pouvait conclure le match, sinon comme balle de set. Serveur de chaque jeu : evt
        // jeu_debut quand il existe (matchs depuis le 2026-09-21), sinon alternance depuis
        // le serveur annonce en debut de set. Demande utilisateur 2026-10-03.
        function calculerStatsMatch(evenements) {
            const noms = { A: null, B: null };
            const vide = function () {
                return { bb: 0, bbOk: 0, bs: 0, bsOk: 0, bm: 0, bmOk: 0, pi: 0, piOk: 0, svc: 0, svcOk: 0, ret: 0, retOk: 0, tb: 0, tbOk: 0, tbPts: 0, serie: 0, jeux: 0, sets60: 0 };
            };
            const stats = { A: vide(), B: vide() };
            let setsRequis = 2;

            evenements.forEach(function (e) {
                const t = e.texte || '';
                if (e.type === 'set_debut') {
                    const m = /Service : (.+)\) ---/.exec(t);
                    if (m && (e.serveur === 'A' || e.serveur === 'B') && !noms[e.serveur]) noms[e.serveur] = m[1];
                } else if (e.type === 'set_fin') {
                    const m = /remporte par (.+) \(/.exec(t);
                    if (m && e.jeuxA !== e.jeuxB) {
                        const cote = e.jeuxA > e.jeuxB ? 'A' : 'B';
                        if (!noms[cote]) noms[cote] = m[1];
                    }
                } else if (e.type === 'match_fin' && typeof e.setsA === 'number') {
                    setsRequis = Math.max(2, e.setsA, e.setsB);
                }
            });
            // Cote encore inconnu (meme serveur au debut de chaque set et victoire en sets
            // secs) : n'importe quel autre nom cite dans le deroule.
            if ((noms.A && !noms.B) || (noms.B && !noms.A)) {
                const connu = noms.A || noms.B;
                evenements.forEach(function (e) {
                    const m = /(?: pour | remporte par )(.+?)(?: \(|$)/.exec(e.texte || '');
                    if (m && m[1] !== connu && !(noms.A && noms.B)) {
                        if (!noms.A) noms.A = m[1]; else noms.B = m[1];
                    }
                });
            }
            if (!noms.A || !noms.B) return null;
            const coteDe = function (nom) { return nom === noms.A ? 'A' : (nom === noms.B ? 'B' : null); };
            const autre = function (c) { return c === 'A' ? 'B' : 'A'; };

            let serveur = null, prec = { A: 0, B: 0 }, setsAvantTB = null, dansTB = false, dernierTB = null;
            let serieCote = null, serieLongueur = 0;
            const gagnerJeu = function (cote) {
                if (cote === serieCote) serieLongueur++; else { serieCote = cote; serieLongueur = 1; }
                if (serieLongueur > stats[cote].serie) stats[cote].serie = serieLongueur;
            };

            for (let i = 0; i < evenements.length; i++) {
                const e = evenements[i];
                const t = e.texte || '';
                if (e.type === 'set_debut') {
                    serveur = e.serveur === 'A' || e.serveur === 'B' ? e.serveur : null;
                    prec = { A: 0, B: 0 }; dansTB = false;
                } else if (e.type === 'jeu_debut') {
                    if (e.serveur === 'A' || e.serveur === 'B') serveur = e.serveur;
                } else if (e.type === 'jeu' && typeof e.jeuxA === 'number') {
                    const gagnant = e.jeuxA > prec.A ? 'A' : (e.jeuxB > prec.B ? 'B' : null);
                    prec = { A: e.jeuxA, B: e.jeuxB };
                    if (gagnant && serveur) {
                        stats[serveur].svc++; stats[autre(serveur)].ret++;
                        if (gagnant === serveur) stats[serveur].svcOk++; else stats[gagnant].retOk++;
                    }
                    if (gagnant) gagnerJeu(gagnant);
                    if (serveur) serveur = autre(serveur);
                } else if (e.type === 'tie_break_debut') {
                    setsAvantTB = { A: e.setsA, B: e.setsB }; dansTB = true; dernierTB = null;
                } else if (e.type === 'tie_break_point') {
                    if (typeof e.ptsA === 'number') dernierTB = { A: e.ptsA, B: e.ptsB };
                    else { const m = /score : (\d+)-(\d+)/.exec(t); if (m) dernierTB = { A: +m[1], B: +m[2] }; }
                } else if (e.type === 'set_fin') {
                    if (dansTB && e.jeuxA !== e.jeuxB) {
                        const g = e.jeuxA > e.jeuxB ? 'A' : 'B';
                        stats.A.tb++; stats.B.tb++; stats[g].tbOk++;
                        if (dernierTB) { stats.A.tbPts += dernierTB.A; stats.B.tbPts += dernierTB.B; }
                        gagnerJeu(g);
                    }
                    if (typeof e.jeuxA === 'number') {
                        stats.A.jeux += e.jeuxA; stats.B.jeux += e.jeuxB;
                        if (e.jeuxA === 6 && e.jeuxB === 0) stats.A.sets60++;
                        if (e.jeuxB === 6 && e.jeuxA === 0) stats.B.sets60++;
                    }
                    prec = { A: 0, B: 0 }; dansTB = false;
                } else if (e.type === 'point_important') {
                    const pos = t.lastIndexOf(' pour ');
                    if (pos === -1) continue; // ligne d'issue, traitee avec son annonce
                    const libelle = t.slice(0, pos);
                    const cote = coteDe(t.slice(pos + 6));
                    if (!cote) continue;
                    const issue = evenements[i + 1] && evenements[i + 1].type === 'point_important' ? (evenements[i + 1].texte || '') : '';
                    if (issue === '') continue;
                    const convertie = issue.indexOf(' sauve par ') === -1;
                    const s = stats[cote];
                    stats.A.pi++; stats.B.pi++;
                    stats[convertie ? cote : autre(cote)].piOk++;
                    if (libelle.indexOf('Balle de break') === 0) { s.bb++; if (convertie) s.bbOk++; }
                    if (libelle.indexOf('Balle de set') !== -1) { s.bs++; if (convertie) s.bsOk++; }
                    if (libelle.indexOf('Balle de match') !== -1) { s.bm++; if (convertie) s.bmOk++; }
                    if (libelle === 'Point decisif') {
                        const estBalleMatch = setsAvantTB && setsAvantTB[cote] + 1 >= setsRequis;
                        if (estBalleMatch) { s.bm++; if (convertie) s.bmOk++; } else { s.bs++; if (convertie) s.bsOk++; }
                    }
                }
            }

            // Set interrompu (abandon) : ses jeux comptent aussi.
            if (prec.A || prec.B) { stats.A.jeux += prec.A; stats.B.jeux += prec.B; }
            return { noms: noms, stats: stats };
        }

        function afficherStatsMatch(viewer, match) {
            const r = calculerStatsMatch(match.evenements || []);
            if (!r) {
                viewer.innerHTML = '<div class="match-hint">Statistiques indisponibles pour ce match.</div>';
                return;
            }
            // Chaque cellule porte un score de comparaison : seul le chiffre du joueur
            // qui remporte la stat est mis en gras (rien en cas d'egalite). Ratios :
            // compares au pourcentage, puis au nombre reussi ; une case vide (aucune
            // tentative) ne gagne jamais face a une vraie valeur.
            const ratio = function (ok, total) {
                if (!total) return { html: '<span class="match-stats-vide">—</span>', score: null };
                return { html: ok + '/' + total + ' <span class="match-stats-pct">(' + Math.round(ok / total * 100) + ' %)</span>', score: [ok / total, ok] };
            };
            const nombre = function (n) { return { html: String(n), score: [n] }; };
            const comparer = function (x, y) {
                if (!x.score || !y.score) return x.score ? 1 : (y.score ? -1 : 0);
                for (let i = 0; i < x.score.length; i++) {
                    if (x.score[i] !== y.score[i]) return x.score[i] > y.score[i] ? 1 : -1;
                }
                return 0;
            };
            const ligne = function (libelle, a, b) {
                const c = comparer(a, b);
                const cellule = function (v, gagne) { return '<td class="match-stats-val' + (gagne ? ' match-stats-gagne' : '') + '">' + v.html + '</td>'; };
                return '<tr>' + cellule(a, c > 0) + '<td class="match-stats-lib">' + libelle + '</td>' + cellule(b, c < 0) + '</tr>';
            };
            const A = r.stats.A, B = r.stats.B;
            const tbTotal = A.tbPts + B.tbPts;
            viewer.innerHTML = `
                <table class="match-stats-table">
                    <thead><tr><th>${echapperStats(r.noms.A)}</th><th></th><th>${echapperStats(r.noms.B)}</th></tr></thead>
                    <tbody>
                        ${ligne('Balles de break converties', ratio(A.bbOk, A.bb), ratio(B.bbOk, B.bb))}
                        ${ligne('Balles de break sauvées', ratio(B.bb - B.bbOk, B.bb), ratio(A.bb - A.bbOk, A.bb))}
                        ${ligne('Balles de set converties', ratio(A.bsOk, A.bs), ratio(B.bsOk, B.bs))}
                        ${ligne('Balles de match converties', ratio(A.bmOk, A.bm), ratio(B.bmOk, B.bm))}
                        ${ligne('Points importants gagnés', ratio(A.piOk, A.pi), ratio(B.piOk, B.pi))}
                        ${ligne('Jeux de service gagnés', ratio(A.svcOk, A.svc), ratio(B.svcOk, B.svc))}
                        ${ligne('Jeux de retour gagnés', ratio(A.retOk, A.ret), ratio(B.retOk, B.ret))}
                        ${A.tb ? ligne('Tie-breaks gagnés', { html: A.tbOk + '/' + A.tb, score: [A.tbOk] }, { html: B.tbOk + '/' + B.tb, score: [B.tbOk] }) : ''}
                        ${A.tb ? ligne('Points de tie-break gagnés', ratio(A.tbPts, tbTotal), ratio(B.tbPts, tbTotal)) : ''}
                        ${ligne('Plus longue série de jeux', nombre(A.serie), nombre(B.serie))}
                        ${ligne('Jeux gagnés', nombre(A.jeux), nombre(B.jeux))}
                    </tbody>
                </table>
            `;
        }

        function echapperStats(texte) {
            return String(texte).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        async function activerModeMatch(matchId, mode, boutonClique) {
            const carte = document.querySelector('.match-card[data-match-id="' + matchId + '"]');
            const viewer = carte.querySelector('.match-viewer');

            carte.querySelectorAll('.match-mode-btn-mini').forEach(function (b) { b.classList.remove('active'); });
            boutonClique.classList.add('active');
            viewer.style.display = 'block';
            viewer.innerHTML = '<div class="match-viewer-loading">Chargement...</div>';

            try {
                const match = await obtenirDetail(matchId);
                if (mode === 'stats') { afficherStatsMatch(viewer, match); return; }
                viewer.innerHTML = '<div class="match-journal" style="display:block;"></div>';
                const journalDiv = viewer.querySelector('.match-journal');
                match.evenements.forEach(function (evt) {
                    const ligne = document.createElement('div');
                    ligne.className = 'teletexte-ligne teletexte-' + evt.type;
                    ligne.textContent = evt.texte;
                    journalDiv.appendChild(ligne);
                });
            } catch (err) {
                viewer.innerHTML = '<div class="match-hint">' + err.message + '</div>';
            }
        }

        function selecteurSaison(data) {
            if (!data.saisonsDisponibles || data.saisonsDisponibles.length === 0) return '';
            const options = data.saisonsDisponibles.map(function (s) {
                return `<option value="${s}"${s === data.saisonAffichee ? ' selected' : ''}>Saison ${s}</option>`;
            }).join('');
            return `
                <div class="form-group" style="max-width:220px; margin-bottom:16px;">
                    <label for="saison-select">Saison</label>
                    <select id="saison-select">${options}</select>
                </div>
            `;
        }

        // Lien vers la fiche de l'adversaire d'UN match precis (jamais vers soi-meme -
        // impossible ici puisqu'un adversaire de match n'est jamais le proprietaire de
        // la fiche consultee) - un lambda jetable (ni playerId ni rivalId) reste texte
        // simple, aucune fiche stable n'existe pour lui (demande utilisateur, 2026-08-21).
        function lienVersAdversaireMatch(nomHtml, playerId, rivalId) {
            if (playerId) return `<a class="lien-adversaire" href="adversaire.html?type=reel&id=${playerId}">${nomHtml}</a>`;
            if (rivalId) return `<a class="lien-adversaire" href="adversaire.html?type=rival&id=${rivalId}">${nomHtml}</a>`;
            return nomHtml;
        }

        function creerCarteMatchAdversaire(m) {
            const carte = document.createElement('div');
            // Fond vert/rouge tres leger selon l'issue (demande explicite de
            // l'utilisateur, 2026-09-19) - meme critere que le libelle Victoire/Defaite
            // affiche dans la carte, donc jamais de spoiler ici (le resultat est deja
            // visible d'emblee sur cette page).
            carte.className = 'match-card ' + (m.victoire ? 'match-card-victoire' : 'match-card-defaite');

            // Le badge Kine ne reflete jamais que la propre condition du joueur/rival
            // de cette fiche (matchs.kine_intervenu est calcule cote serveur par
            // rapport a CE player_id precis) - jamais celle de l'adversaire du match.
            const kineBadge = m.kineIntervenu ? '<span class="status-badge kine-badge">Kiné</span>' : '';

            if (typeAdversaire === 'reel' && m.matchId && m.tournoi) {
                carte.dataset.matchId = m.matchId;
                const classementTxt = m.adversaireClassement ? `<span class="match-card-adversaire-classement">#${m.adversaireClassement}</span>` : '';
                // Coach de l'adversaire (vrai joueur uniquement) en petit, entre
                // parentheses, apres le classement - echappe car le pseudo est une saisie
                // libre (demande explicite de l'utilisateur, 2026-09-19).
                const coachTxt = m.adversaireCoach ? `<span class="match-card-adversaire-coach">(${echapperHtml(m.adversaireCoach)})</span>` : '';
                const nomAdversaireHtml = lienVersAdversaireMatch(formaterNomComplet(m.adversaireNom), m.adversairePlayerId, m.adversaireRivalId);
                // Bot (rival ou lambda, aucun vrai joueur derriere) : meme bleu que dans les
                // tableaux de tournoi.
                const classeBot = m.adversairePlayerId ? '' : ' match-card-adversaire-bot';
                const blocAdversaire = m.adversaireNom
                    ? `<div class="match-card-adversaire">${flagImg(m.adversaireDrapeau)}<span class="match-card-adversaire-nom${classeBot}">${nomAdversaireHtml}</span>${classementTxt}${coachTxt}</div>`
                    : '';
                // Trophee = la finale gagnee (dernier tour du tournoi, quel que soit son
                // format elimination/poules, s'appelle toujours "Finale").
                const trophee = (m.numeroTour === 'Finale' && m.victoire) ? iconeTrophee(m.tournoiNom, m.categorie) : '';
                // Le resultat (score) est deja affiche directement dans le titre : seul
                // le Teletexte (journal complet du match) apporte une info en plus, d'ou
                // un unique petit bouton plutot que les 3 modes Live/Resultat/Teletexte.
                carte.innerHTML = `
                    <div class="match-card-head">
                        <div class="match-card-info">
                            <div class="match-card-name">${trophee}${m.victoire ? 'Victoire' : 'Défaite'} ${m.score} ${kineBadge}</div>
                            ${blocAdversaire}
                            <div class="match-card-meta">Semaine ${m.positionSemaine} · ${m.numeroTour}</div>
                        </div>
                        <div class="match-mode-mini-groupe">
                            <button class="match-mode-btn-mini" data-mode="teletexte">Téletexte</button>
                            <button class="match-mode-btn-mini" data-mode="stats">Stats</button>
                        </div>
                    </div>
                    <div class="match-viewer"></div>
                `;
                carte.querySelectorAll('.match-mode-btn-mini').forEach(function (bouton) {
                    bouton.addEventListener('click', function () {
                        activerModeMatch(m.matchId, bouton.dataset.mode, bouton);
                    });
                });
            } else {
                const lienAdversaireFiche = lienVersAdversaireMatch(formaterNomComplet(m.adversaireNom), m.adversairePlayerId, m.adversaireRivalId);
                const nomAdversaire = typeAdversaire === 'reel'
                    ? m.numeroTour
                    : ((m.adversairePlayerId ? lienAdversaireFiche : `<span class="match-card-adversaire-bot">${lienAdversaireFiche}</span>`) + ' · ' + m.numeroTour);
                carte.innerHTML = `
                    <div class="match-card-head">
                        <div class="match-card-info">
                            <div class="match-card-name">${m.victoire ? 'Victoire' : 'Défaite'} ${m.score || ''} ${kineBadge}</div>
                            <div class="match-card-meta">Semaine ${m.positionSemaine} · ${nomAdversaire}</div>
                        </div>
                    </div>
                `;
            }
            return carte;
        }

        // Regroupe une liste plate de matchs (triee du plus recent au plus ancien) en
        // paquets consecutifs appartenant au meme tournoi (tournoiId) - un tournoi sur
        // 2 semaines peut avoir des matchs non consecutifs dans le temps, mais reste
        // group car ORDER BY garantit deja qu'ils se suivent dans le flux.
        function grouperParTournoi(matchs) {
            const groupes = [];
            matchs.forEach(function (m) {
                const dernier = groupes[groupes.length - 1];
                if (m.tournoiId && dernier && dernier.tournoiId === m.tournoiId) {
                    dernier.matchs.push(m);
                } else {
                    groupes.push({ tournoiId: m.tournoiId, tournoiNom: m.tournoiNom, tournoiCalendrierId: m.tournoiCalendrierId, surface: m.surface, positionSemaine: m.positionSemaine, matchs: [m] });
                }
            });
            return groupes;
        }

        function afficherDerniersMatchs(data) {
            const panneau = document.getElementById('tab-matchs');
            const selecteur = selecteurSaison(data);

            if (data.derniersMatchs.length === 0) {
                panneau.innerHTML = selecteur + '<div class="match-hint">Aucun match disputé cette saison.</div>';
            } else {
                panneau.innerHTML = selecteur + '<div class="match-list" id="adversaire-match-list"></div>';
                const liste = document.getElementById('adversaire-match-list');

                const groupes = grouperParTournoi(data.derniersMatchs);
                groupes.forEach(function (groupe, index) {
                    if (!groupe.tournoiId) {
                        groupe.matchs.forEach(function (m) { liste.appendChild(creerCarteMatchAdversaire(m)); });
                        return;
                    }

                    if (index > 0) liste.appendChild(Object.assign(document.createElement('div'), { className: 'separateur-tournoi' }));

                    const bloc = document.createElement('div');
                    bloc.className = 'match-tournoi-group match-tournoi-group-' + groupe.surface;
                    const lienTournoi = groupe.tournoiCalendrierId
                        ? `<a href="tournoi-detail.html?calendrierId=${groupe.tournoiCalendrierId}&semaine=${groupe.matchs[0].semaine}">${groupe.tournoiNom}</a>`
                        : groupe.tournoiNom;
                    bloc.innerHTML = `
                        <div class="match-tournoi-header">
                            ${lienTournoi}
                            <span class="match-tournoi-header-meta">Semaine ${groupe.positionSemaine} · ${LABELS_SURFACE[groupe.surface] || groupe.surface}</span>
                        </div>
                        <div class="match-tournoi-matchs"></div>
                    `;
                    const conteneur = bloc.querySelector('.match-tournoi-matchs');
                    groupe.matchs.forEach(function (m) { conteneur.appendChild(creerCarteMatchAdversaire(m)); });
                    liste.appendChild(bloc);
                });
            }

            if (document.getElementById('saison-select')) {
                document.getElementById('saison-select').addEventListener('change', function () {
                    saisonSelectionnee = Number(this.value);
                    chargerFiche();
                });
            }
        }

        function tableVD(lignes, libelleColonne) {
            if (Object.keys(lignes).length === 0) {
                return '<div class="match-hint">Aucune donnée pour l\'instant.</div>';
            }
            return `
                <table class="classement-table">
                    <thead><tr><th>${libelleColonne}</th><th>Victoires</th><th>Défaites</th></tr></thead>
                    <tbody>
                        ${Object.keys(lignes).sort().map(function (cle) {
                            const o = lignes[cle];
                            return `<tr><td>${cle}</td><td>${o.victoires || 0}</td><td>${o.defaites || 0}</td></tr>`;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        // Stats de jeu cumulees (joueur reel uniquement) : tableau Global / Dur /
        // Terre / Herbe, bascule Carriere <-> saison affichee (selecteur de saison de
        // la fiche). Calculees cote serveur avec le meme code que le bouton "Stats"
        // d'un match (statsJeuJoueur). Demande utilisateur 2026-10-03.
        let porteeStatsJeu = 'carriere';
        function blocStatsJeu(data) {
            if (!data.statsJeu) return '';
            const bloc = porteeStatsJeu === 'saison' ? data.statsJeu.saison : data.statsJeu.carriere;
            const colonnes = ['global', 'dur', 'terre', 'herbe'];
            const titres = { global: 'Global', dur: 'Dur', terre: 'Terre', herbe: 'Herbe' };
            const ratio = function (ok, total) {
                if (!total) return '<span class="match-stats-vide">—</span>';
                return Math.round(ok / total * 100) + ' %<div class="match-stats-pct">' + ok + '/' + total + '</div>';
            };
            const lignes = [
                ['Balles de break converties', function (c) { return ratio(c.bbOk, c.bb); }],
                ['Balles de break sauvées', function (c) { return ratio(c.bbSauvees, c.bbAdv); }],
                ['Jeux de service gagnés', function (c) { return ratio(c.svcOk, c.svc); }],
                ['Jeux de retour gagnés', function (c) { return ratio(c.retOk, c.ret); }],
                ['Points importants gagnés', function (c) { return ratio(c.piOk, c.pi); }],
                ['Tie-breaks gagnés', function (c) { return ratio(c.tbOk, c.tb); }],
                ['Points de tie-break gagnés', function (c) { return ratio(c.tbPts, c.tbPtsTotal); }],
                ['Sets gagnés 6-0', function (c) { return c.matchs ? String(c.sets60) : '<span class="match-stats-vide">—</span>'; }],
                ['Matchs comptés', function (c) { return String(c.matchs); }]
            ];
            const corps = !bloc || !bloc.global.matchs
                ? '<div class="match-hint">Aucun match joué sur cette période.</div>'
                : `<div class="stats-jeu-scroll"><table class="stats-jeu-table">
                        <thead><tr><th></th>${colonnes.map(function (k) { return '<th>' + titres[k] + '</th>'; }).join('')}</tr></thead>
                        <tbody>${lignes.map(function (l) {
                            return '<tr><td class="match-stats-lib">' + l[0] + '</td>' + colonnes.map(function (k) { return '<td class="match-stats-val">' + l[1](bloc[k]) + '</td>'; }).join('') + '</tr>';
                        }).join('')}</tbody>
                    </table></div>`;
            return `
                <div class="stats-header">Statistiques de jeu</div>
                <div class="stats-jeu-portee">
                    <button type="button" class="match-mode-btn-mini ${porteeStatsJeu === 'carriere' ? 'active' : ''}" data-portee="carriere">Carrière</button>
                    <button type="button" class="match-mode-btn-mini ${porteeStatsJeu === 'saison' ? 'active' : ''}" data-portee="saison">Saison ${data.saisonAffichee}</button>
                </div>
                ${corps}
            `;
        }

        function afficherStats(data) {
            const panneau = document.getElementById('tab-stats');
            const s = data.stats;
            const parSurfaceLabels = {};
            Object.keys(s.parSurface).forEach(function (cle) { parSurfaceLabels[LABELS_SURFACE[cle] || cle] = s.parSurface[cle]; });
            const parSaisonLabels = {};
            Object.keys(s.parSaison).forEach(function (cle) { parSaisonLabels['Saison ' + cle] = s.parSaison[cle]; });

            const f = data.faceAFace;
            let blocFaceAFace = '';
            if (f && f.nbConfrontations > 0) {
                const parSurfaceFaceLabels = {};
                Object.keys(f.parSurface).forEach(function (cle) { parSurfaceFaceLabels[LABELS_SURFACE[cle] || cle] = f.parSurface[cle]; });
                const parSaisonFaceLabels = {};
                Object.keys(f.parSaison).forEach(function (cle) { parSaisonFaceLabels['Saison ' + cle] = f.parSaison[cle]; });

                blocFaceAFace = `
                    <div class="stats-header">Contre toi (${f.nbConfrontations} confrontation${f.nbConfrontations > 1 ? 's' : ''})</div>
                    <div class="stat-row"><span class="stat-label">Bilan</span><span class="stat-value">${labelVD(f)}</span></div>
                    <div class="stats-header">Contre toi — Par surface</div>
                    ${tableVD(parSurfaceFaceLabels, 'Surface')}
                    <div class="stats-header">Contre toi — Par saison</div>
                    ${tableVD(parSaisonFaceLabels, 'Saison')}
                `;
            }

            panneau.innerHTML = `
                ${blocStatsJeu(data)}
                <div class="stats-header">Global</div>
                <div class="stat-row"><span class="stat-label">Bilan</span><span class="stat-value">${labelVD(s.global)}</span></div>
                <div class="stats-header">Par surface</div>
                ${tableVD(parSurfaceLabels, 'Surface')}
                <div class="stats-header">Par saison</div>
                ${tableVD(parSaisonLabels, 'Saison')}
                ${blocFaceAFace}
            `;
            panneau.querySelectorAll('[data-portee]').forEach(function (bouton) {
                bouton.addEventListener('click', function () {
                    porteeStatsJeu = bouton.dataset.portee;
                    afficherStats(data);
                });
            });
        }

        function afficherFaceAFace(data) {
            const panneau = document.getElementById('tab-faceaface');
            const f = data.faceAFace;

            if (f.nbConfrontations === 0) {
                panneau.innerHTML = '<div class="match-hint">Aucune confrontation pour l\'instant.</div>';
                return;
            }

            const parSurfaceLabels = {};
            Object.keys(f.parSurface).forEach(function (cle) { parSurfaceLabels[LABELS_SURFACE[cle] || cle] = f.parSurface[cle]; });

            panneau.innerHTML = `
                <div class="stat-row"><span class="stat-label">Confrontations</span><span class="stat-value">${f.nbConfrontations}</span></div>
                <div class="stat-row"><span class="stat-label">Bilan</span><span class="stat-value">${labelVD(f)}</span></div>
                <div class="stats-header">Par surface</div>
                ${tableVD(parSurfaceLabels, 'Surface')}
            `;
        }

        function carteBadge(b) {
            return `
                <div class="badge-card palier-${b.palierNom}">
                    <div class="badge-card-nom">${b.nom}</div>
                    <div class="badge-card-palier">${b.palierNom}</div>
                    <div class="badge-card-description">${b.description}</div>
                    <div class="badge-card-progression">${b.valeur}${b.prochainSeuil ? ' / ' + b.prochainSeuil : ''}</div>
                </div>
            `;
        }

        function afficherBadges(data) {
            const panneau = document.getElementById('tab-badges');
            panneau.innerHTML = '<div class="badge-grid">' + data.badges.map(carteBadge).join('') + '</div>';
        }

        async function chargerFiche() {
            const suffixeSaison = saisonSelectionnee ? '&saison=' + saisonSelectionnee : '';
            const response = await fetch('/api/adversaire/' + typeAdversaire + '/' + adversaireId + '?monUserId=' + userId + suffixeSaison);
            const data = await response.json();

            if (!response.ok) {
                document.getElementById('tab-infos').innerHTML = '<div class="match-hint">' + (data.error || 'Impossible de charger cet adversaire.') + '</div>';
                return;
            }

            saisonSelectionnee = data.saisonAffichee;

            const nomAffiche = typeAdversaire === 'reel' ? formaterNom(data.infos.prenom, data.infos.nom) : formaterNomComplet(data.infos.nom);
            document.getElementById('adversaire-titre').textContent = nomAffiche;
            document.title = nomAffiche + ' — Tennis Web Manager';

            // Avatar personnalise : uniquement pour un vrai joueur (jamais pour un
            // rival, aucune photo n'existe pour eux). Simple lecture pour un coach
            // normal ; un admin voit en plus les controles pour poser/retirer une
            // photo sur la fiche de N'IMPORTE QUEL joueur - seul lui doit pouvoir le
            // faire sur la fiche d'un joueur qui n'est pas le sien (demande explicite
            // de l'utilisateur 2026-08-22). Sans photo perso, une icone generique
            // (silhouette joueur/joueuse) s'affiche a la place - jamais une case vide
            // ou un texte "Aucune photo" (demande explicite, 2026-08-22).
            const iconeGeneriqueAdversaire = data.infos.type === 'joueuse' ? 'icone-joueuse.png' : 'icone-joueur.png';
            const zonePhoto = document.getElementById('adversaire-photo-zone');
            if (typeAdversaire !== 'reel') {
                zonePhoto.innerHTML = '';
            } else if (!peutGererAvatars) {
                zonePhoto.innerHTML = data.infos.photoAvatar
                    ? `<div class="fiche-adversaire-photo"><img src="${data.infos.photoAvatar}" alt=""></div>`
                    : `<div class="fiche-adversaire-photo avatar-generique"><img src="${iconeGeneriqueAdversaire}" alt=""></div>`;
            } else {
                zonePhoto.innerHTML = `
                    <div class="fiche-adversaire-photo${data.infos.photoAvatar ? '' : ' avatar-generique'}">
                        <img src="${data.infos.photoAvatar || iconeGeneriqueAdversaire}" alt="">
                    </div>
                    <div class="avatar-actions">
                        <button type="button" id="admin-avatar-changer-btn">Changer la photo</button>
                        ${data.infos.photoAvatar ? '<button type="button" id="admin-avatar-retirer-btn">Retirer</button>' : ''}
                    </div>
                    <div class="avatar-format-hint">Format conseillé : 1024 × 1536 px (portrait 2:3)</div>
                    <input type="file" id="admin-avatar-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">
                `;
                document.getElementById('admin-avatar-changer-btn').addEventListener('click', function () {
                    document.getElementById('admin-avatar-input').click();
                });
                document.getElementById('admin-avatar-input').addEventListener('change', async function (e) {
                    const fichier = e.target.files[0];
                    if (!fichier) return;
                    const formData = new FormData();
                    formData.append('photo', fichier);
                    const rep = await fetch('/api/joueur/avatar/' + adversaireId, { method: 'POST', body: formData });
                    const d = await rep.json();
                    if (!rep.ok) { alert(d.error || 'Impossible d\'envoyer cette image.'); return; }
                    chargerFiche();
                });
                const btnRetirer = document.getElementById('admin-avatar-retirer-btn');
                if (btnRetirer) {
                    btnRetirer.addEventListener('click', async function () {
                        const rep = await fetch('/api/joueur/avatar/' + adversaireId, { method: 'DELETE' });
                        const d = await rep.json();
                        if (!rep.ok) { alert(d.error || 'Impossible de retirer cette photo.'); return; }
                        chargerFiche();
                    });
                }
            }

            afficherInfos(data);
            brancherBio();
            afficherPalmares(data);
            afficherDerniersMatchs(data);
            afficherStats(data);
            afficherFaceAFace(data);
            afficherBadges(data);
        }

        document.getElementById('logout-btn').addEventListener('click', function (e) {
            e.preventDefault();
            fetch('/api/deconnexion', { method: 'POST' }).catch(function () {});
            localStorage.removeItem('currentUserId');
            window.location.href = 'index.html';
        });

        document.getElementById('nav-toggle').addEventListener('click', function (e) {
            e.stopPropagation();
            this.classList.toggle('open');
            document.getElementById('nav-dropdown').classList.toggle('open');
        });
        document.addEventListener('click', function () {
            document.getElementById('nav-toggle').classList.remove('open');
            document.getElementById('nav-dropdown').classList.remove('open');
        });

        (async function init() {
            await chargerSemaine();
            await verifierAdmin();
            chargerFiche();
        })();
    </script>
    <script src="retour.js?v=20260829"></script>
    <script src="theme-saison.js?v=20260831"></script>
</body>
</html>
