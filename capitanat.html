<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitanat — Tennis Web Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-inner">
            <div class="dashboard-header">
                <a href="index.html" class="auth-logo">TENNIS WEB MANAGER</a>
                <div class="nav-menu">
                    <button class="nav-menu-toggle" id="nav-toggle">Menu <span class="nav-menu-caret">▾</span></button>
                    <div class="nav-menu-dropdown" id="nav-dropdown">
                        <a href="accueil.html">Accueil</a>
                        <a href="joueur.html">Mes joueurs</a>
                        <a href="tournois.html">Tournois</a>
                        <a href="matchs.html">Matchs</a>
                        <a href="classements.html">Classements</a>
                        <a href="pronostics.html">Pronostics</a>
                        <a href="presse.html">Presse</a>
                        <a href="annuaire.html">Annuaire</a>
                        <a href="capitanat.html">Capitanat</a>
                        <a href="statistiques.html">Statistiques</a>
                        <a href="regles.html">Règles</a>
                        <a href="https://discord.gg/9RwtWEyjF" target="_blank" rel="noopener">Discord</a>
                        <a href="admin.html" id="admin-link" style="display:none;">Administration</a>
                        <a href="#" id="logout-btn">Déconnexion</a>
                    </div>
                </div>
            </div>

            <h1 class="dashboard-title">Capitanat</h1>

            <div id="capitanat-container" style="margin-top:20px;"><p class="match-hint">Chargement...</p></div>
        </div>
    </div>

    <script>
        const userId = sessionStorage.getItem('currentUserId');
        if (!userId) {
            window.location.href = 'connexion.html';
        }

        const LABELS_SURFACE = { dur: 'Dur', terre: 'Terre battue', herbe: 'Herbe' };

        async function verifierAdmin() {
            const response = await fetch('/api/utilisateur/' + userId);
            const data = await response.json();
            if (response.ok && data.user.role === 'admin') {
                document.getElementById('admin-link').style.display = 'inline-block';
            }
        }

        function formulaireSurface(tie, playerId) {
            // Reste affiche (et modifiable) toute la semaine S-3, meme apres un premier
            // choix - pre-selectionne la valeur actuelle le cas echeant. Avant, le
            // formulaire disparaissait des la 1ere soumission (actionRequise ne servait
            // qu'a l'alerte, pas a la visibilite du formulaire), rendant impossible de
            // se raviser (bug signale par l'utilisateur, 2026-08-24). Le serveur refuse
            // de toute facon toute modification une fois sorti de la semaine S-3.
            return `
                <div class="form-group" style="margin-top:16px;">
                    <label>Surface (choix du capitaine de l'équipe à domicile)</label>
                    <select id="surface-select-${tie.id}">
                        <option value="dur" ${tie.surface === 'dur' ? 'selected' : ''}>Dur</option>
                        <option value="terre" ${tie.surface === 'terre' ? 'selected' : ''}>Terre battue</option>
                        <option value="herbe" ${tie.surface === 'herbe' ? 'selected' : ''}>Herbe</option>
                    </select>
                    <button class="cta cta-primary surface-btn" data-tie-id="${tie.id}" data-player-id="${playerId}" style="padding:8px 16px; font-size:0.75rem; margin-top:8px;">${tie.surface ? 'Changer la surface' : 'Valider la surface'}</button>
                </div>
            `;
        }

        function optionsJoueursAvecSelection(liste, valeurActuelle) {
            return (liste || []).map(function (j) {
                const val = `${j.estReel ? 'reel' : 'rival'}-${j.id}`;
                return `<option value="${val}" ${val === valeurActuelle ? 'selected' : ''}>${j.nom}${j.estReel ? '' : ' (bot)'}</option>`;
            }).join('');
        }

        // compositionActuelle (optionnel) : ligne coupe_composition deja enregistree
        // pour cette nation, le cas echeant - pre-selectionne les 4 postes pour
        // pouvoir se raviser sans repartir de zero, meme raison que formulaireSurface
        // ci-dessus (le formulaire reste modifiable toute la semaine S-2, pas
        // seulement au premier essai).
        function formulaireComposition(tie, nation, joueurs, playerId, compositionActuelle) {
            function valeurPoste(estReelCle, idCle) {
                if (!compositionActuelle || compositionActuelle[idCle] == null) return '';
                return `${compositionActuelle[estReelCle] ? 'reel' : 'rival'}-${compositionActuelle[idCle]}`;
            }
            const valA = valeurPoste('joueur_a_est_reel', 'joueur_a_id');
            const valB = valeurPoste('joueur_b_est_reel', 'joueur_b_id');
            const valC = valeurPoste('joueur_c_est_reel', 'joueur_c_id');
            const valD = valeurPoste('joueur_d_est_reel', 'joueur_d_id');
            const valD1 = valeurPoste('double_j1_est_reel', 'double_j1_id');
            const valD2 = valeurPoste('double_j2_est_reel', 'double_j2_id');
            return `
                <div class="form-group" style="margin-top:16px;">
                    <label>Composition — ${nation}</label>
                    <label style="font-size:0.7rem;">Simple 1</label>
                    <select id="compo-a-${tie.id}"><option value="">—</option>${optionsJoueursAvecSelection(joueurs, valA)}</select>
                    <label style="font-size:0.7rem;">Simple 2</label>
                    <select id="compo-b-${tie.id}"><option value="">—</option>${optionsJoueursAvecSelection(joueurs, valB)}</select>
                    <label style="font-size:0.7rem;">Simple 3</label>
                    <select id="compo-c-${tie.id}"><option value="">—</option>${optionsJoueursAvecSelection(joueurs, valC)}</select>
                    <label style="font-size:0.7rem;">Simple 4</label>
                    <select id="compo-d-${tie.id}"><option value="">—</option>${optionsJoueursAvecSelection(joueurs, valD)}</select>
                    <label style="font-size:0.7rem;">Double — joueur 1</label>
                    <select id="compo-d1-${tie.id}"><option value="">—</option>${optionsJoueursAvecSelection(joueurs, valD1)}</select>
                    <label style="font-size:0.7rem;">Double — joueur 2</label>
                    <select id="compo-d2-${tie.id}"><option value="">—</option>${optionsJoueursAvecSelection(joueurs, valD2)}</select>
                    <button class="cta cta-primary compo-btn" data-tie-id="${tie.id}" data-nation="${nation}" data-player-id="${playerId}" style="padding:8px 16px; font-size:0.75rem; margin-top:8px;">${compositionActuelle ? 'Changer la composition' : 'Valider la composition'}</button>
                </div>
            `;
        }

        function carteRubber(r) {
            const label = r.type === 'double' ? 'Double' : 'Simple ' + r.numero;
            return `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value">${r.nation_vainqueur} — ${r.score || ''}</span></div>`;
        }

        // Resultats uniquement (menu deroulant, sans jamais avoir besoin de cliquer
        // vers coupe.html - demande explicite de l'utilisateur, 2026-08-24 : "pas
        // besoin de cliquer sur un autre lien, tout doit etre fait directement sur
        // cette page"). Le style de jeu N'EST PAS un choix de capitaine - chaque
        // coach dont le joueur participe le regle lui-meme depuis sa propre fiche
        // (coupe.html), pas ici (demande explicite separee, meme jour : l'ancienne
        // version affichait a tort un formulaire de style sur cette page). Recharge
        // a chaque ouverture plutot que de mettre en cache (etat simple, cout
        // negligeable a l'echelle de quelques rencontres par capitaine).
        async function basculerDetails(tieId) {
            const zone = document.getElementById('details-zone-' + tieId);
            const ouvert = zone.style.display !== 'none';
            if (ouvert) { zone.style.display = 'none'; return; }

            zone.style.display = 'block';
            zone.innerHTML = '<p class="match-hint">Chargement...</p>';

            const response = await fetch('/api/coupe/tie/' + tieId);
            const data = await response.json();
            if (!response.ok) {
                zone.innerHTML = '<p class="match-hint">' + (data.error || 'Impossible de charger cette rencontre.') + '</p>';
                return;
            }

            zone.innerHTML = data.rubbers.length > 0
                ? data.rubbers.map(carteRubber).join('')
                : '<p class="match-hint">Aucun résultat pour le moment.</p>';
        }

        function carteRencontre(t, playerId) {
            const scoreTxt = t.statut === 'termine'
                ? `${t.victoires_domicile} - ${t.victoires_exterieur} (${t.nation_vainqueur} qualifié)`
                : (t.surface ? LABELS_SURFACE[t.surface] : 'Surface pas encore choisie');
            const urgent = t.actionRequise;
            return `
                <div class="tournoi-card" style="${urgent ? 'border-color:#E24B4A;' : ''} margin-bottom:16px;">
                    <div class="tournoi-card-name">${t.nation_domicile} vs ${t.nation_exterieur}</div>
                    <div class="tournoi-card-meta">${t.manche} · Semaine ${t.positionSemaine} · ${scoreTxt}</div>
                    ${urgent ? `<div class="planning-alerte-texte" style="font-weight:700;">Une action est attendue de ta part cette semaine.</div>` : ''}
                    <div id="action-zone-${t.id}"></div>
                    <button class="cta cta-secondary details-btn" data-tie-id="${t.id}" style="padding:6px 14px; font-size:0.7rem; margin-top:10px;">Voir les résultats</button>
                    <div id="details-zone-${t.id}" style="display:none; margin-top:10px;"></div>
                </div>
            `;
        }

        function sectionNation(playerId, data) {
            const lienTableau = `<p class="match-hint" style="margin-top:10px;"><a class="lien-adversaire" href="coupe-tableau.html?circuit=${data.circuit}">Voir le tableau complet du groupe mondial</a></p>`;
            const corps = data.ties.length === 0
                ? '<p class="match-hint">Aucune rencontre programmée pour cette nation cette saison.</p>'
                : data.ties.map(function (t) { return carteRencontre(t, playerId); }).join('');
            return `
                <div class="stats-header">${data.nation} (${data.circuit === 'ATP' ? 'Coupe Davis' : 'Fed Cup'})</div>
                ${corps}
                ${lienTableau}
            `;
        }

        function attacherActionsDetails() {
            document.querySelectorAll('.details-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    basculerDetails(btn.dataset.tieId);
                });
            });
        }

        function attacherActionsSurface() {
            document.querySelectorAll('.surface-btn').forEach(function (btn) {
                btn.addEventListener('click', async function () {
                    const tieId = btn.dataset.tieId;
                    const playerId = btn.dataset.playerId;
                    const surface = document.getElementById('surface-select-' + tieId).value;
                    const r = await fetch('/api/coupe/surface', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tieId, capitainePlayerId: playerId, surface })
                    });
                    const d = await r.json();
                    if (!r.ok) { alert(d.error); return; }
                    charger();
                });
            });
        }

        function attacherActionsComposition() {
            document.querySelectorAll('.compo-btn').forEach(function (btn) {
                btn.addEventListener('click', async function () {
                    const tieId = btn.dataset.tieId;
                    const nation = btn.dataset.nation;
                    const playerId = btn.dataset.playerId;
                    function lireSelect(id) {
                        const val = document.getElementById(id).value;
                        if (!val) return null;
                        const [type, id2] = val.split('-');
                        return { estReel: type === 'reel', id: Number(id2) };
                    }
                    const joueurA = lireSelect('compo-a-' + tieId);
                    const joueurB = lireSelect('compo-b-' + tieId);
                    const joueurC = lireSelect('compo-c-' + tieId);
                    const joueurD = lireSelect('compo-d-' + tieId);
                    const doubleJ1 = lireSelect('compo-d1-' + tieId);
                    const doubleJ2 = lireSelect('compo-d2-' + tieId);
                    if (!joueurA || !joueurB || !joueurC || !joueurD || !doubleJ1 || !doubleJ2) { alert('Choisis les 6 postes (simple 1 à 4, double 1 et 2).'); return; }
                    const r = await fetch('/api/coupe/composition', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tieId, capitainePlayerId: playerId, nation, joueurA, joueurB, joueurC, joueurD, doubleJ1, doubleJ2 })
                    });
                    const d = await r.json();
                    if (!r.ok) { alert(d.error); return; }
                    charger();
                });
            });
        }

        // Page nav-accessible comme "Classements"/"Tournois" (demande explicite de
        // l'utilisateur, 2026-08-24) : plus de ?playerId= ni de garde qui redirige -
        // elle regarde simplement les personnages du coach connecte et affiche une
        // section par nation dont l'un d'eux est capitaine, ou un message neutre si
        // aucun ne l'est (meme esprit que les autres pages du menu, qui ne redirigent
        // jamais, se contentent d'afficher "rien a voir ici" le cas echeant). Le
        // choix de la surface/composition ne s'active que la semaine correspondante
        // (actionRequise, calcule cote serveur via etapeCoupe).
        async function charger() {
            const container = document.getElementById('capitanat-container');
            container.innerHTML = '<p class="match-hint">Chargement...</p>';

            const reponseJoueurs = await fetch('/api/joueurs/' + userId);
            const dataJoueurs = await reponseJoueurs.json();
            if (!reponseJoueurs.ok || !dataJoueurs.players || dataJoueurs.players.length === 0) {
                container.innerHTML = '<p class="match-hint">Aucun personnage créé.</p>';
                return;
            }

            const sections = [];
            for (const player of dataJoueurs.players) {
                const r = await fetch('/api/coupe/capitanat/' + player.id);
                const data = await r.json();
                if (r.ok) sections.push({ playerId: player.id, data });
            }

            if (sections.length === 0) {
                container.innerHTML = '<p class="match-hint">Tu n\'es capitaine d\'aucune nation cette saison. Le poste se décide en Pré-saison/Semaine 0 (candidature) puis en Semaine 1 (vote), depuis la fiche de ton joueur.</p>';
                return;
            }

            container.innerHTML = sections.map(function (s) { return sectionNation(s.playerId, s.data); }).join('');

            // Le formulaire reste affiche (et modifiable) pendant TOUTE la semaine de
            // l'etape concernee (etape==='surface'/'composition'), pas seulement tant
            // qu'aucun choix n'a encore ete fait - avant, des la 1ere soumission,
            // actionRequise passait a false et le formulaire disparaissait
            // completement, rendant impossible de se raviser avant la fin de la
            // semaine (bug signale par l'utilisateur, 2026-08-24). actionRequise sert
            // maintenant uniquement a l'encadre rouge "action attendue" (carteRencontre
            // ci-dessus), pas a la visibilite du formulaire lui-meme.
            for (const s of sections) {
                const tiesComposition = s.data.ties.filter(function (t) { return t.etape === 'composition'; });
                const tiesSurface = s.data.ties.filter(function (t) { return t.etape === 'surface'; });

                tiesSurface.forEach(function (t) {
                    document.getElementById('action-zone-' + t.id).innerHTML = formulaireSurface(t, s.playerId);
                });

                for (const t of tiesComposition) {
                    const detailResponse = await fetch('/api/coupe/tie/' + t.id);
                    const detail = await detailResponse.json();
                    if (!detailResponse.ok) continue;
                    const joueurs = t.nation_domicile === s.data.nation ? detail.joueursDomicile : detail.joueursExterieur;
                    const compositionActuelle = detail.composition.find(function (c) { return c.nation === s.data.nation; }) || null;
                    document.getElementById('action-zone-' + t.id).innerHTML = formulaireComposition(t, s.data.nation, joueurs, s.playerId, compositionActuelle);
                }
            }

            attacherActionsSurface();
            attacherActionsComposition();
            attacherActionsDetails();
        }

        document.getElementById('logout-btn').addEventListener('click', function (e) {
            e.preventDefault();
            fetch('/api/deconnexion', { method: 'POST' }).catch(function () {});
            sessionStorage.removeItem('currentUserId');
            window.location.href = 'index.html';
        });

        document.getElementById('nav-toggle').addEventListener('click', function (e) {
            e.stopPropagation();
            this.classList.toggle('open');
            document.getElementById('nav-dropdown').classList.toggle('open');
        });
        document.addEventListener('click', function () {
            document.getElementById('nav-toggle').classList.remove('open');
            document.getElementById('nav-dropdown').classList.remove('open');
        });

        verifierAdmin();
        charger();
    </script>
</body>
</html>
