<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes joueurs — Tennis Web Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-inner">
            <div class="dashboard-header">
                <a href="index.html" class="auth-logo">TENNIS WEB MANAGER</a>
                <div class="nav-menu">
                    <button class="nav-menu-toggle" id="nav-toggle">Menu <span class="nav-menu-caret">▾</span></button>
                    <div class="nav-menu-dropdown" id="nav-dropdown">
                        <a href="accueil.html">Accueil</a>
                        <a href="joueur.html">Mes joueurs</a>
                        <a href="tournois.html">Tournois</a>
                        <a href="matchs.html">Matchs</a>
                        <a href="classements.html">Classements</a>
                        <a href="pronostics.html">Pronostics</a>
                        <a href="presse.html">Presse</a>
                        <a href="annuaire.html">Annuaire</a>
                        <a href="statistiques.html">Statistiques</a>
                        <a href="regles.html">Règles</a>
                        <a href="https://discord.gg/9RwtWEyjF" target="_blank" rel="noopener">Discord</a>
                        <a href="admin.html" id="admin-link" style="display:none;">Administration</a>
                        <a href="#" id="logout-btn">Déconnexion</a>
                    </div>
                </div>
            </div>

            <div style="text-align:center;">
                <span class="week-badge" id="semaine-badge">Semaine actuelle : ...</span>
            </div>

            <div class="tabs-nav" id="tabs-nav"></div>

            <div id="semaine-info-container" style="text-align:center; margin-bottom:16px;"></div>

            <div id="planning-container"></div>

            <div class="stats-header">Style de jeu</div>
            <div id="style-container"></div>

            <div id="player-card-container"></div>

            <div class="stats-header">Résultats en tournoi</div>
            <div id="historique-container"></div>

            <div class="stats-header">Journal hebdomadaire</div>
            <div id="journal-container"></div>
        </div>
    </div>

    <script>
        const userId = sessionStorage.getItem('currentUserId');
        if (!userId) {
            window.location.href = 'connexion.html';
        }

        const paramsUrl = new URLSearchParams(window.location.search);
        const typeDemande = paramsUrl.get('type');
        let typeCourant = (typeDemande === 'joueur' || typeDemande === 'joueuse') ? typeDemande : null;
        let joueurData = null;
        let joueuseData = null;

        const COMPETENCES_LABELS = {
            service: 'Service', retour: 'Retour', coup_droit_revers: 'Coup droit / Revers',
            effet: 'Effet', volee: 'Volée', deplacement: 'Déplacement', puissance: 'Puissance', resistance: 'Résistance'
        };

        const DISPOSITIONS_LABELS = {
            adversite: 'Adversité', coupeur_de_tetes: 'Coupeur de têtes', dernier_carre: 'Dernier carré',
            premiers_tours: 'Premiers tours', sang_froid: 'Sang froid', indoor: 'Indoor', rivalite: 'Rivalité'
        };

        // Memes info-bulles "?" que sur creation-joueurs.html, pour rester coherent
        // partout ou ces competences/dispositions sont proposees a la saisie.
        const COMPETENCES_TOOLTIPS = {
            service: 'Dur : 2 · Terre : 1 · Herbe : 2',
            retour: 'Dur : 2 · Terre : 1 · Herbe : 2',
            coup_droit_revers: 'Dur : 2 · Terre : 2 · Herbe : 1',
            effet: 'Dur : 1 · Terre : 2 · Herbe : 2',
            volee: 'Dur : 1 · Terre : 1 · Herbe : 2',
            deplacement: 'Dur : 1 · Terre : 2 · Herbe : 1',
            puissance: 'Dur : 2 · Terre : 1 · Herbe : 1',
            resistance: 'Dur : 1 · Terre : 2 · Herbe : 1'
        };

        const DISPOSITIONS_TOOLTIPS = {
            adversite: 'Contre un adversaire affronté 3 fois ou plus cette saison.',
            coupeur_de_tetes: 'Non tête de série face à une tête de série.',
            dernier_carre: 'En demi-finale ou en finale.',
            premiers_tours: 'Lors des deux premiers tours de chaque tournoi.',
            sang_froid: 'Dans un set décisif.',
            indoor: 'Lors des tournois en intérieur.',
            rivalite: 'Après 12 matchs contre le même adversaire au cours de la carrière.'
        };

        function iconeInfo(texte) {
            return `<span class="info-icon" tabindex="0">?<span class="info-tooltip">${texte}</span></span>`;
        }

        // Delegation (pas un simple querySelectorAll au chargement) : ces panneaux sont
        // injectes dynamiquement a chaque rechargement (planification, inter-saison...),
        // un attachement statique raterait donc les icones ajoutees apres coup.
        document.addEventListener('click', function (e) {
            const icone = e.target.closest('.info-icon');
            if (icone) {
                e.preventDefault();
                e.stopPropagation();
                const etaitActive = icone.classList.contains('active');
                document.querySelectorAll('.info-icon.active').forEach(function (i) { i.classList.remove('active'); });
                if (!etaitActive) icone.classList.add('active');
                return;
            }
            document.querySelectorAll('.info-icon.active').forEach(function (i) { i.classList.remove('active'); });
        });

        const ACTIONS_LABELS = {
            '': '— Non défini —',
            repos: 'Repos',
            generique: 'Entraînement générique (+8 XP)',
            surface_dur: 'Entraînement surface Dur',
            surface_terre: 'Entraînement surface Terre battue',
            surface_herbe: 'Entraînement surface Herbe',
            coaching_mental: 'Coaching mental (0 XP, +1 pt de disposition)'
        };

        function traduireMain(main) {
            return main === 'droitier' ? 'Droitier' : 'Gaucher';
        }

        function traduireStatut(statut) {
            if (statut === 'refuse') return 'Refusé';
            return 'En attente de validation';
        }

        const CONDITION_LABELS = { en_forme: 'En forme', fatigue: 'Fatigué', diminue: 'Diminué', blesse: 'Blessé' };
        const CONDITION_BARRES = { en_forme: 3, fatigue: 2, diminue: 1, blesse: 0 };

        function afficherKine(condition) {
            const cle = condition || 'en_forme';
            const nb = CONDITION_BARRES[cle] !== undefined ? CONDITION_BARRES[cle] : 3;
            const label = CONDITION_LABELS[cle] || 'En forme';
            let barresHtml = '';
            for (let i = 0; i < 3; i++) {
                barresHtml += `<span class="kine-bar${i < nb ? ' kine-bar-remplie' : ''}"></span>`;
            }
            return `
                <div class="kine-status kine-${cle}">
                    <div class="kine-bars">${barresHtml}</div>
                    <span class="kine-label">${label}</span>
                </div>
            `;
        }

        function formaterNom(prenom, nom) {
            const p = (prenom || '').toLowerCase().replace(/(^|[\s'-])\p{L}/gu, function (c) { return c.toUpperCase(); });
            return p + ' ' + (nom || '').toUpperCase();
        }

        function classeAutomatismes(valeur) {
            if (valeur <= 5) return 'energie-rouge';
            if (valeur <= 14) return 'energie-orange';
            if (valeur <= 19) return 'competence-jaune';
            if (valeur <= 25) return 'energie-vert-clair';
            return 'energie-vert-fonce';
        }

        function classeEnergie(points) {
            if (points <= 10) return 'energie-noir';
            if (points <= 25) return 'energie-rouge-fonce';
            if (points <= 35) return 'energie-rouge';
            if (points <= 50) return 'energie-orange';
            if (points <= 74) return 'energie-vert-clair';
            if (points <= 89) return 'energie-vert';
            return 'energie-vert-fonce';
        }

        function classeCompetence(valeur) {
            if (valeur <= 24) return 'competence-vert';
            if (valeur <= 49) return 'competence-jaune';
            if (valeur <= 74) return 'competence-orange';
            if (valeur <= 99) return 'competence-rouge';
            return 'competence-noir';
        }

        function ligneCompetence(label, valeur) {
            return `<div class="bar-row"><span class="bar-label">${label}</span><div class="bar-track"><div class="bar-fill ${classeCompetence(valeur)}" style="width:${Math.min(100, valeur)}%;"></div></div><span class="bar-value">${valeur}</span></div>`;
        }

        // Meme police que les competences (bar-row), mais sans barre de progression
        // visible : une disposition n'a pas de plafond fixe (les gains d'intersaison
        // peuvent depasser 5), donc pas de largeur en % qui aurait un sens.
        function ligneDisposition(label, valeur) {
            return `<div class="bar-row"><span class="bar-label" style="width:140px;">${label}</span><div class="bar-track" style="background:transparent;"></div><span class="bar-value">${valeur}</span></div>`;
        }

        function libellePhase(phase) {
            if (phase.type === 'presaison') return 'Pré-saison (Saison ' + phase.numeroSaison + ')';
            if (phase.type === 's0') return 'Semaine 0 (Saison ' + phase.numeroSaison + ')';
            return 'Semaine ' + phase.positionSemaine + ' (Saison ' + phase.numeroSaison + ')';
        }

        async function chargerSemaine() {
            const response = await fetch('/api/semaine');
            const data = await response.json();
            if (response.ok) {
                document.getElementById('semaine-badge').textContent = 'Semaine actuelle : ' + libellePhase(data.phase);
            }
        }

        async function verifierAdmin() {
            const response = await fetch('/api/utilisateur/' + userId);
            const data = await response.json();
            if (response.ok && data.user.role === 'admin') {
                document.getElementById('admin-link').style.display = 'inline-block';
            }
        }

        async function chargerSemaineInfo(player) {
            const container = document.getElementById('semaine-info-container');
            const response = await fetch('/api/joueur/semaine-info/' + player.id + '?userId=' + userId);
            const data = await response.json();
            if (!response.ok) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <span class="match-hint">Semaine en cours : ${data.semaineActuelle.libelle} · Semaine prochaine : ${data.semaineProchaine.libelle}</span>
            `;
        }

        async function chargerPlanification(player) {
            const container = document.getElementById('planning-container');

            if (player.statut !== 'valide') {
                container.innerHTML = '<p style="text-align:center; color:#8B98A5;">La planification sera disponible une fois ce personnage validé par l\'administrateur.</p>';
                return;
            }

            const responsePlan = await fetch('/api/planification/' + player.id + '?userId=' + userId);
            const dataPlan = await responsePlan.json();
            if (!responsePlan.ok) {
                alert(dataPlan.error);
                return;
            }

            const ordresExistants = {};
            dataPlan.ordres.forEach(function (o) { ordresExistants[o.semaine] = o.action; });

            const tournoisExistants = {};
            dataPlan.tournois.forEach(function (t) { tournoisExistants[t.semaine] = t.nom; });

            let xpHtml = '';
            if (player.points_experience > 0) {
                let repartitionEnAttente = {};
                try { repartitionEnAttente = JSON.parse(player.xp_repartition_en_attente || '{}'); } catch (e) { repartitionEnAttente = {}; }
                const yADejaUneRepartitionEnAttente = Object.keys(repartitionEnAttente).some(function (cle) { return repartitionEnAttente[cle] > 0; });

                let inputsHtml = '';
                Object.keys(COMPETENCES_LABELS).forEach(function (cle) {
                    const valeurEnAttente = repartitionEnAttente[cle] || 0;
                    inputsHtml += `
                        <div class="form-group">
                            <label>${COMPETENCES_LABELS[cle]} ${iconeInfo(COMPETENCES_TOOLTIPS[cle])} (actuel : ${player[cle]})</label>
                            <input type="number" min="0" max="${100 - player[cle]}" value="${valeurEnAttente}" class="xp-input" data-cle="${cle}">
                        </div>
                    `;
                });
                xpHtml = `
                    <div class="xp-pool-panel">
                        <div class="xp-pool-title">Points d'expérience en réserve : <span id="xp-restant">${player.points_experience}</span></div>
                        <div class="planning-alerte-texte" style="margin-bottom:8px;">À programmer cette semaine — non utilisés, ils seront perdus à la prochaine avancée de semaine. La répartition choisie ne s'applique qu'au changement de semaine, une fois l'érosion passée${yADejaUneRepartitionEnAttente ? ' (une répartition est déjà programmée, modifiable ci-dessous)' : ''}.</div>
                        <div class="stats-grid">${inputsHtml}</div>
                        <button class="cta cta-primary repartir-btn" data-pool="${player.points_experience}" style="padding:10px 20px; font-size:0.8rem;">Programmer cette répartition</button>
                    </div>
                `;
            }

            let dispositionsGainHtml = '';
            if (player.points_dispositions_a_gagner > 0) {
                let inputsDispoHtml = '';
                Object.keys(DISPOSITIONS_LABELS).forEach(function (cle) {
                    inputsDispoHtml += `
                        <div class="form-group">
                            <label>${DISPOSITIONS_LABELS[cle]} ${iconeInfo(DISPOSITIONS_TOOLTIPS[cle])} (actuel : ${player['disposition_' + cle]})</label>
                            <input type="number" min="0" value="0" class="dispo-gain-input" data-cle="${cle}">
                        </div>
                    `;
                });
                dispositionsGainHtml = `
                    <div class="xp-pool-panel">
                        <div class="xp-pool-title">Points de disposition en réserve : <span id="dispo-gain-restant">${player.points_dispositions_a_gagner}</span></div>
                        <div class="planning-alerte-texte" style="margin-bottom:8px;">À répartir cette semaine (bonus Coaching mental) — non utilisés, ils seront perdus à la prochaine avancée de semaine.</div>
                        <div class="stats-grid">${inputsDispoHtml}</div>
                        <button class="cta cta-primary dispo-gain-btn" data-pool="${player.points_dispositions_a_gagner}" style="padding:10px 20px; font-size:0.8rem;">Répartir ces points</button>
                    </div>
                `;
            }

            let deplacerHtml = '';
            if (player.points_dispositions_a_deplacer > 0) {
                let optionsDispoHtml = '';
                Object.keys(DISPOSITIONS_LABELS).forEach(function (cle) {
                    optionsDispoHtml += `<option value="${cle}">${DISPOSITIONS_LABELS[cle]}</option>`;
                });
                deplacerHtml = `
                    <div class="xp-pool-panel">
                        <div class="xp-pool-title">Déplacement de disposition disponible : <span>${player.points_dispositions_a_deplacer}</span></div>
                        <div class="planning-alerte-texte" style="margin-bottom:8px;">Déplace 1 point déjà acquis d'une catégorie vers une autre (bonus Coaching mental) — à faire cette semaine, sinon perdu à la prochaine avancée de semaine.</div>
                        <div class="training-row">
                            <select class="dispo-deplacer-depuis">${optionsDispoHtml}</select>
                            <select class="dispo-deplacer-vers">${optionsDispoHtml}</select>
                            <button class="cta cta-primary dispo-deplacer-btn" style="padding:10px 16px; font-size:0.8rem;">Déplacer</button>
                        </div>
                    </div>
                `;
            }

            let weeksHtml = '';
            for (let s = dataPlan.debut; s <= dataPlan.fin; s++) {
                const phaseInfo = dataPlan.phases && dataPlan.phases[s];
                const labelSemaine = phaseInfo ? libellePhase(phaseInfo) : 'Semaine ' + s;

                if (tournoisExistants[s]) {
                    weeksHtml += `
                        <div class="planning-week-card planning-week-tournoi">
                            <label>${labelSemaine}</label>
                            <div class="planning-tournoi-lock">Tournoi : ${tournoisExistants[s]}</div>
                        </div>
                    `;
                    continue;
                }
                if (phaseInfo && phaseInfo.type !== 'tournoi') {
                    weeksHtml += `
                        <div class="planning-week-card planning-week-tournoi">
                            <label>${labelSemaine}</label>
                            <div class="planning-tournoi-lock">${phaseInfo.type === 'presaison' ? 'Pré-saison — rien à planifier' : 'Semaine 0 — préparatifs de la nouvelle saison'}</div>
                        </div>
                    `;
                    continue;
                }
                const valeurActuelle = ordresExistants[s] || '';
                const bientotPerdue = s === dataPlan.debut && valeurActuelle === '';
                let optionsHtml = '';
                Object.keys(ACTIONS_LABELS).forEach(function (val) {
                    optionsHtml += `<option value="${val}" ${val === valeurActuelle ? 'selected' : ''}>${ACTIONS_LABELS[val]}</option>`;
                });
                weeksHtml += `
                    <div class="planning-week-card${bientotPerdue ? ' planning-week-alerte' : ''}">
                        <label>${labelSemaine}</label>
                        <select class="planning-select" data-semaine="${s}">${optionsHtml}</select>
                        ${bientotPerdue ? '<div class="planning-alerte-texte">Non planifiée — bientôt trop tard</div>' : ''}
                    </div>
                `;
            }

            container.innerHTML = `
                ${xpHtml}
                ${dispositionsGainHtml}
                ${deplacerHtml}
                <div class="stats-header">Programmation des 5 prochaines semaines</div>
                <div class="planning-grid">${weeksHtml}</div>
                <button class="cta cta-primary enregistrer-btn" style="padding:12px 24px; font-size:0.85rem;">Enregistrer la planification</button>
            `;

            document.querySelector('.enregistrer-btn').addEventListener('click', async function () {
                const selects = document.querySelectorAll('.planning-select');
                for (const select of selects) {
                    if (select.value === '') continue;
                    await fetch('/api/planification', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId,
                            playerId: player.id,
                            semaine: Number(select.getAttribute('data-semaine')),
                            action: select.value
                        })
                    });
                }
                alert('Planification enregistrée.');
            });

            const repartirBtn = document.querySelector('.repartir-btn');
            if (repartirBtn) {
                repartirBtn.addEventListener('click', async function () {
                    const pool = Number(repartirBtn.getAttribute('data-pool'));
                    const inputs = document.querySelectorAll('.xp-input');

                    const repartition = {};
                    let total = 0;
                    inputs.forEach(function (input) {
                        const val = Number(input.value) || 0;
                        repartition[input.getAttribute('data-cle')] = val;
                        total += val;
                    });

                    if (total > pool) {
                        alert('Tu ne peux pas répartir plus de ' + pool + ' points.');
                        return;
                    }
                    if (total === 0) {
                        alert('Indique au moins un point à répartir.');
                        return;
                    }

                    const response = await fetch('/api/repartir-xp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, playerId: player.id, repartition })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        alert(data.error);
                        return;
                    }
                    alert('Répartition programmée — elle s\'appliquera au prochain changement de semaine.');
                    chargerOnglets();
                });
            }

            const dispoGainBtn = document.querySelector('.dispo-gain-btn');
            if (dispoGainBtn) {
                dispoGainBtn.addEventListener('click', async function () {
                    const pool = Number(dispoGainBtn.getAttribute('data-pool'));
                    const inputs = document.querySelectorAll('.dispo-gain-input');

                    const repartition = {};
                    let total = 0;
                    inputs.forEach(function (input) {
                        const val = Number(input.value) || 0;
                        repartition[input.getAttribute('data-cle')] = val;
                        total += val;
                    });

                    if (total > pool) {
                        alert('Tu ne peux pas répartir plus de ' + pool + ' points.');
                        return;
                    }
                    if (total === 0) {
                        alert('Indique au moins un point à répartir.');
                        return;
                    }

                    const response = await fetch('/api/repartir-dispositions-gain', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, playerId: player.id, repartition })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        alert(data.error);
                        return;
                    }
                    alert('Points de disposition répartis avec succès.');
                    chargerOnglets();
                });
            }

            const dispoDeplacerBtn = document.querySelector('.dispo-deplacer-btn');
            if (dispoDeplacerBtn) {
                dispoDeplacerBtn.addEventListener('click', async function () {
                    const depuis = document.querySelector('.dispo-deplacer-depuis').value;
                    const vers = document.querySelector('.dispo-deplacer-vers').value;

                    if (depuis === vers) {
                        alert('Choisis deux catégories différentes.');
                        return;
                    }

                    const response = await fetch('/api/deplacer-disposition', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, playerId: player.id, depuis, vers })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        alert(data.error);
                        return;
                    }
                    alert('Point de disposition déplacé avec succès.');
                    chargerOnglets();
                });
            }
        }

        const STYLES_JEU_LABELS = {
            aucun: 'Aucun',
            sprinter: 'Sprinter',
            prudence: 'Prudence',
            en_avant: 'En Avant',
            marathonien: 'Marathonien',
            mental_acier: 'Mental d\'acier',
            reperage: 'Repérage'
        };

        async function chargerStyleEnAttente(player) {
            const container = document.getElementById('style-container');
            const response = await fetch('/api/tournois/style-en-attente/' + player.id + '?userId=' + userId);
            const data = await response.json();

            if (!response.ok) {
                container.innerHTML = '<div class="match-hint">' + (data.error || 'Impossible de charger les styles de jeu.') + '</div>';
                return;
            }

            if (!data.tournois || data.tournois.length === 0) {
                container.innerHTML = '<div class="match-hint">Aucun tournoi en attente de style pour le moment — reviens ici une fois le tableau tiré (à S-1).</div>';
                return;
            }

            // Un joueur peut avoir plusieurs tournois "a_venir" en meme temps (celui en
            // cours + le suivant deja tire a S-1) - un panneau independant par tournoi,
            // chacun avec ses propres selecteurs/boutons scopes par tournoi.id pour ne
            // jamais se marcher dessus (demande explicite de l'utilisateur, 2026-08-20).
            container.innerHTML = data.tournois.map(function (bloc) {
                const stylesInterdits = bloc.stylesInterdits || [];
                const tournoiDemarre = bloc.verrouille;
                const plafondMise = bloc.plafondMiseEnergie || 0;
                const maxMise = Math.min(plafondMise, data.pointsEnergieDisponibles || 0);
                const miseHtml = plafondMise > 0 ? `
                    <div class="xp-pool-panel">
                        <div class="xp-pool-title">Mise de points d'énergie (plafond ${plafondMise}, énergie disponible ${data.pointsEnergieDisponibles})</div>
                        <div class="planning-alerte-texte" style="margin-bottom:8px;">S'ajoute au niveau de jeu pendant tout le tournoi, mais définitivement perdue à l'élimination ou à la victoire. ${tournoiDemarre ? 'Le tournoi a déjà commencé, la mise ne peut plus être modifiée.' : 'Modifiable librement jusqu\'au début du tournoi.'}</div>
                        <div class="training-row">
                            <input type="number" min="0" max="${maxMise}" value="${bloc.energieMiseeActuelle || 0}" class="mise-energie-input" style="width:70px;" ${tournoiDemarre ? 'disabled' : ''}>
                            <button class="cta cta-primary mise-energie-btn" style="padding:10px 16px; font-size:0.8rem;" ${tournoiDemarre ? 'disabled' : ''}>Valider la mise</button>
                        </div>
                    </div>
                ` : '';
                const tourActuel = bloc.tournoi.tour_actuel || 0;
                const toursHtml = bloc.labelsTours.map(function (label, i) {
                    const valeurActuelle = bloc.stylesActuels[i] || 'aucun';
                    const dejaJoue = i < tourActuel;
                    const optionsHtml = Object.keys(STYLES_JEU_LABELS).map(function (cle) {
                        const interdit = stylesInterdits.includes(cle);
                        return `<option value="${cle}" ${cle === valeurActuelle ? 'selected' : ''} ${interdit ? 'disabled' : ''}>${STYLES_JEU_LABELS[cle]}${interdit ? ' (déjà utilisé au tournoi précédent)' : ''}</option>`;
                    }).join('');
                    return `
                        <div class="style-tour-card">
                            <label>${label}${dejaJoue ? ' (déjà joué)' : ''}</label>
                            <select class="style-tour-select" data-index="${i}" ${tournoiDemarre ? 'disabled' : ''}>${optionsHtml}</select>
                        </div>
                    `;
                }).join('');

                const texteInterdits = stylesInterdits.length > 0
                    ? ' Interdit(s) car déjà utilisé(s) au tournoi précédent : ' + stylesInterdits.map(function (s) { return STYLES_JEU_LABELS[s] || s; }).join(', ') + '.'
                    : '';

                return `
                    <div class="style-tournoi-bloc" data-tournoi-id="${bloc.tournoi.id}" style="margin-bottom:20px;">
                        <div class="match-hint">${bloc.tournoi.nom} (semaine ${bloc.tournoi.positionSemaine}) — à choisir avant le début du tournoi. Le même style peut être gardé sur plusieurs tours d'affilée.${tournoiDemarre ? ' Le tournoi a déjà commencé, les styles ne sont plus modifiables.' : ''}${texteInterdits}</div>
                        ${miseHtml}
                        <div class="style-tour-grid">${toursHtml}</div>
                        <button class="cta cta-primary style-valider-btn" style="padding:12px 24px; font-size:0.85rem;" ${tournoiDemarre ? 'disabled' : ''}>Valider les styles</button>
                    </div>
                `;
            }).join('');

            data.tournois.forEach(function (bloc) {
                const panneau = container.querySelector('.style-tournoi-bloc[data-tournoi-id="' + bloc.tournoi.id + '"]');

                if (!bloc.verrouille && bloc.plafondMiseEnergie > 0) {
                    panneau.querySelector('.mise-energie-btn').addEventListener('click', async function () {
                        const inputMise = panneau.querySelector('.mise-energie-input');
                        const energieMisee = Number(inputMise.value) || 0;

                        const responseMise = await fetch('/api/tournois/mise-energie', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId, playerId: player.id, tournoiId: bloc.tournoi.id, energieMisee })
                        });
                        const dataMise = await responseMise.json();
                        if (!responseMise.ok) {
                            alert(dataMise.error);
                            return;
                        }
                        alert('Mise d\'énergie enregistrée.');
                        chargerStyleEnAttente(player);
                    });
                }

                if (!bloc.verrouille) {
                    panneau.querySelector('.style-valider-btn').addEventListener('click', async function () {
                        const styles = Array.from(panneau.querySelectorAll('.style-tour-select')).map(function (s) { return s.value; });

                        const responseValider = await fetch('/api/tournois/style', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId, playerId: player.id, tournoiId: bloc.tournoi.id, styles })
                        });
                        const dataValider = await responseValider.json();
                        if (!responseValider.ok) {
                            alert(dataValider.error);
                            return;
                        }
                        alert('Styles de jeu enregistrés.');
                        chargerStyleEnAttente(player);
                    });
                }
            });
        }

        async function chargerRangs(player) {
            const response = await fetch('/api/classement/' + userId);
            const data = await response.json();
            if (!response.ok) return null;

            const circuit = player.type === 'joueur' ? data.atp : data.wta;
            const indexLive = circuit.live.findIndex(function (j) { return j.estMoi; });
            const indexRace = circuit.race.findIndex(function (j) { return j.estMoi; });

            return {
                live: indexLive >= 0 ? indexLive + 1 : null,
                race: indexRace >= 0 ? indexRace + 1 : null
            };
        }

        async function chargerZoneCapitaine(player) {
            const zone = document.getElementById('capitaine-zone');
            if (!zone) return;

            const response = await fetch('/api/coupe/statut-capitaine/' + player.id);
            const data = await response.json();
            if (!response.ok || !data.dansLeTableau) {
                zone.innerHTML = '';
                return;
            }

            const lienRencontres = `<p class="match-hint" style="text-align:left; padding:8px 0 0;"><a class="lien-adversaire" href="coupe.html?playerId=${player.id}">Voir mes rencontres de Coupe Davis / Fed Cup</a></p>`;

            if (data.capitaine) {
                const estMoi = Number(data.capitaine) === Number(player.id);
                zone.innerHTML = `<div class="stat-row"><span class="stat-label">Capitaine Coupe Davis/Fed Cup</span><span class="stat-value">${estMoi ? 'Toi' : 'Désigné'}</span></div>${lienRencontres}`;
                return;
            }

            if (data.fenetreCandidature) {
                if (data.maCandidature) {
                    zone.innerHTML = '<p class="match-hint" style="text-align:left; padding:8px 0 0;">Tu es candidat au poste de capitaine — le vote aura lieu en Semaine 1.</p>' + lienRencontres;
                } else {
                    zone.innerHTML = '<button class="cta cta-secondary" id="candidater-capitaine-btn" style="padding:8px 16px; font-size:0.75rem; margin-top:8px;">Candidater pour être capitaine</button>' + lienRencontres;
                    document.getElementById('candidater-capitaine-btn').addEventListener('click', async function () {
                        const r = await fetch('/api/coupe/candidature', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ playerId: player.id })
                        });
                        const d = await r.json();
                        if (!r.ok) { alert(d.error); return; }
                        chargerZoneCapitaine(player);
                    });
                }
                return;
            }

            if (data.fenetreVote) {
                if (data.candidatures.length === 0) {
                    zone.innerHTML = '<p class="match-hint" style="text-align:left; padding:8px 0 0;">Aucun candidat au poste de capitaine cette saison.</p>' + lienRencontres;
                    return;
                }
                const options = data.candidatures.map(function (c) {
                    return `<option value="${c.player_id}"${Number(data.monVote) === c.player_id ? ' selected' : ''}>${formaterNom(c.prenom, c.nom)}</option>`;
                }).join('');
                zone.innerHTML = `
                    <div class="form-group" style="margin-top:8px;">
                        <label>Vote pour le capitaine</label>
                        <select id="vote-capitaine-select"><option value="">— Choisir —</option>${options}</select>
                        <button class="cta cta-secondary" id="voter-capitaine-btn" style="padding:8px 16px; font-size:0.75rem; margin-top:8px;">Voter</button>
                    </div>
                    ${lienRencontres}
                `;
                document.getElementById('voter-capitaine-btn').addEventListener('click', async function () {
                    const candidatPlayerId = document.getElementById('vote-capitaine-select').value;
                    if (!candidatPlayerId) return;
                    const r = await fetch('/api/coupe/vote', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ votantPlayerId: player.id, candidatPlayerId })
                    });
                    const d = await r.json();
                    if (!r.ok) { alert(d.error); return; }
                    chargerZoneCapitaine(player);
                });
                return;
            }

            zone.innerHTML = lienRencontres;
        }

        async function chargerHistorique(player) {
            const response = await fetch('/api/tournois/historique/' + player.id + '?userId=' + userId);
            const data = await response.json();
            const container = document.getElementById('historique-container');

            if (!response.ok) {
                container.innerHTML = '<div class="match-hint">' + (data.error || 'Impossible de charger l\'historique.') + '</div>';
                return;
            }

            if (data.historique.length === 0) {
                container.innerHTML = '<div class="match-hint">Aucun tournoi disputé pour le moment.</div>';
                return;
            }

            const totalHtml = `<div class="stat-row"><span class="stat-label">Total des points gagnés</span><span class="stat-value">${data.totalPoints}</span></div>`;

            const listeHtml = data.historique.map(function (h) {
                const resultat = h.tour_elimine === 'Vainqueur' ? 'Vainqueur' : (h.tour_elimine ? 'Éliminé : ' + h.tour_elimine : '—');
                const kineBadge = h.kineIntervenu ? '<span class="status-badge kine-badge">Kiné</span>' : '';
                return `
                    <div class="tournoi-card tournoi-card-${h.surface}">
                        <a class="tournoi-card-name" href="tournoi-detail.html?calendrierId=${h.calendrier_id}&semaine=${h.semaine}&playerId=${player.id}">${h.nom} ${kineBadge}</a>
                        <div class="tournoi-card-meta">Semaine ${h.positionSemaine} · ${resultat} · ${h.points_gagnes || 0} points</div>
                    </div>
                `;
            }).join('<div class="separateur-tournoi"></div>');

            container.innerHTML = `${totalHtml}<div class="tournoi-list">${listeHtml}</div>`;
        }

        async function chargerJournal(player) {
            const response = await fetch('/api/journal/' + player.id + '?userId=' + userId);
            const data = await response.json();
            const container = document.getElementById('journal-container');

            if (!response.ok) {
                container.innerHTML = '<div class="match-hint">' + (data.error || 'Impossible de charger le journal.') + '</div>';
                return;
            }

            if (data.journal.length === 0) {
                container.innerHTML = '<div class="match-hint">Rien à afficher pour le moment.</div>';

            const lignesHtml = data.journal.map(function (j) {

                return `

        function attacherHandlersIntersaison(player, onResolu) {
            const moulinetteBtn = document.querySelector('.moulinette-btn');
            if (moulinetteBtn) {
                moulinetteBtn.addEventListener('click', async function () {
                    const inputs = document.querySelectorAll('.moulinette-input');
                    const repartition = {};
                    let total = 0;
                    inputs.forEach(function (input) {
                        const val = Number(input.value) || 0;
                        repartition[input.getAttribute('data-cle')] = val;
                        total += val;
                    });
                    if (total !== player.points_competences_a_repartir) {
                        alert('Le total doit correspondre exactement à ' + player.points_competences_a_repartir + ' points.');
                        return;
                    }
                    const response = await fetch('/api/joueurs/repartir-competences-moulinette', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, playerId: player.id, repartition })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        alert(data.error);
                        return;
                    }
                    onResolu();
                });
            }

            const dispoPerteBtn = document.querySelector('.dispo-perte-btn');
            if (dispoPerteBtn) {
                dispoPerteBtn.addEventListener('click', async function () {
                    const inputs = document.querySelectorAll('.dispo-perte-input');
                    const repartition = {};
                    let total = 0;
                    inputs.forEach(function (input) {
                        const val = Number(input.value) || 0;
                        repartition[input.getAttribute('data-cle')] = val;
                        total += val;
                    });
                    if (total !== player.points_dispositions_a_retirer) {
                        alert('Le total doit correspondre exactement à ' + player.points_dispositions_a_retirer + ' points.');
                        return;
                    }
                    const response = await fetch('/api/repartir-dispositions-perte', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, playerId: player.id, repartition })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        alert(data.error);
                        return;
                    }
                    onResolu();
                });
            }

        }

                    <div class="stats-header" style="margin-top:0;">Inter-saison</div>
                    <p class="planning-alerte-texte" style="margin-bottom:12px;">
                        Il faut résoudre ce qui suit avant de pouvoir continuer à gérer ${formaterNom(player.prenom, player.nom)}.
                    </p>
                    ${contenuIntersaison(player)}
                </div>
            `;
            document.body.appendChild(overlay);
            attacherHandlersIntersaison(player, function () {
                fermerEcranIntersaison();
                chargerOnglets();
            });
        }

async function afficherJoueurCourant() {
            const player = typeCourant === 'joueur' ? joueurData : joueuseData;
            const label = typeCourant === 'joueur' ? 'Mon joueur' : 'Ma joueuse';

            document.title = label + ' — Tennis Web Manager';

            if (!player) {
                document.getElementById('semaine-info-container').innerHTML = '';
                document.getElementById('planning-container').innerHTML = '';
                document.getElementById('style-container').innerHTML = '';
                document.getElementById('historique-container').innerHTML = '';
                document.getElementById('journal-container').innerHTML = '';
                document.getElementById('player-card-container').innerHTML =
                    '<p style="text-align:center; color:#8B98A5;">Pas encore de personnage sur ce circuit — <a href="creation-joueurs.html">créer mes personnages</a>.</p>';
                return;
            }

            const bloquant = player.points_dispositions_a_retirer > 0 || player.points_competences_a_repartir > 0;
            if (bloquant) {
                afficherEcranIntersaison(player);
                return;
            }
            fermerEcranIntersaison();

            await chargerSemaineInfo(player);
            await chargerPlanification(player);
            await chargerStyleEnAttente(player);
            const rangs = await chargerRangs(player);
            afficherCarteJoueur(player, rangs);
            await chargerHistorique(player);
            await chargerJournal(player);
        }

        async function chargerOnglets() {
            const response = await fetch('/api/joueurs/' + userId);
            const data = await response.json();

            if (!response.ok) {
                alert(data.error || 'Impossible de charger tes joueurs.');
                return;
            }
            if (data.players.length === 0) {
                window.location.href = 'creation-joueurs.html';
                return;
            }

            joueurData = data.players.find(function (p) { return p.type === 'joueur'; }) || null;
            joueuseData = data.players.find(function (p) { return p.type === 'joueuse'; }) || null;
            if (typeCourant === null) {
                typeCourant = joueurData ? 'joueur' : 'joueuse';
            }

            const tabsNav = document.getElementById('tabs-nav');
            tabsNav.innerHTML = `
                <button class="tab-btn${typeCourant === 'joueur' ? ' active' : ''}" data-type="joueur">${joueurData ? formaterNom(joueurData.prenom, joueurData.nom) : 'Créer mon joueur'}</button>
                <button class="tab-btn${typeCourant === 'joueuse' ? ' active' : ''}" data-type="joueuse">${joueuseData ? formaterNom(joueuseData.prenom, joueuseData.nom) : 'Créer ma joueuse'}</button>
            `;
            tabsNav.querySelectorAll('.tab-btn').forEach(function (bouton) {
                bouton.addEventListener('click', function () {
                    tabsNav.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
                    bouton.classList.add('active');
                    typeCourant = bouton.dataset.type;
                    afficherJoueurCourant();
                });
            });

            await afficherJoueurCourant();
        }

        document.getElementById('logout-btn').addEventListener('click', function (e) {
            e.preventDefault();
            fetch('/api/deconnexion', { method: 'POST' }).catch(function () {});
            sessionStorage.removeItem('currentUserId');
            window.location.href = 'index.html';
        });

        document.getElementById('nav-toggle').addEventListener('click', function (e) {
            e.stopPropagation();
            this.classList.toggle('open');
            document.getElementById('nav-dropdown').classList.toggle('open');
        });
        document.addEventListener('click', function () {
            document.getElementById('nav-toggle').classList.remove('open');
            document.getElementById('nav-dropdown').classList.remove('open');
        });

        chargerSemaine();
        verifierAdmin();
        chargerOnglets();
    </script>
</body>
</html>
