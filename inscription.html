<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte — Tennis Web Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">TENNIS WEB MANAGER</a>
            <h1 class="auth-title">Créer un compte</h1>

            <form id="signup-form">
                <div class="form-group">
                    <label for="pseudo">Pseudo de coach</label>
                    <input type="text" id="pseudo" name="pseudo" placeholder="Comment veux-tu être identifié" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" placeholder="toi@exemple.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="8 caractères minimum" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="password-confirm">Confirmer le mot de passe</label>
                    <input type="password" id="password-confirm" name="password-confirm" placeholder="Retape ton mot de passe" minlength="8" required>
                </div>
                <button type="submit" class="cta cta-primary auth-submit">Créer mon compte</button>
            </form>

            <p class="auth-switch">Déjà un compte ? <a href="connexion.html">Connexion</a></p>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const pseudo = document.getElementById('pseudo').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;

            if (password !== passwordConfirm) {
                alert('Les mots de passe ne correspondent pas.');
                return;
            }

            const response = await fetch('/api/inscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pseudo, email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.error);
                return;
            }

            localStorage.setItem('currentUserId', data.userId);
            window.location.href = 'creation-joueurs.html';
        });
    </script>
    <script src="retour.js"></script>
</body>
</html>
