<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournoi — Tennis Web Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260829">
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-inner">
            <div class="dashboard-header">
                <a href="index.html" class="auth-logo">TENNIS WEB MANAGER</a>
                <div class="nav-menu">
                    <button class="nav-menu-toggle" id="nav-toggle">Menu <span class="nav-menu-caret">▾</span></button>
                    <div class="nav-menu-dropdown" id="nav-dropdown">
                        <a href="accueil.html">Accueil</a>
                        <a href="joueur.html">Mes joueurs</a>
                        <a href="tournois.html">Tournois</a>
                        <a href="matchs.html">Matchs</a>
                        <a href="classements.html">Classements</a>
                        <a href="pronostics.html">Pronostics</a>
                        <a href="presse.html">Presse</a>
                        <a href="annuaire.html">Annuaire</a>
                        <a href="capitanat.html">Capitanat</a>
                        <a href="statistiques.html">Statistiques</a>
                        <a href="regles.html">Règles</a>
                        <a href="https://discord.gg/9RwtWEyjF" target="_blank" rel="noopener">Discord</a>
                        <a href="admin.html" id="admin-link" style="display:none;">Administration</a>
                        <a href="#" id="logout-btn">Déconnexion</a>
                    </div>
                </div>
            </div>

            <h1 class="dashboard-title" id="tournoi-titre">Tournoi</h1>
            <div style="text-align:center;">
                <span class="week-badge" id="semaine-badge">Semaine ...</span>
            </div>

            <div class="tabs-nav" id="tabs-nav">
                <button class="tab-btn active" data-tab="info">Info tournoi</button>
                <button class="tab-btn" data-tab="inscrits">Inscrits</button>
                <button class="tab-btn" data-tab="tableau">Tableau</button>
                <button class="tab-btn" data-tab="resultats">Résultats</button>
                <button class="tab-btn" data-tab="palmares">Palmarès</button>
            </div>

            <div class="tab-panel" id="tab-info"></div>
            <div class="tab-panel" id="tab-inscrits" style="display:none;"></div>
            <div class="tab-panel tab-panel-wide" id="tab-tableau" style="display:none;"></div>
            <div class="tab-panel" id="tab-resultats" style="display:none;"></div>
            <div class="tab-panel" id="tab-palmares" style="display:none;"></div>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('currentUserId');

        if (!userId) {
            window.location.href = 'connexion.html';
        }

        const params = new URLSearchParams(window.location.search);
        const calendrierId = params.get('calendrierId');
        const semaineCible = parseInt(params.get('semaine'), 10);
        const playerId = params.get('playerId');

        if (!calendrierId || !semaineCible || !playerId) {
            window.location.href = 'tournois.html';
        }

        const LABELS_SURFACE = { dur: 'Dur', terre: 'Terre battue', herbe: 'Herbe' };
        const ORDRE_TOURS_MATCHS = ['Poules', '64e de finale', '32e de finale', '16e de finale', '8e de finale', '1/4 finale', 'Demi-finale', '1/2 finale', 'Finale'];
        const ROUND_LABELS_CLIENT = { 2: 'Finale', 4: '1/2 finale', 8: '1/4 finale', 16: '8e de finale', 32: '16e de finale', 64: '32e de finale', 128: '64e de finale' };

        let ficheCourante = null;
        let semaineActuelleCourante = null;

        function labelCategorie(circuit, categorie) {
            if (categorie === 'slam') return 'Grand Chelem';
            if (categorie === 'finals') return 'Masters (fin de saison)';
            return circuit + ' ' + categorie;
        }

        function labelSurface(info) {
            return LABELS_SURFACE[info.surface] + (info.indoor ? ' (intérieur)' : '');
        }

        function classeSurface(info) {
            return info.surface + (info.surface === 'dur' && info.indoor ? '-indoor' : '');
        }

        function flagImg(code) {
            if (!code) return '';
            return `<img class="flag-icon" src="https://flagcdn.com/24x18/${code}.png" alt="">`;
        }

        function formaterNomComplet(nomComplet) {
            if (!nomComplet || nomComplet === 'BYE') return nomComplet;
            const i = nomComplet.lastIndexOf(' ');
            if (i === -1) return nomComplet;
            const prenom = nomComplet.slice(0, i).toLowerCase().replace(/(^|[\s'-])\p{L}/gu, function (c) { return c.toUpperCase(); });
            return prenom + ' ' + nomComplet.slice(i + 1).toUpperCase();
        }

        // Un adversaire a identite stable (vrai joueur d'un autre coach ou rival
        // persistant du roster de classement) devient un lien vers sa fiche - y
        // compris pour "moi" (le joueur consulte via `playerId`), qui pointe vers la
        // meme fiche adversaire.html que n'importe quel autre joueur reel (demande
        // explicite). Un lambda ou un BYE (ni est_reel ni rival_id renseignes) reste
        // en texte brut, faute d'identite stable a lier.
        function lienAdversaire(nomHtml, estReel, pId, rId) {
            if (estReel && pId) return `<a class="lien-adversaire" href="adversaire.html?type=reel&id=${pId}">${nomHtml}</a>`;
            if (rId) return `<a class="lien-adversaire" href="adversaire.html?type=rival&id=${rId}">${nomHtml}</a>`;
            return nomHtml;
        }

        function labelsPoints(info) {
            if (info.format === 'poules') return ['Vainqueur', 'Finale', 'Demi-finale', 'Poules'];
            return ['Vainqueur', 'Finale', '1/2 finale', '1/4 finale', '8e de finale', '16e de finale', '32e de finale', '64e de finale'];
        }

        function libellePhase(phase) {
            if (phase.type === 'presaison') return 'Pré-saison (Saison ' + phase.numeroSaison + ')';
            if (phase.type === 's0') return 'Semaine 0 (Saison ' + phase.numeroSaison + ')';
            return 'Semaine ' + phase.positionSemaine + ' (Saison ' + phase.numeroSaison + ')';
        }

        async function chargerSemaine() {
            const response = await fetch('/api/semaine');
            const data = await response.json();
            if (response.ok) {
                semaineActuelleCourante = data.semaine_actuelle;
                document.getElementById('semaine-badge').textContent = 'Vu depuis ' + libellePhase(data.phase);
            }
        }

        async function verifierAdmin() {
            const response = await fetch('/api/utilisateur/' + userId);
            const data = await response.json();
            if (response.ok && data.user.role === 'admin') {
                document.getElementById('admin-link').style.display = 'inline-block';
            }
        }

        document.querySelectorAll('.tab-btn').forEach(function (bouton) {
            bouton.addEventListener('click', function () {
                document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
                document.querySelectorAll('.tab-panel').forEach(function (p) { p.style.display = 'none'; });
                bouton.classList.add('active');
                document.getElementById('tab-' + bouton.dataset.tab).style.display = 'block';
            });
        });

        async function inscrire() {
            const bouton = document.getElementById('inscription-btn');
            bouton.disabled = true;
            bouton.textContent = 'Inscription...';

            const response = await fetch('/api/tournois/inscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, playerId, calendrierId, semaine: semaineCible })
            });
            const data = await response.json();

            if (!response.ok) {
                alert(data.error);
                bouton.disabled = false;
                bouton.textContent = 'S\'inscrire';
                return;
            }

            chargerFiche();
        }

        async function desinscrire() {
            const bouton = document.getElementById('inscription-btn');
            bouton.disabled = true;
            bouton.textContent = 'Désinscription...';

            const response = await fetch('/api/tournois/desinscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, playerId, tournoiId: ficheCourante.instance.id })
            });
            const data = await response.json();

            if (!response.ok) {
                alert(data.error);
                bouton.disabled = false;
                bouton.textContent = 'Se désinscrire';
                return;
            }

            alert('Désinscription confirmée.');
            chargerFiche();
        }

        const STYLES_JEU_LABELS = {
            sprinter: 'Sprinter', prudence: 'Prudence', en_avant: 'En Avant',
            marathonien: 'Marathonien', mental_acier: 'Mental d\'acier', reperage: 'Repérage', aucun: 'Aucun'
        };

        function afficherInfo(fiche) {
            const info = fiche.info;
            const panneau = document.getElementById('tab-info');
            const labels = labelsPoints(info);

            let boutonHtml = '';
            if (fiche.estInscrit) {
                const desactive = fiche.instance.statut === 'termine';
                boutonHtml = `<button id="inscription-btn" class="cta cta-secondary" ${desactive ? 'disabled title="Tournoi deja termine"' : ''}>Se désinscrire</button>`;
            } else if (fiche.joueurCondition === 'blesse') {
                boutonHtml = `<div class="match-hint">Joueur blessé — inscription impossible tant qu'il ne s'est pas reposé.</div>`;
            } else if (fiche.joueurPointsEnergie < 1) {
                boutonHtml = `<div class="match-hint">Plus de points d'énergie — inscription impossible.</div>`;
            } else if (fiche.peutInscrire) {
                boutonHtml = `<button id="inscription-btn" class="cta cta-primary">S'inscrire</button>`;
            } else if (fiche.instance && fiche.instance.statut !== 'inscriptions') {
                boutonHtml = `<div class="match-hint">Inscriptions fermées — le tableau a déjà été tiré au sort.</div>`;
            } else {
                boutonHtml = `<div class="match-hint">Inscription pas encore ouverte pour cette édition (ou déjà passée).</div>`;
            }

            let styleHtml = '';
            if (fiche.estInscrit && fiche.instance && fiche.instance.statut === 'termine') {
                const joueurReel = fiche.instance.joueurs.find(function (j) { return j.est_reel && j.player_id === Number(playerId); });
                let stylesUtilises = [];
                try { stylesUtilises = joueurReel && joueurReel.style_choisi ? JSON.parse(joueurReel.style_choisi) : []; } catch (e) { stylesUtilises = []; }
                if (stylesUtilises.length > 0) {
                    const texte = stylesUtilises.map(function (s) { return STYLES_JEU_LABELS[s] || s; }).join(' → ');
                    styleHtml = `<div class="stats-header">Styles de jeu utilisés</div><div class="match-hint">${texte}</div>`;
                }
            } else if (fiche.estInscrit && fiche.instance && fiche.instance.statut === 'a_venir') {
                styleHtml = `<div class="match-hint" style="margin-top:12px;">Les styles de jeu se choisissent sur la fiche du joueur, sous la planification.</div>`;
            }

            panneau.innerHTML = `
                <div class="tournoi-card tournoi-card-${classeSurface(info)}">
                    <div class="stat-row"><span class="stat-label">Pays</span><span class="stat-value">${flagImg(info.paysDrapeau)} ${info.pays}</span></div>
                    <div class="stat-row"><span class="stat-label">Circuit</span><span class="stat-value">${info.circuit === 'ATP' ? 'Masculin (ATP)' : 'Féminin (WTA)'}</span></div>
                    <div class="stat-row"><span class="stat-label">Catégorie</span><span class="stat-value">${labelCategorie(info.circuit, info.categorie)}</span></div>
                    <div class="stat-row"><span class="stat-label">Surface</span><span class="stat-value">${labelSurface(info)}</span></div>
                    <div class="stat-row"><span class="stat-label">Taille du tableau</span><span class="stat-value">${info.taille_tableau}</span></div>
                    <div class="stats-header">Barème de points</div>
                    <table class="points">
                        ${info.baremePoints.map(function (pts, i) { return `<tr><td>${labels[i] || ''}</td><td class="pts">${pts}</td></tr>`; }).join('')}
                    </table>
                    <div style="margin-top:16px;">${boutonHtml}</div>
                    ${styleHtml}
                </div>
            `;

            const btn = document.getElementById('inscription-btn');
            if (btn && !btn.disabled) {
                btn.addEventListener('click', fiche.estInscrit ? desinscrire : inscrire);
            }
        }

        function afficherInscrits(fiche) {
            const panneau = document.getElementById('tab-inscrits');
            const instance = fiche.instance;

            if (!instance) {
                panneau.innerHTML = '<div class="match-hint">La liste des inscrits sera disponible dès l\'ouverture des inscriptions (5 semaines avant le tournoi).</div>';
                return;
            }

            // Les rivaux et les bots (tous deux la pour completer le tableau s'il manque
            // de vrais joueurs) restent invisibles ici - seuls les vrais joueurs
            // confirmes/en attente apparaissent, la liste des inscrits refletant
            // uniquement l'engagement de vraies personnes.
            const tries = instance.joueurs
                .filter(function (j) { return j.est_reel; })
                .sort(function (a, b) {
                    if (a.tete_de_serie && b.tete_de_serie) return a.tete_de_serie - b.tete_de_serie;
                    if (a.tete_de_serie) return -1;
                    if (b.tete_de_serie) return 1;
                    return b.niveau - a.niveau;
                });

            function carteInscrit(j, enAttente) {
                const estMoi = j.est_reel && j.player_id === Number(playerId);
                // Une seule ligne, ordre : classement · drapeau · nom · coach.
                const rangTxt = j.rangRace ? '#' + j.rangRace : 'NC';
                const seed = j.tete_de_serie ? '[' + j.tete_de_serie + '] ' : '';
                const nomLien = lienAdversaire(flagImg(j.drapeau) + ' ' + formaterNomComplet(j.nom), j.est_reel, j.player_id, j.rival_id);
                // Niveau totalement confidentiel ici, y compris le tien - le nom du coach,
                // lui, n'apparait que pour un vrai joueur (les rivaux n'ont pas de coach).
                const suffixes = [];
                if (j.coachNom) suffixes.push('Coach : ' + j.coachNom);
                if (j.tour_elimine) suffixes.push(j.tour_elimine);
                if (enAttente) suffixes.push('en liste d\'attente');
                const classeFond = enAttente ? 'tournoi-card-attente' : 'tournoi-card-highlight';
                return `<div class="tournoi-card ${classeFond} inscrit-card${estMoi ? ' inscrit-card-moi' : ''}">
                    <span class="inscrit-rang">${rangTxt}</span>
                    <span class="inscrit-corps">${seed}${nomLien}${suffixes.length ? ' <span class="inscrit-meta">· ' + suffixes.join(' · ') + '</span>' : ''}</span>
                </div>`;
            }

            const nbConfirmes = tries.length;
            const placesRestantes = instance.taille_tableau - nbConfirmes;
            const noteCompletude = placesRestantes > 0
                ? `<p class="match-hint" style="text-align:left; padding:8px 0;">${placesRestantes} place${placesRestantes > 1 ? 's' : ''} restante${placesRestantes > 1 ? 's' : ''} — complétée${placesRestantes > 1 ? 's' : ''} automatiquement faute d'assez de joueurs humains inscrits.</p>`
                : '';

            panneau.innerHTML = `
                <div class="tournoi-list">
                    ${tries.map(function (j) { return carteInscrit(j, false); }).join('')}
                    ${(instance.enAttente || []).map(function (j) { return carteInscrit(j, true); }).join('')}
                </div>
                ${noteCompletude}
            `;
        }

        function calculerAncetres(roundIndex, ordre) {
            const resultats = [];
            for (let k = 1; roundIndex - k >= 0; k++) {
                const largeur = Math.pow(2, k);
                const debut = ordre * largeur;
                for (let i = 0; i < largeur; i++) {
                    resultats.push(roundIndex - k + '-' + (debut + i));
                }
            }
            return resultats;
        }

        function activerSurbrillanceParcours(panneau) {
            panneau.querySelectorAll('.bracket-match-wrap[data-round-index]').forEach(function (wrap) {
                wrap.addEventListener('mouseenter', function () {
                    const roundIndex = parseInt(wrap.dataset.roundIndex, 10);
                    const ordre = parseInt(wrap.dataset.ordre, 10);
                    const cles = [roundIndex + '-' + ordre].concat(calculerAncetres(roundIndex, ordre));
                    cles.forEach(function (cle) {
                        const cible = panneau.querySelector('.bracket-match-wrap[data-key="' + cle + '"]');
                        if (cible) cible.classList.add('bracket-parcours');
                    });
                });
                wrap.addEventListener('mouseleave', function () {
                    panneau.querySelectorAll('.bracket-parcours').forEach(function (el) { el.classList.remove('bracket-parcours'); });
                });
            });
        }

        function afficherTableau(fiche) {
            const panneau = document.getElementById('tab-tableau');
            const instance = fiche.instance;

            if (!instance) {
                panneau.innerHTML = '<div class="match-hint">La liste des inscrits ouvre 5 semaines avant le tournoi ; le tableau, lui, n\'est tiré au sort qu\'une semaine avant.</div>';
                return;
            }

            if (instance.statut === 'inscriptions') {
                panneau.innerHTML = '<div class="match-hint">Le tableau sera tiré au sort la semaine précédant le tournoi. En attendant, découvre les inscrits dans l\'onglet dédié.</div>';
                return;
            }

            function classeJoueur(estMoi, estReel) {
                return estMoi ? ' bracket-moi' : (!estReel ? ' bracket-bot' : ' bracket-autre-reel');
            }

            function nomJoueurCase(j) {
                if (!j) return '<span class="bracket-joueur bracket-tbd">?</span>';
                if (j.nom === 'BYE') return '<span class="bracket-joueur bracket-bye">BYE</span>';
                const estMoi = j.est_reel && j.player_id === Number(playerId);
                const classe = classeJoueur(estMoi, j.est_reel);
                const rangTxt = j.rang ? ` <span class="bracket-rang">(${j.rang})</span>` : '';
                const nomHtml = lienAdversaire(`${flagImg(j.drapeau)} ${formaterNomComplet(j.nom)}${rangTxt}`, j.est_reel, j.player_id, j.rival_id);
                return `<span class="bracket-joueur${classe}">${nomHtml}</span><span class="bracket-seed">${j.tete_de_serie ? '[' + j.tete_de_serie + ']' : ''}</span>`;
            }

            function nomAffiche(m, cote) {
                const nom = cote === 1 ? m.joueur1_nom : m.joueur2_nom;
                const drap = cote === 1 ? m.joueur1_drapeau : m.joueur2_drapeau;
                const estReel = cote === 1 ? m.joueur1_est_reel : m.joueur2_est_reel;
                const rang = cote === 1 ? m.joueur1_rang : m.joueur2_rang;
                const seed = cote === 1 ? m.joueur1_seed : m.joueur2_seed;
                const pId = cote === 1 ? m.joueur1_player_id : m.joueur2_player_id;
                const rId = cote === 1 ? m.joueur1_rival_id : m.joueur2_rival_id;
                if (!nom) return '<span class="bracket-joueur bracket-bye">BYE</span>';
                const estVainqueur = m.vainqueur_nom === nom;
                const estMoi = estReel && pId === Number(playerId);
                const classes = (estVainqueur ? ' bracket-vainqueur' : '') + classeJoueur(estMoi, estReel);
                const rangTxt = rang ? ` <span class="bracket-rang">(${rang})</span>` : '';
                const nomHtml = lienAdversaire(`${flagImg(drap)} ${formaterNomComplet(nom)}${rangTxt}`, estReel, pId, rId);
                return `<span class="bracket-joueur${classes}">${nomHtml}</span><span class="bracket-seed">${seed ? '[' + seed + ']' : ''}</span>`;
            }

            const parTour = {};
            (instance.matchs || []).forEach(function (m) {
                if (!parTour[m.numero_tour]) parTour[m.numero_tour] = [];
                parTour[m.numero_tour].push(m);
            });
            Object.keys(parTour).forEach(function (t) { parTour[t].sort(function (a, b) { return a.ordre - b.ordre; }); });

            const estElimination = fiche.info.format !== 'poules';
            let colonnesHtml, vainqueurFinal;

            if (estElimination) {
                // Toutes les etapes du tableau (1er tour a la finale) sont affichees en
                // permanence, meme celles pas encore jouees (en pointilles "?") - avant,
                // des qu'un tour etait simule, les etapes suivantes disparaissaient
                // purement et simplement des l'onglet au lieu de rester visibles en
                // attente (bug signale par l'utilisateur, 2026-08-20). Le 1er tour est
                // toujours connu des le tirage au sort (position_tableau), donc toujours
                // affiche avec les vrais noms/BYE meme s'il n'a pas encore ete joue.
                const joueursTries = instance.joueurs
                    .filter(function (j) { return j.position_tableau !== null && j.position_tableau >= 0; })
                    .sort(function (a, b) { return a.position_tableau - b.position_tableau; });

                const labelsRounds = [];
                let entrants = joueursTries.length;
                while (entrants >= 2) {
                    labelsRounds.push(ROUND_LABELS_CLIENT[entrants] || (entrants + 'e de finale'));
                    entrants = entrants / 2;
                }

                const colonnes = labelsRounds.map(function (label, roundIndex) {
                    if (parTour[label]) {
                        return { label: label, matchs: parTour[label].map(function (m) { return { reel: m }; }) };
                    }
                    if (roundIndex === 0) {
                        const paires = [];
                        for (let i = 0; i < joueursTries.length; i += 2) {
                            paires.push({ vide: { j1: joueursTries[i], j2: joueursTries[i + 1] } });
                        }
                        return { label: label, matchs: paires };
                    }
                    const nbMatchsCeTour = Math.pow(2, labelsRounds.length - 1 - roundIndex);
                    const vides = [];
                    for (let i = 0; i < nbMatchsCeTour; i++) vides.push({ vide: { j1: null, j2: null } });
                    return { label: label, matchs: vides };
                });

                const dernierLabel = labelsRounds[labelsRounds.length - 1];
                const finale = parTour[dernierLabel] && parTour[dernierLabel][0];
                vainqueurFinal = finale && finale.vainqueur_nom;

                colonnesHtml = colonnes.map(function (colonne, roundIndex) {
                    return `
                        <div class="bracket-round">
                            <div class="bracket-round-title">${colonne.label}</div>
                            ${colonne.matchs.map(function (m, ordre) {
                                const contenu = m.reel
                                    ? `<div class="bracket-match-row">${nomAffiche(m.reel, 1)}</div>
                                       <div class="bracket-match-row">${nomAffiche(m.reel, 2)}</div>
                                       ${m.reel.score ? `<div class="bracket-score">${m.reel.score}</div>` : ''}`
                                    : `<div class="bracket-match-row">${nomJoueurCase(m.vide.j1)}</div>
                                       <div class="bracket-match-row">${nomJoueurCase(m.vide.j2)}</div>`;
                                return `
                                    <div class="bracket-match-wrap" data-round-index="${roundIndex}" data-ordre="${ordre}" data-key="${roundIndex}-${ordre}">
                                        <div class="bracket-match">${contenu}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }).join('');
            } else {
                // Format poules (Masters de fin de saison) : 2 groupes de 4, connus des le
                // tirage (instance.groupesPoules, jamais retrie) - les 3 manches de poules
                // (SCHEDULE_POULE_4, meme repartition que server.js) sont donc affichees
                // avec les vrais noms des le depart, meme non jouees, comme le 1er tour
                // d'un tableau classique. Demi-finale/Finale restent "a determiner" tant
                // qu'elles n'ont pas ete jouees, avec un apercu base sur le classement de
                // poule EN COURS (demande explicite de l'utilisateur, 2026-08-24 : les
                // poules etaient invisibles avant/pendant/apres le tournoi).
                const SCHEDULE_POULE_4_CLIENT = [[[0, 3], [1, 2]], [[0, 2], [3, 1]], [[0, 1], [2, 3]]];
                const groupes = instance.groupesPoules || { A: [], B: [] };
                const classA = (instance.classementPoules && instance.classementPoules.A) || [];
                const classB = (instance.classementPoules && instance.classementPoules.B) || [];
                const matchsPoules = parTour['Phase de poules'] || [];

                // Ne filtre PAS sur manche_poules : les tournois deja joues avant l'ajout
                // de cette colonne (2026-08-24) l'ont a null pour tous leurs matchs de
                // poules deja enregistres, donc un filtre strict ne trouvait jamais rien et
                // le score n'apparaissait jamais (bug signale par l'utilisateur). Inutile de
                // toute facon : avec 4 joueurs sur 3 manches (round-robin complet), une
                // paire donnee ne se rencontre qu'UNE seule fois dans toute la phase de
                // poules, donc la retrouver par les 2 identifiants suffit sans ambiguite.
                function trouverMatchJoue(id1, id2) {
                    return matchsPoules.find(function (m) {
                        return (m.joueur1_id === id1 && m.joueur2_id === id2) || (m.joueur1_id === id2 && m.joueur2_id === id1);
                    });
                }

                function carteMatchPoule(j1, j2) {
                    if (!j1 || !j2) return '';
                    const joue = trouverMatchJoue(j1.id, j2.id);
                    const ligne1 = joue ? nomAffiche(joue, joue.joueur1_id === j1.id ? 1 : 2) : nomJoueurCase(j1);
                    const ligne2 = joue ? nomAffiche(joue, joue.joueur1_id === j1.id ? 2 : 1) : nomJoueurCase(j2);
                    return `
                        <div class="bracket-match-wrap">
                            <div class="bracket-match">
                                <div class="bracket-match-row">${ligne1}</div>
                                <div class="bracket-match-row">${ligne2}</div>
                                ${joue && joue.score ? `<div class="bracket-score">${joue.score}</div>` : ''}
                            </div>
                        </div>
                    `;
                }

                const manchesHtml = [1, 2, 3].map(function (manche) {
                    const pairesA = SCHEDULE_POULE_4_CLIENT[manche - 1].map(function (p) { return [groupes.A[p[0]], groupes.A[p[1]]]; });
                    const pairesB = SCHEDULE_POULE_4_CLIENT[manche - 1].map(function (p) { return [groupes.B[p[0]], groupes.B[p[1]]]; });
                    return `
                        <div class="bracket-round">
                            <div class="bracket-round-title">Phase de poules (match ${manche})</div>
                            <div class="poule-groupe-label">Groupe A</div>
                            ${pairesA.map(function (pr) { return carteMatchPoule(pr[0], pr[1]); }).join('')}
                            <div class="poule-groupe-label">Groupe B</div>
                            ${pairesB.map(function (pr) { return carteMatchPoule(pr[0], pr[1]); }).join('')}
                        </div>
                    `;
                }).join('');

                function nomProvisoire(entry) {
                    return entry ? flagImg(entry.drapeau) + ' ' + formaterNomComplet(entry.nom) : '?';
                }

                const demiMatchs = (parTour['Demi-finale'] || []).slice().sort(function (a, b) { return a.ordre - b.ordre; });
                const finaleMatch = parTour['Finale'] && parTour['Finale'][0];

                function celluleDemi(m, labelPrevu) {
                    if (m) {
                        return `
                            <div class="bracket-match-wrap">
                                <div class="bracket-match">
                                    <div class="bracket-match-row">${nomAffiche(m, 1)}</div>
                                    <div class="bracket-match-row">${nomAffiche(m, 2)}</div>
                                    ${m.score ? `<div class="bracket-score">${m.score}</div>` : ''}
                                </div>
                            </div>
                        `;
                    }
                    return `
                        <div class="bracket-match-wrap">
                            <div class="bracket-match">
                                <div class="bracket-match-row bracket-tbd-label">${labelPrevu[0]}</div>
                                <div class="bracket-match-row bracket-tbd-label">${labelPrevu[1]}</div>
                            </div>
                        </div>
                    `;
                }

                const demiHtml = `
                    <div class="bracket-round">
                        <div class="bracket-round-title">Demi-finale</div>
                        ${celluleDemi(demiMatchs[0], ['1er Gr. A : ' + nomProvisoire(classA[0]), '2e Gr. B : ' + nomProvisoire(classB[1])])}
                        ${celluleDemi(demiMatchs[1], ['1er Gr. B : ' + nomProvisoire(classB[0]), '2e Gr. A : ' + nomProvisoire(classA[1])])}
                    </div>
                `;

                const finaleHtml = `
                    <div class="bracket-round">
                        <div class="bracket-round-title">Finale</div>
                        ${finaleMatch ? `
                            <div class="bracket-match-wrap">
                                <div class="bracket-match">
                                    <div class="bracket-match-row">${nomAffiche(finaleMatch, 1)}</div>
                                    <div class="bracket-match-row">${nomAffiche(finaleMatch, 2)}</div>
                                    ${finaleMatch.score ? `<div class="bracket-score">${finaleMatch.score}</div>` : ''}
                                </div>
                            </div>
                        ` : `
                            <div class="bracket-match-wrap">
                                <div class="bracket-match">
                                    <div class="bracket-match-row bracket-tbd-label">Vainqueur demi 1</div>
                                    <div class="bracket-match-row bracket-tbd-label">Vainqueur demi 2</div>
                                </div>
                            </div>
                        `}
                    </div>
                `;

                vainqueurFinal = finaleMatch && finaleMatch.vainqueur_nom;
                colonnesHtml = manchesHtml + demiHtml + finaleHtml;
            }

            function tableauClassementGroupe(titre, lignes) {
                return `
                    <div class="poule-classement">
                        <div class="stats-header">${titre}</div>
                        <table class="points poule-classement-table">
                            <thead><tr><th>#</th><th>Joueur</th><th>V</th><th>% Sets</th></tr></thead>
                            <tbody>
                                ${lignes.map(function (l) {
                                    const nomTxt = flagImg(l.drapeau) + ' ' + formaterNomComplet(l.nom) + (l.estMoi ? ' (Toi)' : '');
                                    const nomHtml = lienAdversaire(nomTxt, l.est_reel, l.player_id, l.rival_id);
                                    const pctTxt = l.pctSets === null || l.pctSets === undefined ? '—' : l.pctSets + '%';
                                    return `<tr${l.estMoi ? ' class="poule-ligne-moi"' : ''}><td>${l.rang}</td><td>${nomHtml}</td><td>${l.victoires}</td><td>${pctTxt}</td></tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            const classementsPoulesHtml = (!estElimination && instance.classementPoules) ? `
                <div class="poules-classements">
                    ${tableauClassementGroupe('Groupe A', instance.classementPoules.A)}
                    ${tableauClassementGroupe('Groupe B', instance.classementPoules.B)}
                </div>
            ` : '';

            panneau.innerHTML = `
                ${classementsPoulesHtml}
                <div class="bracket">
                    ${colonnesHtml}
                    <div class="bracket-round bracket-round-vainqueur">
                        <div class="bracket-round-title">Vainqueur</div>
                        <div class="bracket-match-wrap">
                            <div class="bracket-match bracket-match-final">
                                ${vainqueurFinal
                                    ? `<span class="bracket-joueur bracket-vainqueur">${formaterNomComplet(vainqueurFinal)}</span>`
                                    : '<span class="bracket-joueur">?</span>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            if (estElimination) {
                activerSurbrillanceParcours(panneau);
            }
        }

        // ---------- Onglet Resultats (reprend la logique de matchs.html) ----------

        const detailsCache = {};
        const liveEnCours = {};

        // Le journal d'un match stocke "Toi"/"Adversaire" (perspective figee du
        // proprietaire) - on remplace ici par les vrais noms pour l'affichage Live/
        // Teletexte, plus agreable a lire (demande utilisateur, 2026-08-20).
        function remplacerNomsEvenements(match) {
            const nomMoi = formaterNomComplet(match.prenom + ' ' + match.nom);
            const nomAdversaire = match.adversaire_nom ? formaterNomComplet(match.adversaire_nom) : 'Adversaire';
            match.evenements.forEach(function (evt) {
                evt.texte = evt.texte.replace(/\bToi\b/g, nomMoi).replace(/\bAdversaire\b/g, nomAdversaire);
            });
        }

        async function obtenirDetail(matchId) {
            if (detailsCache[matchId]) return detailsCache[matchId];
            const response = await fetch('/api/matchs/detail/' + matchId + '?userId=' + userId);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Impossible de charger ce match.');
            remplacerNomsEvenements(data.match);
            detailsCache[matchId] = data.match;
            return data.match;
        }

        function arreterLive(matchId) {
            if (liveEnCours[matchId]) {
                clearInterval(liveEnCours[matchId]);
                delete liveEnCours[matchId];
            }
        }

        function libelleScore(evt) {
            if (evt.type === 'tie_break_point' || evt.type === 'tie_break_debut') {
                return 'Set ' + evt.numeroSet + ' : Tie-break ' + (evt.ptsA || 0) + '-' + (evt.ptsB || 0) + '  ·  Sets ' + evt.setsA + '-' + evt.setsB;
            }
            if (evt.jeuxA !== undefined && evt.jeuxB !== undefined) {
                return 'Set ' + evt.numeroSet + ' : ' + evt.jeuxA + '-' + evt.jeuxB + '  ·  Sets ' + evt.setsA + '-' + evt.setsB;
            }
            return null;
        }

        function afficherResultatMatch(viewer, match) {
            const vainqueur = match.vainqueur === 'joueur';
            viewer.innerHTML = `
                <div class="match-result ${vainqueur ? 'victoire' : 'defaite'}" style="display:block;">
                    ${vainqueur ? 'Victoire' : 'Défaite'} ${match.score}
                </div>
            `;
        }

        function afficherTeletexteMatch(viewer, match) {
            const lignes = match.evenements.map(function (evt) {
                return `<div class="teletexte-ligne teletexte-${evt.type}">${evt.texte}</div>`;
            }).join('');
            viewer.innerHTML = `<div class="match-journal" style="display:block;">${lignes}</div>`;
        }

        function afficherLiveMatch(viewer, match, matchId) {
            if (!match.estSemaineActuelle) {
                viewer.innerHTML = `<div class="match-hint">Le direct n'est plus disponible pour ce match (semaine passée). Utilise Résultat direct ou Téletexte.</div>`;
                return;
            }

            arreterLive(matchId);

            viewer.innerHTML = `
                <div class="live-score" id="live-score-${matchId}">C'est parti...</div>
                <div class="live-log" id="live-log-${matchId}"></div>
                <button class="cta cta-secondary live-skip-btn" id="live-skip-${matchId}" style="margin-top:10px; padding:8px 16px; font-size:0.75rem;">Passer au résultat final</button>
            `;

            const scoreDiv = document.getElementById('live-score-' + matchId);
            const logDiv = document.getElementById('live-log-' + matchId);
            const skipBtn = document.getElementById('live-skip-' + matchId);

            let index = 0;

            function jouerEvenement(evt) {
                const ligne = document.createElement('div');
                ligne.className = 'live-log-ligne live-log-' + evt.type;
                ligne.textContent = evt.texte;
                logDiv.appendChild(ligne);
                logDiv.scrollTop = logDiv.scrollHeight;

                const score = libelleScore(evt);
                if (score) scoreDiv.textContent = score;
                if (evt.type === 'match_fin') {
                    scoreDiv.textContent = evt.texte;
                    arreterLive(matchId);
                    skipBtn.style.display = 'none';
                }
            }

            function avancer() {
                if (index >= match.evenements.length) {
                    arreterLive(matchId);
                    return;
                }
                jouerEvenement(match.evenements[index]);
                index++;
            }

            avancer();
            liveEnCours[matchId] = setInterval(avancer, 1500);

            skipBtn.addEventListener('click', function () {
                arreterLive(matchId);
                while (index < match.evenements.length) {
                    jouerEvenement(match.evenements[index]);
                    index++;
                }
            });
        }

        async function activerModeMatch(matchId, mode, boutonClique) {
            const carte = document.querySelector('.match-card[data-match-id="' + matchId + '"]');
            const viewer = carte.querySelector('.match-viewer');

            carte.querySelectorAll('.match-mode-btn').forEach(function (b) { b.classList.remove('active'); });
            boutonClique.classList.add('active');

            arreterLive(matchId);
            viewer.style.display = 'block';
            viewer.innerHTML = '<div class="match-viewer-loading">Chargement...</div>';

            try {
                const match = await obtenirDetail(matchId);
                if (mode === 'resultat') afficherResultatMatch(viewer, match);
                else if (mode === 'teletexte') afficherTeletexteMatch(viewer, match);
                else if (mode === 'live') afficherLiveMatch(viewer, match, matchId);
            } catch (err) {
                viewer.innerHTML = '<div class="match-hint">' + err.message + '</div>';
            }
        }

        // Matchs 100% bots (aucun joueur du coach implique) : meme systeme Live/
        // Resultat/Teletexte que les matchs "match-id" ci-dessus, mais source des
        // donnees a part (/api/tournois/match-bot/:id, pas de ligne matchs) - cle de
        // cache/minuteur prefixee "bot-" pour ne jamais entrer en collision avec un
        // vrai matchId.
        async function obtenirDetailBot(tournoiMatchId) {
            const cle = 'bot-' + tournoiMatchId;
            if (detailsCache[cle]) return detailsCache[cle];
            const response = await fetch('/api/tournois/match-bot/' + tournoiMatchId);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Impossible de charger ce match.');
            detailsCache[cle] = data.match;
            return data.match;
        }

        function afficherResultatBot(viewer, match) {
            viewer.innerHTML = `
                <div class="match-result" style="display:block;">
                    Victoire de ${formaterNomComplet(match.vainqueur_nom)} ${match.score}
                </div>
            `;
        }

        function afficherTeletexteBot(viewer, match) {
            const lignes = match.evenements.map(function (evt) {
                return `<div class="teletexte-ligne teletexte-${evt.type}">${evt.texte}</div>`;
            }).join('');
            viewer.innerHTML = `<div class="match-journal" style="display:block;">${lignes}</div>`;

        function afficherLiveBot(viewer, match, tournoiMatchId) {
            if (!match.estSemaineActuelle) {
                viewer.innerHTML = `<div class="match-hint">Le direct n'est plus disponible pour ce match (semaine passée). Utilise Résultat direct ou Téletexte.</div>`;

            const cle = 'bot-' + tournoiMatchId;

            viewer.innerHTML = `
                <div class="live-score" id="live-score-${cle}">C'est parti...</div>
                <div class="live-log" id="live-log-${cle}"></div>

            `;

            const scoreDiv = document.getElementById('live-score-' + cle);
            const logDiv = document.getElementById('live-log-' + cle);
            const skipBtn = document.getElementById('live-skip-' + cle);

            let index = 0;

            function jouerEvenement(evt) {

                ligne.className = 'live-log-ligne live-log-' + evt.type;
                ligne.textContent = evt.texte;
                logDiv.appendChild(ligne);
                logDiv.scrollTop = logDiv.scrollHeight;

                const score = libelleScore(evt);
                if (score) scoreDiv.textContent = score;
                if (evt.type === 'match_fin') {
                    scoreDiv.textContent = evt.texte;
                    arreterLive(cle);
                    skipBtn.style.display = 'none';
                }
            }

            function avancer() {
                if (index >= match.evenements.length) {
                    arreterLive(cle);
                    return;
                }
                jouerEvenement(match.evenements[index]);
                index++;
            }

            avancer();
            liveEnCours[cle] = setInterval(avancer, 1500);

            skipBtn.addEventListener('click', function () {
                arreterLive(cle);
                while (index < match.evenements.length) {
                    jouerEvenement(match.evenements[index]);
                    index++;
                }

        async function activerModeBot(tournoiMatchId, mode, boutonClique) {
            const carte = document.querySelector('.match-card[data-tournoi-match-id="' + tournoiMatchId + '"]');
            const viewer = carte.querySelector('.match-viewer');

            carte.querySelectorAll('.match-mode-btn').forEach(function (b) { b.classList.remove('active'); });
            boutonClique.classList.add('active');

            arreterLive('bot-' + tournoiMatchId);
            viewer.style.display = 'block';
            viewer.innerHTML = '<div class="match-viewer-loading">Chargement...</div>';

            try {
                const match = await obtenirDetailBot(tournoiMatchId);
                if (mode === 'resultat') afficherResultatBot(viewer, match);
                else if (mode === 'teletexte') afficherTeletexteBot(viewer, match);
                else if (mode === 'live') afficherLiveBot(viewer, match, tournoiMatchId);
            } catch (err) {
                viewer.innerHTML = '<div class="match-hint">' + err.message + '</div>';

        function afficherResultats(fiche) {
            const panneau = document.getElementById('tab-resultats');
            const instance = fiche.instance;

            if (!instance) {
                panneau.innerHTML = '<div class="match-hint">Les résultats seront disponibles une fois le tournoi joué.</div>';
                return;
            }

            if (instance.statut === 'inscriptions') {
                panneau.innerHTML = '<div class="match-hint">Le tableau n\'est pas encore tiré au sort — aucun match à afficher pour le moment.</div>';
                return;
            }

            if (!instance.matchs || instance.matchs.length === 0) {
                panneau.innerHTML = '<div class="match-hint">Tableau tiré au sort, en attente du coup d\'envoi.</div>';
                return;
            }

            // Meme tolerance d'un ecart de 1 semaine que /api/matchs (server.js) : un
            // tournoi se joue integralement au moment ou semaine_actuelle avance, donc
            // au moment ou le coach le consulte la semaine courante a deja avance d'un cran.
            const liveDisponible = semaineActuelleCourante - instance.semaine <= 1;

            // Ordre chronologique (1er tour en haut) plutot que le tour le plus avance
            // en premier - ce 2nd ordre spoilait le resultat d'un tour precedent des
            // qu'un tour suivant apparaissait au-dessus (demande explicite de
            // l'utilisateur, 2026-08-20, en revenant sur un choix precedent).
            const matchsTries = instance.matchs.slice().sort(function (a, b) {
                return ORDRE_TOURS_MATCHS.indexOf(a.numero_tour) - ORDRE_TOURS_MATCHS.indexOf(b.numero_tour);
            });

            panneau.innerHTML = '<div class="match-list" id="resultats-match-list"></div>';
            const liste = document.getElementById('resultats-match-list');

            matchsTries.forEach(function (m) {
                const carte = document.createElement('div');
                carte.className = 'match-card';

                const nomJ1 = lienAdversaire(flagImg(m.joueur1_drapeau) + ' ' + formaterNomComplet(m.joueur1_nom || 'BYE'), m.joueur1_est_reel, m.joueur1_player_id, m.joueur1_rival_id);
                const nomJ2 = lienAdversaire(flagImg(m.joueur2_drapeau) + ' ' + formaterNomComplet(m.joueur2_nom || 'BYE'), m.joueur2_est_reel, m.joueur2_player_id, m.joueur2_rival_id);

                if (m.match_id) {
                    carte.dataset.matchId = m.match_id;
                    const liveDisabled = liveDisponible ? '' : 'disabled title="Disponible uniquement pour les matchs de la semaine en cours"';
                    carte.innerHTML = `
                        <div class="match-card-head">
                            <div class="match-card-info">
                                <div class="match-card-name">${nomJ1} vs ${nomJ2}</div>
                                <div class="match-card-meta">${m.numero_tour}</div>
                            </div>
                        </div>
                        <div class="match-card-actions">
                            <button class="match-mode-btn" data-mode="live" ${liveDisabled}>Live</button>
                            <button class="match-mode-btn" data-mode="resultat">Résultat direct</button>
                            <button class="match-mode-btn" data-mode="teletexte">Téletexte</button>
                        </div>
                        <div class="match-viewer"></div>
                    `;
                    liste.appendChild(carte);
                    carte.querySelectorAll('.match-mode-btn').forEach(function (bouton) {
                        if (bouton.disabled) return;
                        bouton.addEventListener('click', function () {
                            activerModeMatch(m.match_id, bouton.dataset.mode, bouton);
                        });
                    });
                } else if (m.aReplayBot) {
                    carte.dataset.tournoiMatchId = m.id;
                    const liveDisabled = liveDisponible ? '' : 'disabled title="Disponible uniquement pour les matchs de la semaine en cours"';
                    carte.innerHTML = `
                        <div class="match-card-head">
                            <div class="match-card-info">
                                <div class="match-card-name">${nomJ1} vs ${nomJ2}</div>
                                <div class="match-card-meta">${m.numero_tour}</div>
                            </div>
                        </div>
                        <div class="match-card-actions">
                            <button class="match-mode-btn" data-mode="live" ${liveDisabled}>Live</button>
                            <button class="match-mode-btn" data-mode="resultat">Résultat direct</button>
                            <button class="match-mode-btn" data-mode="teletexte">Téletexte</button>
                        </div>
                        <div class="match-viewer"></div>
                    `;
                    liste.appendChild(carte);
                    carte.querySelectorAll('.match-mode-btn').forEach(function (bouton) {
                        if (bouton.disabled) return;
                        bouton.addEventListener('click', function () {
                            activerModeBot(m.id, bouton.dataset.mode, bouton);

                    });
                } else {
                    carte.innerHTML = `
                        <div class="match-card-head">

                                <div class="match-card-name">${nomJ1} vs ${nomJ2}</div>
                                <div class="match-card-meta">${m.numero_tour}${m.score ? ' · ' + m.score : ' · BYE'}</div>
                            </div>
                        </div>
                    `;
                    liste.appendChild(carte);
                }
            });
        }

        function afficherPalmares(fiche) {
            const panneau = document.getElementById('tab-palmares');

            if (fiche.palmares.length === 0) {
                panneau.innerHTML = '<div class="match-hint">Aucune édition précédente de ce tournoi n\'a encore eu lieu.</div>';
                return;
            }

            panneau.innerHTML = `
                <div class="tournoi-list">
                    ${fiche.palmares.map(function (p) {
                        const vainqueurTxt = `${flagImg(p.drapeauVainqueur)} ${formaterNomComplet(p.nom_vainqueur) || '-'}`;
                        const resultatHtml = p.participe
                            ? `Vainqueur : ${vainqueurTxt} · Ton résultat : ${p.tourElimineJoueur || '-'} (${p.pointsGagnesJoueur || 0} points)`
                            : `Vainqueur : ${vainqueurTxt}`;
                        return `<div class="tournoi-card"><div class="tournoi-card-name">Saison ${p.numeroSaison}</div>
                            <div class="tournoi-resultat">${resultatHtml}</div></div>`;
                    }).join('')}
                </div>
            `;
        }

        async function chargerFiche() {
            const response = await fetch('/api/tournois/fiche/' + calendrierId + '?userId=' + userId + '&playerId=' + playerId + '&semaine=' + semaineCible);
            const data = await response.json();

            if (!response.ok) {
                document.getElementById('tab-info').innerHTML = '<div class="match-hint">' + (data.error || 'Impossible de charger ce tournoi.') + '</div>';
                return;
            }

            ficheCourante = data;
            document.getElementById('tournoi-titre').textContent = data.info.nom;

            afficherInfo(data);
            afficherInscrits(data);
            afficherTableau(data);
            afficherResultats(data);
            afficherPalmares(data);
        }

        document.getElementById('logout-btn').addEventListener('click', function (e) {
            e.preventDefault();
            fetch('/api/deconnexion', { method: 'POST' }).catch(function () {});
            localStorage.removeItem('currentUserId');
            window.location.href = 'index.html';
        });

        document.getElementById('nav-toggle').addEventListener('click', function (e) {
            e.stopPropagation();
            this.classList.toggle('open');
            document.getElementById('nav-dropdown').classList.toggle('open');
        });
        document.addEventListener('click', function () {
            document.getElementById('nav-toggle').classList.remove('open');
            document.getElementById('nav-dropdown').classList.remove('open');
        });

        (async function init() {
            await chargerSemaine();
            verifierAdmin();
            chargerFiche();
        })();
    </script>

    <script src="theme-saison.js?v=20260831"></script>
</body>
